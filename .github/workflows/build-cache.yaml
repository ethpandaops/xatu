name: Build cache

# Seeds the caches that PR workflows read. GitHub scopes Actions caches to the
# ref that wrote them, and a PR can also read its base branch's, so what this
# writes on master is what a PR's first run starts from. Nothing else runs on
# master pushes, and PR caches alone get evicted within a day.
on:
  push:
    branches: [master]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'deploy/cryo/**'
      - '.github/workflows/build-cache.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  xatu-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Login to DockerHub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Releases also write this cache, but only on tags; refreshing it here
      # means a cryo change stops recompiling (~10 min) in every PR as soon as
      # it merges. Same runner type as the PR smoke tests, so the cache keys
      # match theirs.
      - name: Refresh cryo-builder registry cache
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          target: cryo-builder
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: type=registry,ref=ethpandaops/xatu:cryo-buildcache
          cache-to: type=registry,ref=ethpandaops/xatu:cryo-buildcache,mode=max
      # The Dockerfile's Go cache mounts, persisted with buildkit-cache-dance.
      # The smoke tests restore this read-only, so PRs never write a copy.
      # Keyed like setup-go (go.sum): rebuilt when dependencies change.
      - name: Cache Go module and build caches
        id: go-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/go-mod
            ${{ runner.temp }}/go-build
          key: docker-go-${{ hashFiles('go.sum') }}
          restore-keys: docker-go-
      - name: Inject Go caches into BuildKit
        if: steps.go-cache.outputs.cache-hit != 'true'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "${{ runner.temp }}/go-mod": "/go/pkg/mod",
              "${{ runner.temp }}/go-build": "/root/.cache/go-build"
            }
          scratch-dir: ${{ runner.temp }}/dance-scratch
      - name: Build xatu image to fill the Go caches
        if: steps.go-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          target: builder
          outputs: type=cacheonly
