name: Devnet release branches

# Gives every devnet a release/<network> branch and dispatches
# build-branch.yaml on it, which publishes ethpandaops/xatu:<network>,
# ethpandaops/xatu:<network>-debian and ethpandaops/xatu:<network>-cryo for the
# platform deployment to run.
#
# A devnet's network is <class>-<dir>, or just <dir> when it already starts
# with <class>-, for each kubernetes/<dir> in a non-archived
# ethpandaops/<class>-devnets repo (template-devnets excluded).
# Missing branches are created from master. Existing branches are never
# touched: they are created through the refs API, which refuses a ref that
# already exists, so this can't move, force-push, or delete one.
#
# Runs with GITHUB_TOKEN only. A branch it creates starts no push workflows,
# so it dispatches build-branch.yaml explicitly, which a GITHUB_TOKEN dispatch
# does start. GITHUB_TOKEN lists the org's public repos only; the private
# *-devnets repos (lean-devnets, forkchoice-devnets) have no kubernetes/
# directory, so no networks are missed.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: List the branches it would create without creating them
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create release branches
      actions: write # dispatch build-branch.yaml on them
    steps:
      - name: Create missing release branches
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          org=ethpandaops
          failed=0

          repos=$(gh api --paginate "orgs/${org}/repos?per_page=100" --jq '.[]
            | select(.name | endswith("-devnets")) | select(.archived | not)
            | select(.name != "template-devnets") | .name' | sort)

          networks=()
          for repo in $repos; do
            if ! dirs=$(gh api "repos/${org}/${repo}/contents/kubernetes" --jq '.[] | select(.type == "dir") | .name' 2>&1); then
              if [[ $dirs == *"(HTTP 404)"* ]]; then
                echo "${repo}: no kubernetes/ directory"
              else
                echo "::error::${repo}: ${dirs}"
                failed=1
              fi
              continue
            fi
            class=${repo%-devnets}
            for dir in $dirs; do
              network=$dir
              [[ $dir == "${class}-"* ]] || network="${class}-${dir}"
              # Becomes a branch and Docker tags.
              if [[ ! $network =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
                echo "::warning::${repo}: skipping kubernetes/${dir}, ${network} is not a valid network name"
                continue
              fi
              echo "${repo}: ${network}"
              networks+=("$network")
            done
          done

          existing=$(gh api --paginate "repos/${REPO}/git/matching-refs/heads/release/" --jq '.[].ref')
          master=$(gh api "repos/${REPO}/git/ref/heads/master" --jq '.object.sha')

          echo "| Network | Branch |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for network in "${networks[@]}"; do
            ref="refs/heads/release/${network}"
            if grep -qxF "$ref" <<<"$existing"; then
              result="exists"
            elif [[ $DRY_RUN == true ]]; then
              result="would create from master ${master:0:7}"
            elif gh api -X POST "repos/${REPO}/git/refs" -f ref="$ref" -f sha="$master" --silent; then
              result="created from master ${master:0:7}"
              # Later runs skip the existing branch, so a failed dispatch
              # needs a manual one.
              if gh workflow run build-branch.yaml -R "$REPO" --ref "release/${network}"; then
                result="${result}, build dispatched"
              else
                echo "::error::Failed to dispatch build-branch.yaml on release/${network}. Run: gh workflow run build-branch.yaml -R ${REPO} --ref release/${network}"
                result="${result}, build dispatch failed"
                failed=1
              fi
            else
              echo "::error::Failed to create release/${network}"
              result="failed"
              failed=1
            fi
            echo "release/${network}: ${result}"
            echo "| ${network} | ${result} |" >> "$GITHUB_STEP_SUMMARY"
          done

          exit "$failed"
