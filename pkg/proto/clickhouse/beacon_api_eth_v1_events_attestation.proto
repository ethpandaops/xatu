syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains beacon API eventstream "attestation" data from each sentry client attached to a beacon node.

message BeaconApiEthV1EventsAttestation {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // When the sentry received the event from a beacon node
  int64 event_date_time = 12;
  // Slot number in the beacon API event stream payload
  uint32 slot = 13;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 14;
  // The difference between the event_date_time and the slot_start_date_time
  uint32 propagation_slot_start_diff = 15;
  // The committee index in the beacon API event stream payload
  string committee_index = 16;
  // The index of the validator attesting to the event
  google.protobuf.UInt32Value attesting_validator_index = 17;
  // The committee index of the attesting validator
  string attesting_validator_committee_index = 18;
  // The aggregation bits of the event in the beacon API event stream payload
  string aggregation_bits = 19;
  // The beacon block root hash in the beacon API event stream payload
  string beacon_block_root = 20;
  // The epoch number in the beacon API event stream payload
  uint32 epoch = 21;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 22;
  // The source epoch number in the beacon API event stream payload
  uint32 source_epoch = 23;
  // The wall clock time when the source epoch started
  uint32 source_epoch_start_date_time = 24;
  // The source beacon block root hash in the beacon API event stream payload
  string source_root = 25;
  // The target epoch number in the beacon API event stream payload
  uint32 target_epoch = 26;
  // The wall clock time when the target epoch started
  uint32 target_epoch_start_date_time = 27;
  // The target beacon block root hash in the beacon API event stream payload
  string target_root = 28;
  // Name of the client that generated the event
  string meta_client_name = 29;
  // Version of the client that generated the event
  string meta_client_version = 30;
  // Implementation of the client that generated the event
  string meta_client_implementation = 31;
  // Operating system of the client that generated the event
  string meta_client_os = 32;
  // IP address of the client that generated the event
  google.protobuf.StringValue meta_client_ip = 33;
  // City of the client that generated the event
  string meta_client_geo_city = 34;
  // Country of the client that generated the event
  string meta_client_geo_country = 35;
  // Country code of the client that generated the event
  string meta_client_geo_country_code = 36;
  // Continent code of the client that generated the event
  string meta_client_geo_continent_code = 37;
  // Longitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_longitude = 38;
  // Latitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_latitude = 39;
  // Autonomous system number of the client that generated the event
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 40;
  // Autonomous system organization of the client that generated the event
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 41;
  // Ethereum network name
  string meta_network_name = 42;
  // Ethereum consensus client version that generated the event
  string meta_consensus_version = 43;
  // Ethereum consensus client major version that generated the event
  string meta_consensus_version_major = 44;
  // Ethereum consensus client minor version that generated the event
  string meta_consensus_version_minor = 45;
  // Ethereum consensus client patch version that generated the event
  string meta_consensus_version_patch = 46;
  // Ethereum consensus client implementation that generated the event
  string meta_consensus_implementation = 47;
}

// Request for listing beacon_api_eth_v1_events_attestation records
message ListBeaconApiEthV1EventsAttestationRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 3 - optional)
  StringFilter meta_client_name = 3;

  // Filter by attesting_validator_index - The index of the validator attesting to the event (ORDER BY column 4 - optional)
  NullableUInt32Filter attesting_validator_index = 4;

  // Filter by attesting_validator_committee_index - The committee index of the attesting validator (ORDER BY column 5 - optional)
