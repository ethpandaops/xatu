  UInt32Filter propagation_slot_start_diff = 11;
  // Filter by committee_index - The committee index in the beacon API event stream payload (optional)
  StringFilter committee_index = 12;
  // Filter by epoch - The epoch number in the beacon API event stream payload (optional)
