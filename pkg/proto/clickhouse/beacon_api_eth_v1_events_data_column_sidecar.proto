  int32 page_size = 30;
  // A page token, received from a previous `ListBeaconApiEthV1EventsDataColumnSidecar` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 31;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 32;
}

// Response for listing beacon_api_eth_v1_events_data_column_sidecar records
message ListBeaconApiEthV1EventsDataColumnSidecarResponse {
  // The list of beacon_api_eth_v1_events_data_column_sidecar.
