  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single beacon_api_eth_v1_events_execution_payload record
message GetBeaconApiEthV1EventsExecutionPayloadResponse {
  BeaconApiEthV1EventsExecutionPayload item = 1;
}

// Query beacon_api_eth_v1_events_execution_payload data
service BeaconApiEthV1EventsExecutionPayloadService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListBeaconApiEthV1EventsExecutionPayloadRequest) returns (ListBeaconApiEthV1EventsExecutionPayloadResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetBeaconApiEthV1EventsExecutionPayloadRequest) returns (GetBeaconApiEthV1EventsExecutionPayloadResponse);
