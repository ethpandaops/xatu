syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Execution payload envelope arrivals from beacon API SSE (execution_payload event, fires on import into fork-choice).

message BeaconApiEthV1EventsExecutionPayload {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // When the sentry received the event from a beacon node
  int64 event_date_time = 12;
  // Slot number from the event payload
  uint32 slot = 13;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 14;
  // Difference between event_date_time and slot_start_date_time in ms
  uint32 propagation_slot_start_diff = 15;
  // Epoch number
  uint32 epoch = 16;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 17;
  // Beacon block root the envelope references
  string block_root = 18;
  // Index of the builder that produced the payload, NULL when self-built
  google.protobuf.UInt64Value builder_index = 19;
  // Execution block hash
  string block_hash = 20;
  // Whether the node considered the payload optimistically imported
  bool execution_optimistic = 21;
  // Name of the client that generated the event
  string meta_client_name = 22;
  // Unique Session ID of the client
  string meta_client_id = 23;
  // Version of the client
  string meta_client_version = 24;
  // Implementation of the client
  string meta_client_implementation = 25;
  // Operating system of the client
  string meta_client_os = 26;
  // IP address of the client
  google.protobuf.StringValue meta_client_ip = 27;
  // City of the client
  string meta_client_geo_city = 28;
  // Country of the client
  string meta_client_geo_country = 29;
  // Country code of the client
  string meta_client_geo_country_code = 30;
  // Continent code of the client
  string meta_client_geo_continent_code = 31;
  // Longitude of the client
  google.protobuf.DoubleValue meta_client_geo_longitude = 32;
  // Latitude of the client
  google.protobuf.DoubleValue meta_client_geo_latitude = 33;
  // ASN of the client
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 34;
  // AS organization of the client
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 35;
  // Ethereum network ID
  int32 meta_network_id = 36;
  // Ethereum network name
  string meta_network_name = 37;
  // Consensus client version
  string meta_consensus_version = 38;
  // Consensus client major version
  string meta_consensus_version_major = 39;
  // Consensus client minor version
  string meta_consensus_version_minor = 40;
  // Consensus client patch version
  string meta_consensus_version_patch = 41;
  // Consensus client implementation
  string meta_consensus_implementation = 42;
  // Labels associated with the event
  map<string, string> meta_labels = 43;
}

// Request for listing beacon_api_eth_v1_events_execution_payload records
message ListBeaconApiEthV1EventsExecutionPayloadRequest {
  // Filter by slot_start_date_time - The wall clock time when the slot started (PRIMARY KEY - required)
  UInt32Filter slot_start_date_time = 1;

  // Filter by meta_network_name - Ethereum network name (ORDER BY column 2 - optional)
  StringFilter meta_network_name = 2;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 3 - optional)
  StringFilter meta_client_name = 3;

  // Filter by block_root - Beacon block root the envelope references (ORDER BY column 4 - optional)
  StringFilter block_root = 4;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
