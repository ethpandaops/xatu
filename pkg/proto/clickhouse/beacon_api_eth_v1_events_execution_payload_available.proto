syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Execution payload availability signals from beacon API SSE (execution_payload_available event, fires when payload+blobs are locally verified for PTC vote).

message BeaconApiEthV1EventsExecutionPayloadAvailable {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // When the sentry received the event from a beacon node
  int64 event_date_time = 12;
  // Slot of the block whose payload is now available
  uint32 slot = 13;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 14;
  // Difference between event_date_time and slot_start_date_time in ms
  uint32 propagation_slot_start_diff = 15;
  // Epoch number
  uint32 epoch = 16;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 17;
  // Beacon block root whose payload+blobs are locally available
  string block_root = 18;
  // Name of the client that generated the event
  string meta_client_name = 19;
  // Unique Session ID of the client
  string meta_client_id = 20;
  // Version of the client
  string meta_client_version = 21;
  // Implementation of the client
  string meta_client_implementation = 22;
  // Operating system of the client
  string meta_client_os = 23;
  // IP address of the client
  google.protobuf.StringValue meta_client_ip = 24;
  // City of the client
  string meta_client_geo_city = 25;
  // Country of the client
  string meta_client_geo_country = 26;
  // Country code of the client
  string meta_client_geo_country_code = 27;
  // Continent code of the client
  string meta_client_geo_continent_code = 28;
  // Longitude of the client
  google.protobuf.DoubleValue meta_client_geo_longitude = 29;
  // Latitude of the client
  google.protobuf.DoubleValue meta_client_geo_latitude = 30;
  // ASN of the client
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 31;
  // AS organization of the client
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 32;
  // Ethereum network ID
  int32 meta_network_id = 33;
  // Ethereum network name
  string meta_network_name = 34;
  // Consensus client version
  string meta_consensus_version = 35;
  // Consensus client major version
  string meta_consensus_version_major = 36;
  // Consensus client minor version
  string meta_consensus_version_minor = 37;
  // Consensus client patch version
  string meta_consensus_version_patch = 38;
  // Consensus client implementation
  string meta_consensus_implementation = 39;
  // Labels associated with the event
  map<string, string> meta_labels = 40;
}

