  google.protobuf.StringValue meta_client_ip = 32;
  // City of the client
  string meta_client_geo_city = 33;
  // Country of the client
  string meta_client_geo_country = 34;
  // Country code of the client
  string meta_client_geo_country_code = 35;
  // Continent code of the client
  string meta_client_geo_continent_code = 36;
  // Longitude of the client
  google.protobuf.DoubleValue meta_client_geo_longitude = 37;
  // Latitude of the client
  google.protobuf.DoubleValue meta_client_geo_latitude = 38;
  // ASN of the client
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 39;
  // AS organization of the client
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 40;
  // Ethereum network ID
  int32 meta_network_id = 41;
  // Ethereum network name
  string meta_network_name = 42;
  // Consensus client version
  string meta_consensus_version = 43;
  // Consensus client major version
  string meta_consensus_version_major = 44;
  // Consensus client minor version
  string meta_consensus_version_minor = 45;
  // Consensus client patch version
  string meta_consensus_version_patch = 46;
  // Consensus client implementation
  string meta_consensus_implementation = 47;
