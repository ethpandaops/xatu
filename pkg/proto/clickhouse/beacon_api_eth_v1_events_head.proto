syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Xatu Sentry subscribes to a beacon node's Beacon API event-stream and captures head events. Each row represents a `head` event from the Beacon API `/eth/v1/events?topics=head`, indicating the chain's canonical head has been updated. Sentry adds client metadata and propagation timing. Partition: monthly by `slot_start_date_time`.'

message BeaconApiEthV1EventsHead {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  int64 event_date_time = 12;
  // Slot number in the beacon API event stream payload
  uint32 slot = 13;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 14;
  // The difference between the event_date_time and the slot_start_date_time
  uint32 propagation_slot_start_diff = 15;
  // The beacon block root hash in the beacon API event stream payload
  string block = 16;
  // The epoch number in the beacon API event stream payload
  uint32 epoch = 17;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 18;
  // If the event is an epoch transition
  bool epoch_transition = 19;
  // If the attached beacon node is running in execution optimistic mode
  bool execution_optimistic = 20;
  // The previous duty dependent root in the beacon API event stream payload
  string previous_duty_dependent_root = 21;
  // The current duty dependent root in the beacon API event stream payload
  string current_duty_dependent_root = 22;
  // Name of the client that generated the event
  string meta_client_name = 23;
  // Version of the client that generated the event
  string meta_client_version = 24;
  // Implementation of the client that generated the event
  string meta_client_implementation = 25;
  // Operating system of the client that generated the event
  string meta_client_os = 26;
  // IP address of the client that generated the event
  google.protobuf.StringValue meta_client_ip = 27;
  // City of the client that generated the event
  string meta_client_geo_city = 28;
  // Country of the client that generated the event
  string meta_client_geo_country = 29;
  // Country code of the client that generated the event
  string meta_client_geo_country_code = 30;
  // Continent code of the client that generated the event
  string meta_client_geo_continent_code = 31;
  // Longitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_longitude = 32;
  // Latitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_latitude = 33;
  // Autonomous system number of the client that generated the event
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 34;
  // Autonomous system organization of the client that generated the event
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 35;
  // Ethereum network name
  string meta_network_name = 36;
  // Ethereum consensus client version that generated the event
  string meta_consensus_version = 37;
  // Ethereum consensus client major version that generated the event
  string meta_consensus_version_major = 38;
  // Ethereum consensus client minor version that generated the event
  string meta_consensus_version_minor = 39;
  // Ethereum consensus client patch version that generated the event
  string meta_consensus_version_patch = 40;
  // Ethereum consensus client implementation that generated the event
  string meta_consensus_implementation = 41;
}

// Request for listing beacon_api_eth_v1_events_head records
message ListBeaconApiEthV1EventsHeadRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 3 - optional)
  StringFilter meta_client_name = 3;

  // Filter by block - The beacon block root hash in the beacon API event stream payload (ORDER BY column 4 - optional)
  StringFilter block = 4;

  // Filter by previous_duty_dependent_root - The previous duty dependent root in the beacon API event stream payload (ORDER BY column 5 - optional)
  StringFilter previous_duty_dependent_root = 5;

  // Filter by current_duty_dependent_root - The current duty dependent root in the beacon API event stream payload (ORDER BY column 6 - optional)
  StringFilter current_duty_dependent_root = 6;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 7;
  // Filter by event_date_time (optional)
  Int64Filter event_date_time = 8;
  // Filter by slot - Slot number in the beacon API event stream payload (optional)
  UInt32Filter slot = 9;
  // Filter by propagation_slot_start_diff - The difference between the event_date_time and the slot_start_date_time (optional)
  UInt32Filter propagation_slot_start_diff = 10;
  // Filter by epoch - The epoch number in the beacon API event stream payload (optional)
  UInt32Filter epoch = 11;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 12;
  // Filter by epoch_transition - If the event is an epoch transition (optional)
  BoolFilter epoch_transition = 13;
  // Filter by execution_optimistic - If the attached beacon node is running in execution optimistic mode (optional)
  BoolFilter execution_optimistic = 14;
  // Filter by meta_client_version - Version of the client that generated the event (optional)
  StringFilter meta_client_version = 15;
  // Filter by meta_client_implementation - Implementation of the client that generated the event (optional)
  StringFilter meta_client_implementation = 16;
  // Filter by meta_client_os - Operating system of the client that generated the event (optional)
  StringFilter meta_client_os = 17;
  // Filter by meta_client_ip - IP address of the client that generated the event (optional)
  NullableStringFilter meta_client_ip = 18;
  // Filter by meta_client_geo_city - City of the client that generated the event (optional)
  StringFilter meta_client_geo_city = 19;
  // Filter by meta_client_geo_country - Country of the client that generated the event (optional)
  StringFilter meta_client_geo_country = 20;
  // Filter by meta_client_geo_country_code - Country code of the client that generated the event (optional)
  StringFilter meta_client_geo_country_code = 21;
  // Filter by meta_client_geo_continent_code - Continent code of the client that generated the event (optional)
  StringFilter meta_client_geo_continent_code = 22;
  // Filter by meta_client_geo_longitude - Longitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 23;
  // Filter by meta_client_geo_latitude - Latitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 24;
  // Filter by meta_client_geo_autonomous_system_number - Autonomous system number of the client that generated the event (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 25;
  // Filter by meta_client_geo_autonomous_system_organization - Autonomous system organization of the client that generated the event (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 26;
  // Filter by meta_consensus_version - Ethereum consensus client version that generated the event (optional)
  StringFilter meta_consensus_version = 27;
  // Filter by meta_consensus_version_major - Ethereum consensus client major version that generated the event (optional)
  StringFilter meta_consensus_version_major = 28;
  // Filter by meta_consensus_version_minor - Ethereum consensus client minor version that generated the event (optional)
  StringFilter meta_consensus_version_minor = 29;
  // Filter by meta_consensus_version_patch - Ethereum consensus client patch version that generated the event (optional)
  StringFilter meta_consensus_version_patch = 30;
  // Filter by meta_consensus_implementation - Ethereum consensus client implementation that generated the event (optional)
  StringFilter meta_consensus_implementation = 31;

  // The maximum number of beacon_api_eth_v1_events_head to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 32;
  // A page token, received from a previous `ListBeaconApiEthV1EventsHead` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 33;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 34;
}

// Response for listing beacon_api_eth_v1_events_head records
message ListBeaconApiEthV1EventsHeadResponse {
  // The list of beacon_api_eth_v1_events_head.
  repeated BeaconApiEthV1EventsHead beacon_api_eth_v1_events_head = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single beacon_api_eth_v1_events_head record by primary key
message GetBeaconApiEthV1EventsHeadRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single beacon_api_eth_v1_events_head record
message GetBeaconApiEthV1EventsHeadResponse {
  BeaconApiEthV1EventsHead item = 1;
}

// Query beacon_api_eth_v1_events_head data
service BeaconApiEthV1EventsHeadService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListBeaconApiEthV1EventsHeadRequest) returns (ListBeaconApiEthV1EventsHeadResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetBeaconApiEthV1EventsHeadRequest) returns (GetBeaconApiEthV1EventsHeadResponse);
}
