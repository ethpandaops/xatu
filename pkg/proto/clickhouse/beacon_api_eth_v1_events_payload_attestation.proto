syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Individual PTC payload attestation messages from beacon API SSE (payload_attestation_message event, ~512 per slot).

message BeaconApiEthV1EventsPayloadAttestation {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // When the sentry received the event from a beacon node
  int64 event_date_time = 12;
  // Slot number from the event payload
  uint32 slot = 13;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 14;
  // Difference between event_date_time and slot_start_date_time in ms
  uint32 propagation_slot_start_diff = 15;
  // Epoch number
  uint32 epoch = 16;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 17;
  // Index of the PTC validator
  uint32 validator_index = 18;
  // Block root being attested to
  string beacon_block_root = 19;
  // Whether the validator attests payload was present
  bool payload_present = 20;
  // Whether the validator attests blob data was available
  bool blob_data_available = 21;
  // Name of the client that generated the event
  string meta_client_name = 22;
  // Unique Session ID of the client
  string meta_client_id = 23;
  // Version of the client
  string meta_client_version = 24;
  // Implementation of the client
  string meta_client_implementation = 25;
  // Operating system of the client
  string meta_client_os = 26;
  // IP address of the client
  google.protobuf.StringValue meta_client_ip = 27;
  // City of the client
  string meta_client_geo_city = 28;
  // Country of the client
  string meta_client_geo_country = 29;
  // Country code of the client
  string meta_client_geo_country_code = 30;
  // Continent code of the client
  string meta_client_geo_continent_code = 31;
  // Longitude of the client
  google.protobuf.DoubleValue meta_client_geo_longitude = 32;
  // Latitude of the client
  google.protobuf.DoubleValue meta_client_geo_latitude = 33;
  // ASN of the client
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 34;
  // AS organization of the client
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 35;
  // Ethereum network ID
  int32 meta_network_id = 36;
  // Ethereum network name
  string meta_network_name = 37;
  // Consensus client version
  string meta_consensus_version = 38;
  // Consensus client major version
  string meta_consensus_version_major = 39;
  // Consensus client minor version
  string meta_consensus_version_minor = 40;
  // Consensus client patch version
  string meta_consensus_version_patch = 41;
  // Consensus client implementation
  string meta_consensus_implementation = 42;
  // Labels associated with the event
  map<string, string> meta_labels = 43;
}

// Request for listing beacon_api_eth_v1_events_payload_attestation records
message ListBeaconApiEthV1EventsPayloadAttestationRequest {
  // Filter by slot_start_date_time - The wall clock time when the slot started (PRIMARY KEY - required)
  UInt32Filter slot_start_date_time = 1;

  // Filter by meta_network_name - Ethereum network name (ORDER BY column 2 - optional)
  StringFilter meta_network_name = 2;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 3 - optional)
  StringFilter meta_client_name = 3;

  // Filter by beacon_block_root - Block root being attested to (ORDER BY column 4 - optional)
  StringFilter beacon_block_root = 4;

  // Filter by validator_index - Index of the PTC validator (ORDER BY column 5 - optional)
  UInt32Filter validator_index = 5;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 6;
  // Filter by event_date_time - When the sentry received the event from a beacon node (optional)
  Int64Filter event_date_time = 7;
  // Filter by slot - Slot number from the event payload (optional)
  UInt32Filter slot = 8;
  // Filter by propagation_slot_start_diff - Difference between event_date_time and slot_start_date_time in ms (optional)
  UInt32Filter propagation_slot_start_diff = 9;
  // Filter by epoch - Epoch number (optional)
  UInt32Filter epoch = 10;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 11;
  // Filter by payload_present - Whether the validator attests payload was present (optional)
  BoolFilter payload_present = 12;
  // Filter by blob_data_available - Whether the validator attests blob data was available (optional)
  BoolFilter blob_data_available = 13;
  // Filter by meta_client_id - Unique Session ID of the client (optional)
  StringFilter meta_client_id = 14;
  // Filter by meta_client_version - Version of the client (optional)
  StringFilter meta_client_version = 15;
  // Filter by meta_client_implementation - Implementation of the client (optional)
  StringFilter meta_client_implementation = 16;
  // Filter by meta_client_os - Operating system of the client (optional)
  StringFilter meta_client_os = 17;
  // Filter by meta_client_ip - IP address of the client (optional)
  NullableStringFilter meta_client_ip = 18;
  // Filter by meta_client_geo_city - City of the client (optional)
  StringFilter meta_client_geo_city = 19;
  // Filter by meta_client_geo_country - Country of the client (optional)
  StringFilter meta_client_geo_country = 20;
  // Filter by meta_client_geo_country_code - Country code of the client (optional)
  StringFilter meta_client_geo_country_code = 21;
  // Filter by meta_client_geo_continent_code - Continent code of the client (optional)
  StringFilter meta_client_geo_continent_code = 22;
  // Filter by meta_client_geo_longitude - Longitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 23;
  // Filter by meta_client_geo_latitude - Latitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 24;
  // Filter by meta_client_geo_autonomous_system_number - ASN of the client (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 25;
  // Filter by meta_client_geo_autonomous_system_organization - AS organization of the client (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 26;
  // Filter by meta_network_id - Ethereum network ID (optional)
  Int32Filter meta_network_id = 27;
  // Filter by meta_consensus_version - Consensus client version (optional)
  StringFilter meta_consensus_version = 28;
  // Filter by meta_consensus_version_major - Consensus client major version (optional)
  StringFilter meta_consensus_version_major = 29;
  // Filter by meta_consensus_version_minor - Consensus client minor version (optional)
  StringFilter meta_consensus_version_minor = 30;
  // Filter by meta_consensus_version_patch - Consensus client patch version (optional)
  StringFilter meta_consensus_version_patch = 31;
  // Filter by meta_consensus_implementation - Consensus client implementation (optional)
  StringFilter meta_consensus_implementation = 32;
  // Filter by meta_labels - Labels associated with the event (optional)
  MapStringStringFilter meta_labels = 33;

  // The maximum number of beacon_api_eth_v1_events_payload_attestation to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 34;
  // A page token, received from a previous `ListBeaconApiEthV1EventsPayloadAttestation` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 35;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 36;
}

// Response for listing beacon_api_eth_v1_events_payload_attestation records
message ListBeaconApiEthV1EventsPayloadAttestationResponse {
  // The list of beacon_api_eth_v1_events_payload_attestation.
  repeated BeaconApiEthV1EventsPayloadAttestation beacon_api_eth_v1_events_payload_attestation = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single beacon_api_eth_v1_events_payload_attestation record by primary key
message GetBeaconApiEthV1EventsPayloadAttestationRequest {
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single beacon_api_eth_v1_events_payload_attestation record
message GetBeaconApiEthV1EventsPayloadAttestationResponse {
  BeaconApiEthV1EventsPayloadAttestation item = 1;
}

// Query beacon_api_eth_v1_events_payload_attestation data
service BeaconApiEthV1EventsPayloadAttestationService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListBeaconApiEthV1EventsPayloadAttestationRequest) returns (ListBeaconApiEthV1EventsPayloadAttestationResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetBeaconApiEthV1EventsPayloadAttestationRequest) returns (GetBeaconApiEthV1EventsPayloadAttestationResponse);
}
