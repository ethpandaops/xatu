syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains beacon API /eth/v2/beacon/blocks/{block_id} data from each sentry client attached to a beacon node.

message BeaconApiEthV2BeaconBlock {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  int64 event_date_time = 12;
  // The slot number from beacon block payload
  uint32 slot = 13;
  // The wall clock time when the reorg slot started
  uint32 slot_start_date_time = 14;
  // The epoch number from beacon block payload
  uint32 epoch = 15;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 16;
  // The root hash of the beacon block
  string block_root = 17;
  // The version of the beacon block
  string block_version = 18;
  // The total bytes of the beacon block payload
  google.protobuf.UInt32Value block_total_bytes = 19;
  // The total bytes of the beacon block payload when compressed using snappy
  google.protobuf.UInt32Value block_total_bytes_compressed = 20;
  // The root hash of the parent beacon block
  string parent_root = 21;
  // The root hash of the beacon state at this block
  string state_root = 22;
  // The index of the validator that proposed the beacon block
  uint32 proposer_index = 23;
  // The block hash of the associated execution block
  string eth1_data_block_hash = 24;
  // The root of the deposit tree in the associated execution block
  string eth1_data_deposit_root = 25;
  // The block hash of the execution payload
  google.protobuf.StringValue execution_payload_block_hash = 26;
  // The block number of the execution payload
  google.protobuf.UInt32Value execution_payload_block_number = 27;
  // The recipient of the fee for this execution payload
  google.protobuf.StringValue execution_payload_fee_recipient = 28;
  // Base fee per gas for execution payload
  google.protobuf.StringValue execution_payload_base_fee_per_gas = 29;
  // Gas used for blobs in execution payload
  google.protobuf.UInt64Value execution_payload_blob_gas_used = 30;
  // Excess gas used for blobs in execution payload
  google.protobuf.UInt64Value execution_payload_excess_blob_gas = 31;
  google.protobuf.UInt64Value execution_payload_slot_number = 32;
  // Builder index from the bid (Gloas+)
  google.protobuf.UInt64Value builder_index = 33;
  // Bid value in Gwei (Gloas+)
  google.protobuf.UInt64Value bid_value = 34;
  // Execution payment in Gwei (Gloas+)
  google.protobuf.UInt64Value execution_payment = 35;
  // Whether execution payload was delivered (Gloas+)
  google.protobuf.BoolValue payload_present = 36;
  // Gas limit for execution payload
  google.protobuf.UInt64Value execution_payload_gas_limit = 37;
  // Gas used for execution payload
  google.protobuf.UInt64Value execution_payload_gas_used = 38;
  // The state root of the execution payload
  string execution_payload_state_root = 39;
  // The parent hash of the execution payload
  string execution_payload_parent_hash = 40;
  // The transaction count of the execution payload
  google.protobuf.UInt32Value execution_payload_transactions_count = 41;
  // The transaction total bytes of the execution payload
  google.protobuf.UInt32Value execution_payload_transactions_total_bytes = 42;
  // The transaction total bytes of the execution payload when compressed using snappy
  google.protobuf.UInt32Value execution_payload_transactions_total_bytes_compressed = 43;
  // Name of the client that generated the event
  string meta_client_name = 44;
  // Version of the client that generated the event
  string meta_client_version = 45;
  // Implementation of the client that generated the event
  string meta_client_implementation = 46;
  // Operating system of the client that generated the event
  string meta_client_os = 47;
  // IP address of the client that generated the event
  google.protobuf.StringValue meta_client_ip = 48;
  // City of the client that generated the event
  string meta_client_geo_city = 49;
  // Country of the client that generated the event
  string meta_client_geo_country = 50;
  // Country code of the client that generated the event
  string meta_client_geo_country_code = 51;
  // Continent code of the client that generated the event
  string meta_client_geo_continent_code = 52;
  // Longitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_longitude = 53;
  // Latitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_latitude = 54;
  // Autonomous system number of the client that generated the event
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 55;
  // Autonomous system organization of the client that generated the event
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 56;
  // Ethereum network name
  string meta_network_name = 57;
  // Ethereum consensus client version that generated the event
  string meta_consensus_version = 58;
  // Ethereum consensus client major version that generated the event
  string meta_consensus_version_major = 59;
  // Ethereum consensus client minor version that generated the event
  string meta_consensus_version_minor = 60;
  // Ethereum consensus client patch version that generated the event
  string meta_consensus_version_patch = 61;
  // Ethereum consensus client implementation that generated the event
  string meta_consensus_implementation = 62;
}

