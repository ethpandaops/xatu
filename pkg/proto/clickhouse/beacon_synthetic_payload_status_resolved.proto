syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Fork-choice payload status transitions (EIP-7732 ePBS) synthesized from TYSM-instrumented beacon node internals. Multi-witness (per-node).

message BeaconSyntheticPayloadStatusResolved {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // When the beacon node resolved the status (TYSM ResolvedAt)
  int64 event_date_time = 12;
  // Slot number whose payload status was resolved
  uint32 slot = 13;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 14;
  // Difference between event_date_time and slot_start_date_time in ms
  uint32 propagation_slot_start_diff = 15;
  // Epoch number
  uint32 epoch = 16;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 17;
  // Beacon block root for this slot
  string block_root = 18;
  // Execution block hash (when known)
  string block_hash = 19;
  // New status: PENDING / FULL / EMPTY / INVALID
  string status = 20;
  // Previous status before this transition
  string previous_status = 21;
  // Count of PTC votes with payload_present=true
  uint64 payload_timeliness_votes_positive = 22;
  // Count of PTC votes with payload_present=false (explicit negative). NULL when CL does not surface three-state PR #5180 breakdown
  google.protobuf.UInt64Value payload_timeliness_votes_negative = 23;
  // Count of PTC seats with no vote (Optional[bool]==None per PR #5180). NULL when CL does not surface the breakdown
  google.protobuf.UInt64Value payload_timeliness_votes_absent = 24;
  // Count of PTC votes with blob_data_available=true
  uint64 data_available_votes_positive = 25;
  // Count of PTC votes with blob_data_available=false (explicit negative). NULL when CL does not surface three-state PR #5180 breakdown
  google.protobuf.UInt64Value data_available_votes_negative = 26;
  // Count of PTC seats with no data-availability vote (Optional[bool]==None per PR #5180). NULL when CL does not surface the breakdown
  google.protobuf.UInt64Value data_available_votes_absent = 27;
  // Total PTC committee size (typically 512)
  uint64 ptc_size = 28;
  // Name of the client that generated the event
  string meta_client_name = 29;
  // Unique Session ID of the client
  string meta_client_id = 30;
  // Version of the client
  string meta_client_version = 31;
  // Implementation of the client
  string meta_client_implementation = 32;
  // Operating system of the client
  string meta_client_os = 33;
  // IP address of the client
  google.protobuf.StringValue meta_client_ip = 34;
  // City of the client
  string meta_client_geo_city = 35;
  // Country of the client
  string meta_client_geo_country = 36;
  // Country code of the client
  string meta_client_geo_country_code = 37;
  // Continent code of the client
  string meta_client_geo_continent_code = 38;
  // Longitude of the client
  google.protobuf.DoubleValue meta_client_geo_longitude = 39;
  // Latitude of the client
  google.protobuf.DoubleValue meta_client_geo_latitude = 40;
  // ASN of the client
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 41;
  // AS organization of the client
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 42;
  // Ethereum network ID
  int32 meta_network_id = 43;
  // Ethereum network name
  string meta_network_name = 44;
  // Consensus client version
  string meta_consensus_version = 45;
  // Consensus client major version
  string meta_consensus_version_major = 46;
  // Consensus client minor version
  string meta_consensus_version_minor = 47;
  // Consensus client patch version
  string meta_consensus_version_patch = 48;
  // Consensus client implementation
  string meta_consensus_implementation = 49;
  // Labels associated with the event
  map<string, string> meta_labels = 50;
}

// Request for listing beacon_synthetic_payload_status_resolved records
message ListBeaconSyntheticPayloadStatusResolvedRequest {
  // Filter by slot_start_date_time - The wall clock time when the slot started (PRIMARY KEY - required)
  UInt32Filter slot_start_date_time = 1;

  // Filter by meta_network_name - Ethereum network name (ORDER BY column 2 - optional)
  StringFilter meta_network_name = 2;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 3 - optional)
  StringFilter meta_client_name = 3;

  // Filter by block_root - Beacon block root for this slot (ORDER BY column 4 - optional)
  StringFilter block_root = 4;

  // Filter by status - New status: PENDING / FULL / EMPTY / INVALID (ORDER BY column 5 - optional)
  StringFilter status = 5;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 6;
  // Filter by event_date_time - When the beacon node resolved the status (TYSM ResolvedAt) (optional)
  Int64Filter event_date_time = 7;
  // Filter by slot - Slot number whose payload status was resolved (optional)
  UInt32Filter slot = 8;
  // Filter by propagation_slot_start_diff - Difference between event_date_time and slot_start_date_time in ms (optional)
  UInt32Filter propagation_slot_start_diff = 9;
  // Filter by epoch - Epoch number (optional)
  UInt32Filter epoch = 10;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 11;
  // Filter by block_hash - Execution block hash (when known) (optional)
  StringFilter block_hash = 12;
  // Filter by previous_status - Previous status before this transition (optional)
  StringFilter previous_status = 13;
  // Filter by payload_timeliness_votes_positive - Count of PTC votes with payload_present=true (optional)
  UInt64Filter payload_timeliness_votes_positive = 14;
  // Filter by payload_timeliness_votes_negative - Count of PTC votes with payload_present=false (explicit negative). NULL when CL does not surface three-state PR #5180 breakdown (optional)
  NullableUInt64Filter payload_timeliness_votes_negative = 15;
  // Filter by payload_timeliness_votes_absent - Count of PTC seats with no vote (Optional[bool]==None per PR #5180). NULL when CL does not surface the breakdown (optional)
  NullableUInt64Filter payload_timeliness_votes_absent = 16;
  // Filter by data_available_votes_positive - Count of PTC votes with blob_data_available=true (optional)
  UInt64Filter data_available_votes_positive = 17;
  // Filter by data_available_votes_negative - Count of PTC votes with blob_data_available=false (explicit negative). NULL when CL does not surface three-state PR #5180 breakdown (optional)
  NullableUInt64Filter data_available_votes_negative = 18;
  // Filter by data_available_votes_absent - Count of PTC seats with no data-availability vote (Optional[bool]==None per PR #5180). NULL when CL does not surface the breakdown (optional)
  NullableUInt64Filter data_available_votes_absent = 19;
  // Filter by ptc_size - Total PTC committee size (typically 512) (optional)
  UInt64Filter ptc_size = 20;
  // Filter by meta_client_id - Unique Session ID of the client (optional)
  StringFilter meta_client_id = 21;
  // Filter by meta_client_version - Version of the client (optional)
  StringFilter meta_client_version = 22;
  // Filter by meta_client_implementation - Implementation of the client (optional)
  StringFilter meta_client_implementation = 23;
  // Filter by meta_client_os - Operating system of the client (optional)
  StringFilter meta_client_os = 24;
  // Filter by meta_client_ip - IP address of the client (optional)
  NullableStringFilter meta_client_ip = 25;
  // Filter by meta_client_geo_city - City of the client (optional)
  StringFilter meta_client_geo_city = 26;
  // Filter by meta_client_geo_country - Country of the client (optional)
  StringFilter meta_client_geo_country = 27;
  // Filter by meta_client_geo_country_code - Country code of the client (optional)
  StringFilter meta_client_geo_country_code = 28;
  // Filter by meta_client_geo_continent_code - Continent code of the client (optional)
  StringFilter meta_client_geo_continent_code = 29;
  // Filter by meta_client_geo_longitude - Longitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 30;
  // Filter by meta_client_geo_latitude - Latitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 31;
  // Filter by meta_client_geo_autonomous_system_number - ASN of the client (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 32;
  // Filter by meta_client_geo_autonomous_system_organization - AS organization of the client (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 33;
  // Filter by meta_network_id - Ethereum network ID (optional)
  Int32Filter meta_network_id = 34;
  // Filter by meta_consensus_version - Consensus client version (optional)
  StringFilter meta_consensus_version = 35;
  // Filter by meta_consensus_version_major - Consensus client major version (optional)
  StringFilter meta_consensus_version_major = 36;
  // Filter by meta_consensus_version_minor - Consensus client minor version (optional)
  StringFilter meta_consensus_version_minor = 37;
  // Filter by meta_consensus_version_patch - Consensus client patch version (optional)
  StringFilter meta_consensus_version_patch = 38;
  // Filter by meta_consensus_implementation - Consensus client implementation (optional)
  StringFilter meta_consensus_implementation = 39;
  // Filter by meta_labels - Labels associated with the event (optional)
  MapStringStringFilter meta_labels = 40;

  // The maximum number of beacon_synthetic_payload_status_resolved to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 41;
  // A page token, received from a previous `ListBeaconSyntheticPayloadStatusResolved` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 42;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 43;
}

// Response for listing beacon_synthetic_payload_status_resolved records
message ListBeaconSyntheticPayloadStatusResolvedResponse {
  // The list of beacon_synthetic_payload_status_resolved.
  repeated BeaconSyntheticPayloadStatusResolved beacon_synthetic_payload_status_resolved = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single beacon_synthetic_payload_status_resolved record by primary key
message GetBeaconSyntheticPayloadStatusResolvedRequest {
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single beacon_synthetic_payload_status_resolved record
message GetBeaconSyntheticPayloadStatusResolvedResponse {
  BeaconSyntheticPayloadStatusResolved item = 1;
}

// Query beacon_synthetic_payload_status_resolved data
