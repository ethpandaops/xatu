syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains per-validator attestation reward components for a canonical epoch.

message CanonicalBeaconAttestationReward {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The epoch number the reward is for
  uint32 epoch = 12;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 13;
  // The validator index the reward applies to
  uint32 validator_index = 14;
  // The reward for correctly attesting to the head in gwei
  int64 head = 15;
  // The reward for correctly attesting to the target in gwei
  int64 target = 16;
  // The reward for correctly attesting to the source in gwei
  int64 source = 17;
  // The reward for inclusion delay in gwei
  google.protobuf.UInt64Value inclusion_delay = 18;
  // The inactivity penalty in gwei
  int64 inactivity = 19;
  // Ethereum network name
  string meta_network_name = 20;
}

// Request for listing canonical_beacon_attestation_reward records
message ListCanonicalBeaconAttestationRewardRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by epoch_start_date_time - The wall clock time when the epoch started (ORDER BY column 2 - optional)
  UInt32Filter epoch_start_date_time = 2;

  // Filter by epoch - The epoch number the reward is for (ORDER BY column 3 - optional)
  UInt32Filter epoch = 3;

  // Filter by validator_index - The validator index the reward applies to (ORDER BY column 4 - optional)
  UInt32Filter validator_index = 4;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by head - The reward for correctly attesting to the head in gwei (optional)
  Int64Filter head = 6;
  // Filter by target - The reward for correctly attesting to the target in gwei (optional)
  Int64Filter target = 7;
  // Filter by source - The reward for correctly attesting to the source in gwei (optional)
  Int64Filter source = 8;
  // Filter by inclusion_delay - The reward for inclusion delay in gwei (optional)
  NullableUInt64Filter inclusion_delay = 9;
  // Filter by inactivity - The inactivity penalty in gwei (optional)
  Int64Filter inactivity = 10;

  // The maximum number of canonical_beacon_attestation_reward to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 11;
  // A page token, received from a previous `ListCanonicalBeaconAttestationReward` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 12;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 13;
}

// Response for listing canonical_beacon_attestation_reward records
message ListCanonicalBeaconAttestationRewardResponse {
  // The list of canonical_beacon_attestation_reward.
  repeated CanonicalBeaconAttestationReward canonical_beacon_attestation_reward = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_attestation_reward record by primary key
message GetCanonicalBeaconAttestationRewardRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_attestation_reward record
message GetCanonicalBeaconAttestationRewardResponse {
  CanonicalBeaconAttestationReward item = 1;
}

// Query canonical_beacon_attestation_reward data
service CanonicalBeaconAttestationRewardService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconAttestationRewardRequest) returns (ListCanonicalBeaconAttestationRewardResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconAttestationRewardRequest) returns (GetCanonicalBeaconAttestationRewardResponse);
}
