syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains a blob sidecar from a beacon block.

message CanonicalBeaconBlobSidecar {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The slot number from beacon block payload
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number from beacon block payload
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The root hash of the beacon block
  string block_root = 16;
  // The root hash of the parent beacon block
  string block_parent_root = 17;
  // The versioned hash in the beacon API event stream payload
  string versioned_hash = 18;
  // The KZG commitment in the blob sidecar payload
  string kzg_commitment = 19;
  // The KZG proof in the blob sidecar payload
  string kzg_proof = 20;
  // The index of the validator that proposed the beacon block
  uint32 proposer_index = 21;
  // The index of blob sidecar in the blob sidecar payload
  uint64 blob_index = 22;
  // The total bytes of the blob
  uint32 blob_size = 23;
  // The total empty size of the blob in bytes
  google.protobuf.UInt32Value blob_empty_size = 24;
  // Ethereum network name
  string meta_network_name = 25;
}

// Request for listing canonical_beacon_blob_sidecar records
message ListCanonicalBeaconBlobSidecarRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by block_root - The root hash of the beacon block (ORDER BY column 3 - optional)
  StringFilter block_root = 3;

  // Filter by blob_index - The index of blob sidecar in the blob sidecar payload (ORDER BY column 4 - optional)
  UInt64Filter blob_index = 4;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by slot - The slot number from beacon block payload (optional)
  UInt32Filter slot = 6;
  // Filter by epoch - The epoch number from beacon block payload (optional)
  UInt32Filter epoch = 7;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 8;
  // Filter by block_parent_root - The root hash of the parent beacon block (optional)
  StringFilter block_parent_root = 9;
  // Filter by versioned_hash - The versioned hash in the beacon API event stream payload (optional)
  StringFilter versioned_hash = 10;
  // Filter by kzg_commitment - The KZG commitment in the blob sidecar payload (optional)
  StringFilter kzg_commitment = 11;
  // Filter by kzg_proof - The KZG proof in the blob sidecar payload (optional)
  StringFilter kzg_proof = 12;
  // Filter by proposer_index - The index of the validator that proposed the beacon block (optional)
  UInt32Filter proposer_index = 13;
  // Filter by blob_size - The total bytes of the blob (optional)
  UInt32Filter blob_size = 14;
  // Filter by blob_empty_size - The total empty size of the blob in bytes (optional)
  NullableUInt32Filter blob_empty_size = 15;

  // The maximum number of canonical_beacon_blob_sidecar to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 16;
  // A page token, received from a previous `ListCanonicalBeaconBlobSidecar` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 17;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 18;
}

// Response for listing canonical_beacon_blob_sidecar records
message ListCanonicalBeaconBlobSidecarResponse {
  // The list of canonical_beacon_blob_sidecar.
  repeated CanonicalBeaconBlobSidecar canonical_beacon_blob_sidecar = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_blob_sidecar record by primary key
message GetCanonicalBeaconBlobSidecarRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_blob_sidecar record
message GetCanonicalBeaconBlobSidecarResponse {
  CanonicalBeaconBlobSidecar item = 1;
}

// Query canonical_beacon_blob_sidecar data
service CanonicalBeaconBlobSidecarService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconBlobSidecarRequest) returns (ListCanonicalBeaconBlobSidecarResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconBlobSidecarRequest) returns (GetCanonicalBeaconBlobSidecarResponse);
}
