syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains a per-block summary of the EIP-7928 block access list from a beacon block (1 row per block).

message CanonicalBeaconBlockAccessListSummary {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The slot number from beacon block payload
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number from beacon block payload
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The root hash of the beacon block
  string block_root = 16;
  // The version of the beacon block
  string block_version = 17;
  // The execution block number from the execution payload
  uint64 block_number = 18;
  // The execution block hash from the execution payload
  string block_hash = 19;
  // The number of distinct addresses in the block access list
  uint32 accounts_touched = 20;
  // The number of distinct (address, slot) pairs written at least once
  uint32 storage_slots_changed = 21;
  // The number of individual storage write records (one per slot and block access index)
  uint32 storage_changes = 22;
  // The number of distinct (address, slot) pairs that were only read
  uint32 storage_reads = 23;
  // The number of balance change records
  uint32 balance_changes = 24;
  // The number of nonce change records
  uint32 nonce_changes = 25;
  // The number of code change records
  uint32 code_changes = 26;
  // The total number of change records: storage_changes + balance_changes + nonce_changes + code_changes
  uint32 total_changes = 27;
  // The length in bytes of the RLP encoded block access list as carried in the execution payload
  uint32 bal_size_bytes = 28;
  // The keccak256 hash of the RLP encoded block access list as carried in the execution payload
  string bal_hash = 29;
  // Name of the client that generated the event
  string meta_client_name = 30;
  // Unique Session ID of the client
  string meta_client_id = 31;
  // Version of the client
  string meta_client_version = 32;
  // Implementation of the client
  string meta_client_implementation = 33;
  // Operating system of the client
  string meta_client_os = 34;
  // IP address of the client
  google.protobuf.StringValue meta_client_ip = 35;
  // City of the client
  string meta_client_geo_city = 36;
  // Country of the client
  string meta_client_geo_country = 37;
  // Country code of the client
  string meta_client_geo_country_code = 38;
  // Continent code of the client
  string meta_client_geo_continent_code = 39;
  // Longitude of the client
  google.protobuf.DoubleValue meta_client_geo_longitude = 40;
  // Latitude of the client
  google.protobuf.DoubleValue meta_client_geo_latitude = 41;
  // ASN of the client
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 42;
  // AS organization of the client
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 43;
  // Ethereum network ID
  int32 meta_network_id = 44;
  // Ethereum network name
  string meta_network_name = 45;
  // Consensus client version
  string meta_consensus_version = 46;
  // Consensus client major version
  string meta_consensus_version_major = 47;
  // Consensus client minor version
  string meta_consensus_version_minor = 48;
  // Consensus client patch version
  string meta_consensus_version_patch = 49;
  // Consensus client implementation
  string meta_consensus_implementation = 50;
  // Labels associated with the event
  map<string, string> meta_labels = 51;
}

// Request for listing canonical_beacon_block_access_list_summary records
message ListCanonicalBeaconBlockAccessListSummaryRequest {
  // Filter by slot_start_date_time - The wall clock time when the slot started (PRIMARY KEY - required)
  UInt32Filter slot_start_date_time = 1;

  // Filter by meta_network_name - Ethereum network name (ORDER BY column 2 - optional)
  StringFilter meta_network_name = 2;

  // Filter by block_root - The root hash of the beacon block (ORDER BY column 3 - optional)
  StringFilter block_root = 3;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 4;
  // Filter by slot - The slot number from beacon block payload (optional)
  UInt32Filter slot = 5;
  // Filter by epoch - The epoch number from beacon block payload (optional)
  UInt32Filter epoch = 6;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 7;
  // Filter by block_version - The version of the beacon block (optional)
  StringFilter block_version = 8;
  // Filter by block_number - The execution block number from the execution payload (optional)
  UInt64Filter block_number = 9;
  // Filter by block_hash - The execution block hash from the execution payload (optional)
  StringFilter block_hash = 10;
  // Filter by accounts_touched - The number of distinct addresses in the block access list (optional)
  UInt32Filter accounts_touched = 11;
  // Filter by storage_slots_changed - The number of distinct (address, slot) pairs written at least once (optional)
  UInt32Filter storage_slots_changed = 12;
  // Filter by storage_changes - The number of individual storage write records (one per slot and block access index) (optional)
  UInt32Filter storage_changes = 13;
  // Filter by storage_reads - The number of distinct (address, slot) pairs that were only read (optional)
  UInt32Filter storage_reads = 14;
  // Filter by balance_changes - The number of balance change records (optional)
  UInt32Filter balance_changes = 15;
  // Filter by nonce_changes - The number of nonce change records (optional)
  UInt32Filter nonce_changes = 16;
  // Filter by code_changes - The number of code change records (optional)
  UInt32Filter code_changes = 17;
  // Filter by total_changes - The total number of change records: storage_changes + balance_changes + nonce_changes + code_changes (optional)
  UInt32Filter total_changes = 18;
  // Filter by bal_size_bytes - The length in bytes of the RLP encoded block access list as carried in the execution payload (optional)
  UInt32Filter bal_size_bytes = 19;
  // Filter by bal_hash - The keccak256 hash of the RLP encoded block access list as carried in the execution payload (optional)
  StringFilter bal_hash = 20;
  // Filter by meta_client_name - Name of the client that generated the event (optional)
  StringFilter meta_client_name = 21;
  // Filter by meta_client_id - Unique Session ID of the client (optional)
  StringFilter meta_client_id = 22;
  // Filter by meta_client_version - Version of the client (optional)
  StringFilter meta_client_version = 23;
  // Filter by meta_client_implementation - Implementation of the client (optional)
  StringFilter meta_client_implementation = 24;
  // Filter by meta_client_os - Operating system of the client (optional)
  StringFilter meta_client_os = 25;
  // Filter by meta_client_ip - IP address of the client (optional)
  NullableStringFilter meta_client_ip = 26;
  // Filter by meta_client_geo_city - City of the client (optional)
  StringFilter meta_client_geo_city = 27;
  // Filter by meta_client_geo_country - Country of the client (optional)
  StringFilter meta_client_geo_country = 28;
  // Filter by meta_client_geo_country_code - Country code of the client (optional)
  StringFilter meta_client_geo_country_code = 29;
  // Filter by meta_client_geo_continent_code - Continent code of the client (optional)
  StringFilter meta_client_geo_continent_code = 30;
  // Filter by meta_client_geo_longitude - Longitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 31;
  // Filter by meta_client_geo_latitude - Latitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 32;
  // Filter by meta_client_geo_autonomous_system_number - ASN of the client (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 33;
  // Filter by meta_client_geo_autonomous_system_organization - AS organization of the client (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 34;
  // Filter by meta_network_id - Ethereum network ID (optional)
  Int32Filter meta_network_id = 35;
  // Filter by meta_consensus_version - Consensus client version (optional)
  StringFilter meta_consensus_version = 36;
  // Filter by meta_consensus_version_major - Consensus client major version (optional)
  StringFilter meta_consensus_version_major = 37;
  // Filter by meta_consensus_version_minor - Consensus client minor version (optional)
  StringFilter meta_consensus_version_minor = 38;
  // Filter by meta_consensus_version_patch - Consensus client patch version (optional)
  StringFilter meta_consensus_version_patch = 39;
  // Filter by meta_consensus_implementation - Consensus client implementation (optional)
  StringFilter meta_consensus_implementation = 40;
  // Filter by meta_labels - Labels associated with the event (optional)
  MapStringStringFilter meta_labels = 41;

  // The maximum number of canonical_beacon_block_access_list_summary to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 42;
  // A page token, received from a previous `ListCanonicalBeaconBlockAccessListSummary` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 43;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 44;
}

// Response for listing canonical_beacon_block_access_list_summary records
message ListCanonicalBeaconBlockAccessListSummaryResponse {
  // The list of canonical_beacon_block_access_list_summary.
  repeated CanonicalBeaconBlockAccessListSummary canonical_beacon_block_access_list_summary = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_block_access_list_summary record by primary key
message GetCanonicalBeaconBlockAccessListSummaryRequest {
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_block_access_list_summary record
message GetCanonicalBeaconBlockAccessListSummaryResponse {
  CanonicalBeaconBlockAccessListSummary item = 1;
}

// Query canonical_beacon_block_access_list_summary data
service CanonicalBeaconBlockAccessListSummaryService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconBlockAccessListSummaryRequest) returns (ListCanonicalBeaconBlockAccessListSummaryResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconBlockAccessListSummaryRequest) returns (GetCanonicalBeaconBlockAccessListSummaryResponse);
}
