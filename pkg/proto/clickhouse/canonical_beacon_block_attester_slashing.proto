syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains attester slashing from a beacon block.

message CanonicalBeaconBlockAttesterSlashing {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The slot number from beacon block payload
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number from beacon block payload
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The root hash of the beacon block
  string block_root = 16;
  // The version of the beacon block
  string block_version = 17;
  // The attesting indices from the first attestation in the slashing payload
  repeated uint32 attestation_1_attesting_indices = 18;
  // The signature from the first attestation in the slashing payload
  string attestation_1_signature = 19;
  // The beacon block root from the first attestation in the slashing payload
  string attestation_1_data_beacon_block_root = 20;
  // The slot number from the first attestation in the slashing payload
  uint32 attestation_1_data_slot = 21;
  // The attestor index from the first attestation in the slashing payload
  uint32 attestation_1_data_index = 22;
  // The source epoch number from the first attestation in the slashing payload
  uint32 attestation_1_data_source_epoch = 23;
  // The source root from the first attestation in the slashing payload
  string attestation_1_data_source_root = 24;
  // The target epoch number from the first attestation in the slashing payload
  uint32 attestation_1_data_target_epoch = 25;
  // The target root from the first attestation in the slashing payload
  string attestation_1_data_target_root = 26;
  // The attesting indices from the second attestation in the slashing payload
  repeated uint32 attestation_2_attesting_indices = 27;
  // The signature from the second attestation in the slashing payload
  string attestation_2_signature = 28;
  // The beacon block root from the second attestation in the slashing payload
  string attestation_2_data_beacon_block_root = 29;
  // The slot number from the second attestation in the slashing payload
  uint32 attestation_2_data_slot = 30;
  // The attestor index from the second attestation in the slashing payload
  uint32 attestation_2_data_index = 31;
  // The source epoch number from the second attestation in the slashing payload
  uint32 attestation_2_data_source_epoch = 32;
  // The source root from the second attestation in the slashing payload
  string attestation_2_data_source_root = 33;
  // The target epoch number from the second attestation in the slashing payload
  uint32 attestation_2_data_target_epoch = 34;
  // The target root from the second attestation in the slashing payload
  string attestation_2_data_target_root = 35;
  // Ethereum network name
  string meta_network_name = 36;
}

// Request for listing canonical_beacon_block_attester_slashing records
message ListCanonicalBeaconBlockAttesterSlashingRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by block_root - The root hash of the beacon block (ORDER BY column 3 - optional)
  StringFilter block_root = 3;

  // Filter by attestation_1_attesting_indices - The attesting indices from the first attestation in the slashing payload (ORDER BY column 4 - optional)
  ArrayUInt32Filter attestation_1_attesting_indices = 4;

  // Filter by attestation_2_attesting_indices - The attesting indices from the second attestation in the slashing payload (ORDER BY column 5 - optional)
  ArrayUInt32Filter attestation_2_attesting_indices = 5;

  // Filter by attestation_1_data_slot - The slot number from the first attestation in the slashing payload (ORDER BY column 6 - optional)
  UInt32Filter attestation_1_data_slot = 6;

  // Filter by attestation_2_data_slot - The slot number from the second attestation in the slashing payload (ORDER BY column 7 - optional)
  UInt32Filter attestation_2_data_slot = 7;

  // Filter by attestation_1_data_beacon_block_root - The beacon block root from the first attestation in the slashing payload (ORDER BY column 8 - optional)
  StringFilter attestation_1_data_beacon_block_root = 8;

  // Filter by attestation_2_data_beacon_block_root - The beacon block root from the second attestation in the slashing payload (ORDER BY column 9 - optional)
  StringFilter attestation_2_data_beacon_block_root = 9;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 10;
  // Filter by slot - The slot number from beacon block payload (optional)
  UInt32Filter slot = 11;
  // Filter by epoch - The epoch number from beacon block payload (optional)
  UInt32Filter epoch = 12;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 13;
  // Filter by block_version - The version of the beacon block (optional)
  StringFilter block_version = 14;
  // Filter by attestation_1_signature - The signature from the first attestation in the slashing payload (optional)
  StringFilter attestation_1_signature = 15;
  // Filter by attestation_1_data_index - The attestor index from the first attestation in the slashing payload (optional)
  UInt32Filter attestation_1_data_index = 16;
  // Filter by attestation_1_data_source_epoch - The source epoch number from the first attestation in the slashing payload (optional)
  UInt32Filter attestation_1_data_source_epoch = 17;
  // Filter by attestation_1_data_source_root - The source root from the first attestation in the slashing payload (optional)
  StringFilter attestation_1_data_source_root = 18;
  // Filter by attestation_1_data_target_epoch - The target epoch number from the first attestation in the slashing payload (optional)
  UInt32Filter attestation_1_data_target_epoch = 19;
  // Filter by attestation_1_data_target_root - The target root from the first attestation in the slashing payload (optional)
  StringFilter attestation_1_data_target_root = 20;
  // Filter by attestation_2_signature - The signature from the second attestation in the slashing payload (optional)
  StringFilter attestation_2_signature = 21;
  // Filter by attestation_2_data_index - The attestor index from the second attestation in the slashing payload (optional)
  UInt32Filter attestation_2_data_index = 22;
  // Filter by attestation_2_data_source_epoch - The source epoch number from the second attestation in the slashing payload (optional)
  UInt32Filter attestation_2_data_source_epoch = 23;
  // Filter by attestation_2_data_source_root - The source root from the second attestation in the slashing payload (optional)
  StringFilter attestation_2_data_source_root = 24;
  // Filter by attestation_2_data_target_epoch - The target epoch number from the second attestation in the slashing payload (optional)
  UInt32Filter attestation_2_data_target_epoch = 25;
  // Filter by attestation_2_data_target_root - The target root from the second attestation in the slashing payload (optional)
  StringFilter attestation_2_data_target_root = 26;

  // The maximum number of canonical_beacon_block_attester_slashing to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 27;
  // A page token, received from a previous `ListCanonicalBeaconBlockAttesterSlashing` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 28;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 29;
}

// Response for listing canonical_beacon_block_attester_slashing records
message ListCanonicalBeaconBlockAttesterSlashingResponse {
  // The list of canonical_beacon_block_attester_slashing.
  repeated CanonicalBeaconBlockAttesterSlashing canonical_beacon_block_attester_slashing = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_block_attester_slashing record by primary key
message GetCanonicalBeaconBlockAttesterSlashingRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_block_attester_slashing record
message GetCanonicalBeaconBlockAttesterSlashingResponse {
  CanonicalBeaconBlockAttesterSlashing item = 1;
}

// Query canonical_beacon_block_attester_slashing data
service CanonicalBeaconBlockAttesterSlashingService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconBlockAttesterSlashingRequest) returns (ListCanonicalBeaconBlockAttesterSlashingResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconBlockAttesterSlashingRequest) returns (GetCanonicalBeaconBlockAttesterSlashingResponse);
}
