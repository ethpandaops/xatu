syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains bls to execution change from a beacon block.

message CanonicalBeaconBlockBlsToExecutionChange {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The slot number from beacon block payload
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number from beacon block payload
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The root hash of the beacon block
  string block_root = 16;
  // The version of the beacon block
  string block_version = 17;
  // The validator index from the exchanging message
  uint32 exchanging_message_validator_index = 18;
  // The BLS public key from the exchanging message
  string exchanging_message_from_bls_pubkey = 19;
  // The execution address from the exchanging message
  string exchanging_message_to_execution_address = 20;
  // The signature for the exchanging message
  string exchanging_signature = 21;
  // Ethereum network name
  string meta_network_name = 22;
}

// Request for listing canonical_beacon_block_bls_to_execution_change records
message ListCanonicalBeaconBlockBlsToExecutionChangeRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by block_root - The root hash of the beacon block (ORDER BY column 3 - optional)
  StringFilter block_root = 3;

  // Filter by exchanging_message_validator_index - The validator index from the exchanging message (ORDER BY column 4 - optional)
  UInt32Filter exchanging_message_validator_index = 4;

  // Filter by exchanging_message_from_bls_pubkey - The BLS public key from the exchanging message (ORDER BY column 5 - optional)
  StringFilter exchanging_message_from_bls_pubkey = 5;

  // Filter by exchanging_message_to_execution_address - The execution address from the exchanging message (ORDER BY column 6 - optional)
  StringFilter exchanging_message_to_execution_address = 6;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 7;
  // Filter by slot - The slot number from beacon block payload (optional)
  UInt32Filter slot = 8;
  // Filter by epoch - The epoch number from beacon block payload (optional)
  UInt32Filter epoch = 9;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 10;
  // Filter by block_version - The version of the beacon block (optional)
  StringFilter block_version = 11;
  // Filter by exchanging_signature - The signature for the exchanging message (optional)
  StringFilter exchanging_signature = 12;

  // The maximum number of canonical_beacon_block_bls_to_execution_change to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 13;
  // A page token, received from a previous `ListCanonicalBeaconBlockBlsToExecutionChange` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 14;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 15;
}

// Response for listing canonical_beacon_block_bls_to_execution_change records
message ListCanonicalBeaconBlockBlsToExecutionChangeResponse {
  // The list of canonical_beacon_block_bls_to_execution_change.
  repeated CanonicalBeaconBlockBlsToExecutionChange canonical_beacon_block_bls_to_execution_change = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_block_bls_to_execution_change record by primary key
message GetCanonicalBeaconBlockBlsToExecutionChangeRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_block_bls_to_execution_change record
message GetCanonicalBeaconBlockBlsToExecutionChangeResponse {
  CanonicalBeaconBlockBlsToExecutionChange item = 1;
}

// Query canonical_beacon_block_bls_to_execution_change data
service CanonicalBeaconBlockBlsToExecutionChangeService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconBlockBlsToExecutionChangeRequest) returns (ListCanonicalBeaconBlockBlsToExecutionChangeResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconBlockBlsToExecutionChangeRequest) returns (GetCanonicalBeaconBlockBlsToExecutionChangeResponse);
}
