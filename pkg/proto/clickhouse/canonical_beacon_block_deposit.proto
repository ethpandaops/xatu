syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains a deposit from a beacon block.

message CanonicalBeaconBlockDeposit {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The slot number from beacon block payload
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number from beacon block payload
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The root hash of the beacon block
  string block_root = 16;
  // The version of the beacon block
  string block_version = 17;
  // The proof of the deposit data
  repeated string deposit_proof = 18;
  // The BLS public key of the validator from the deposit data
  string deposit_data_pubkey = 19;
  // The withdrawal credentials of the validator from the deposit data
  string deposit_data_withdrawal_credentials = 20;
  // The amount of the deposit from the deposit data
  string deposit_data_amount = 21;
  // The signature of the deposit data
  string deposit_data_signature = 22;
  // Ethereum network name
  string meta_network_name = 23;
}

// Request for listing canonical_beacon_block_deposit records
message ListCanonicalBeaconBlockDepositRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by block_root - The root hash of the beacon block (ORDER BY column 3 - optional)
  StringFilter block_root = 3;

  // Filter by deposit_data_pubkey - The BLS public key of the validator from the deposit data (ORDER BY column 4 - optional)
  StringFilter deposit_data_pubkey = 4;

  // Filter by deposit_proof - The proof of the deposit data (ORDER BY column 5 - optional)
  ArrayStringFilter deposit_proof = 5;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 6;
  // Filter by slot - The slot number from beacon block payload (optional)
  UInt32Filter slot = 7;
  // Filter by epoch - The epoch number from beacon block payload (optional)
  UInt32Filter epoch = 8;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 9;
  // Filter by block_version - The version of the beacon block (optional)
  StringFilter block_version = 10;
  // Filter by deposit_data_withdrawal_credentials - The withdrawal credentials of the validator from the deposit data (optional)
  StringFilter deposit_data_withdrawal_credentials = 11;
  // Filter by deposit_data_amount - The amount of the deposit from the deposit data (optional)
  StringFilter deposit_data_amount = 12;
  // Filter by deposit_data_signature - The signature of the deposit data (optional)
  StringFilter deposit_data_signature = 13;

  // The maximum number of canonical_beacon_block_deposit to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 14;
  // A page token, received from a previous `ListCanonicalBeaconBlockDeposit` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 15;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 16;
}

// Response for listing canonical_beacon_block_deposit records
message ListCanonicalBeaconBlockDepositResponse {
  // The list of canonical_beacon_block_deposit.
  repeated CanonicalBeaconBlockDeposit canonical_beacon_block_deposit = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_block_deposit record by primary key
message GetCanonicalBeaconBlockDepositRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_block_deposit record
message GetCanonicalBeaconBlockDepositResponse {
  CanonicalBeaconBlockDeposit item = 1;
}

// Query canonical_beacon_block_deposit data
service CanonicalBeaconBlockDepositService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconBlockDepositRequest) returns (ListCanonicalBeaconBlockDepositResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconBlockDepositRequest) returns (GetCanonicalBeaconBlockDepositResponse);
}
