syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Winning execution payload bid from canonical beacon blocks (1 per block).

message CanonicalBeaconBlockExecutionPayloadBid {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Slot number of the block containing this bid
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // Epoch number
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // Root of the block containing this bid
  string block_root = 16;
  // Block version (e.g. gloas)
  string block_version = 17;
  // Index of the builder in the builder registry, NULL when self-built
  google.protobuf.UInt64Value builder_index = 18;
  // Execution block hash committed to in the bid
  string block_hash = 19;
  // Parent execution block hash
  string parent_block_hash = 20;
  // Parent beacon block root
  string parent_block_root = 21;
  // Bid value in Gwei
  uint64 value = 22;
  // Execution payment in Gwei
  uint64 execution_payment = 23;
  // Fee recipient address
  string fee_recipient = 24;
  // Gas limit for the execution payload
  uint64 gas_limit = 25;
  // Previous RANDAO value
  string prev_randao = 26;
  // Number of blob KZG commitments
  uint32 blob_kzg_commitment_count = 27;
  // Name of the client that generated the event
  string meta_client_name = 28;
  // Unique Session ID of the client
  string meta_client_id = 29;
  // Version of the client
  string meta_client_version = 30;
  // Implementation of the client
  string meta_client_implementation = 31;
  // Operating system of the client
  string meta_client_os = 32;
  // IP address of the client
  google.protobuf.StringValue meta_client_ip = 33;
  // City of the client
  string meta_client_geo_city = 34;
  // Country of the client
  string meta_client_geo_country = 35;
  // Country code of the client
  string meta_client_geo_country_code = 36;
  // Continent code of the client
  string meta_client_geo_continent_code = 37;
  // Longitude of the client
  google.protobuf.DoubleValue meta_client_geo_longitude = 38;
  // Latitude of the client
  google.protobuf.DoubleValue meta_client_geo_latitude = 39;
  // ASN of the client
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 40;
  // AS organization of the client
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 41;
  // Ethereum network ID
  int32 meta_network_id = 42;
  // Ethereum network name
  string meta_network_name = 43;
  // Consensus client version
  string meta_consensus_version = 44;
  // Consensus client major version
  string meta_consensus_version_major = 45;
  // Consensus client minor version
  string meta_consensus_version_minor = 46;
  // Consensus client patch version
  string meta_consensus_version_patch = 47;
  // Consensus client implementation
  string meta_consensus_implementation = 48;
  // Labels associated with the event
  map<string, string> meta_labels = 49;
}

// Request for listing canonical_beacon_block_execution_payload_bid records
message ListCanonicalBeaconBlockExecutionPayloadBidRequest {
  // Filter by slot_start_date_time - The wall clock time when the slot started (PRIMARY KEY - required)
  UInt32Filter slot_start_date_time = 1;

  // Filter by meta_network_name - Ethereum network name (ORDER BY column 2 - optional)
  StringFilter meta_network_name = 2;

  // Filter by block_root - Root of the block containing this bid (ORDER BY column 3 - optional)
  StringFilter block_root = 3;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4;
  // Filter by slot - Slot number of the block containing this bid (optional)
  UInt32Filter slot = 5;
  // Filter by epoch - Epoch number (optional)
  UInt32Filter epoch = 6;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 7;
  // Filter by block_version - Block version (e.g. gloas) (optional)
  StringFilter block_version = 8;
  // Filter by builder_index - Index of the builder in the builder registry, NULL when self-built (optional)
  NullableUInt64Filter builder_index = 9;
  // Filter by block_hash - Execution block hash committed to in the bid (optional)
  StringFilter block_hash = 10;
  // Filter by parent_block_hash - Parent execution block hash (optional)
  StringFilter parent_block_hash = 11;
  // Filter by parent_block_root - Parent beacon block root (optional)
  StringFilter parent_block_root = 12;
  // Filter by value - Bid value in Gwei (optional)
  UInt64Filter value = 13;
  // Filter by execution_payment - Execution payment in Gwei (optional)
  UInt64Filter execution_payment = 14;
  // Filter by fee_recipient - Fee recipient address (optional)
  StringFilter fee_recipient = 15;
  // Filter by gas_limit - Gas limit for the execution payload (optional)
  UInt64Filter gas_limit = 16;
  // Filter by prev_randao - Previous RANDAO value (optional)
  StringFilter prev_randao = 17;
  // Filter by blob_kzg_commitment_count - Number of blob KZG commitments (optional)
  UInt32Filter blob_kzg_commitment_count = 18;
  // Filter by meta_client_name - Name of the client that generated the event (optional)
  StringFilter meta_client_name = 19;
  // Filter by meta_client_id - Unique Session ID of the client (optional)
  StringFilter meta_client_id = 20;
  // Filter by meta_client_version - Version of the client (optional)
  StringFilter meta_client_version = 21;
  // Filter by meta_client_implementation - Implementation of the client (optional)
  StringFilter meta_client_implementation = 22;
  // Filter by meta_client_os - Operating system of the client (optional)
  StringFilter meta_client_os = 23;
  // Filter by meta_client_ip - IP address of the client (optional)
  NullableStringFilter meta_client_ip = 24;
  // Filter by meta_client_geo_city - City of the client (optional)
  StringFilter meta_client_geo_city = 25;
  // Filter by meta_client_geo_country - Country of the client (optional)
  StringFilter meta_client_geo_country = 26;
  // Filter by meta_client_geo_country_code - Country code of the client (optional)
  StringFilter meta_client_geo_country_code = 27;
  // Filter by meta_client_geo_continent_code - Continent code of the client (optional)
  StringFilter meta_client_geo_continent_code = 28;
  // Filter by meta_client_geo_longitude - Longitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 29;
  // Filter by meta_client_geo_latitude - Latitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 30;
  // Filter by meta_client_geo_autonomous_system_number - ASN of the client (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 31;
  // Filter by meta_client_geo_autonomous_system_organization - AS organization of the client (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 32;
  // Filter by meta_network_id - Ethereum network ID (optional)
  Int32Filter meta_network_id = 33;
  // Filter by meta_consensus_version - Consensus client version (optional)
  StringFilter meta_consensus_version = 34;
  // Filter by meta_consensus_version_major - Consensus client major version (optional)
  StringFilter meta_consensus_version_major = 35;
  // Filter by meta_consensus_version_minor - Consensus client minor version (optional)
  StringFilter meta_consensus_version_minor = 36;
  // Filter by meta_consensus_version_patch - Consensus client patch version (optional)
  StringFilter meta_consensus_version_patch = 37;
  // Filter by meta_consensus_implementation - Consensus client implementation (optional)
  StringFilter meta_consensus_implementation = 38;
  // Filter by meta_labels - Labels associated with the event (optional)
  MapStringStringFilter meta_labels = 39;

  // The maximum number of canonical_beacon_block_execution_payload_bid to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 40;
  // A page token, received from a previous `ListCanonicalBeaconBlockExecutionPayloadBid` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 41;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 42;
}

// Response for listing canonical_beacon_block_execution_payload_bid records
message ListCanonicalBeaconBlockExecutionPayloadBidResponse {
  // The list of canonical_beacon_block_execution_payload_bid.
  repeated CanonicalBeaconBlockExecutionPayloadBid canonical_beacon_block_execution_payload_bid = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_block_execution_payload_bid record by primary key
message GetCanonicalBeaconBlockExecutionPayloadBidRequest {
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_block_execution_payload_bid record
message GetCanonicalBeaconBlockExecutionPayloadBidResponse {
  CanonicalBeaconBlockExecutionPayloadBid item = 1;
}

// Query canonical_beacon_block_execution_payload_bid data
service CanonicalBeaconBlockExecutionPayloadBidService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconBlockExecutionPayloadBidRequest) returns (ListCanonicalBeaconBlockExecutionPayloadBidResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconBlockExecutionPayloadBidRequest) returns (GetCanonicalBeaconBlockExecutionPayloadBidResponse);
}
