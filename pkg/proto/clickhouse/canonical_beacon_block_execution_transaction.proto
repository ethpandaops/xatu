syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains execution transaction from a beacon block.

message CanonicalBeaconBlockExecutionTransaction {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The slot number from beacon block payload
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number from beacon block payload
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The root hash of the beacon block
  string block_root = 16;
  // The version of the beacon block
  string block_version = 17;
  // The position of the transaction in the beacon block
  uint32 position = 18;
  // The hash of the transaction
  string hash = 19;
  // The address of the account that sent the transaction
  string from = 20;
  // The address of the account that is the transaction recipient
  google.protobuf.StringValue to = 21;
  // The nonce of the sender account at the time of the transaction
  uint64 nonce = 22;
  // The gas price of the transaction in wei
  string gas_price = 23;
  // The maximum gas provided for the transaction execution
  uint64 gas = 24;
  // The priority fee (tip) the user has set for the transaction
  google.protobuf.StringValue gas_tip_cap = 25;
  // The max fee the user has set for the transaction
  google.protobuf.StringValue gas_fee_cap = 26;
  // The value transferred with the transaction in wei
  string value = 27;
  // The type of the transaction
  uint32 type = 28;
  // The size of the transaction data in bytes
  uint32 size = 29;
  // The size of the call data of the transaction in bytes
  uint32 call_data_size = 30;
  // The maximum gas provided for the blob transaction execution
  google.protobuf.UInt64Value blob_gas = 31;
  // The max fee the user has set for the transaction
  google.protobuf.StringValue blob_gas_fee_cap = 32;
  // The hashes of the blob commitments for blob transactions
  repeated string blob_hashes = 33;
  // The total size of the sidecars for blob transactions in bytes
  google.protobuf.UInt32Value blob_sidecars_size = 34;
  // The total empty size of the sidecars for blob transactions in bytes
  google.protobuf.UInt32Value blob_sidecars_empty_size = 35;
  // Ethereum network name
  string meta_network_name = 36;
}

// Request for listing canonical_beacon_block_execution_transaction records
message ListCanonicalBeaconBlockExecutionTransactionRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by block_root - The root hash of the beacon block (ORDER BY column 3 - optional)
  StringFilter block_root = 3;

  // Filter by position - The position of the transaction in the beacon block (ORDER BY column 4 - optional)
  UInt32Filter position = 4;

  // Filter by hash - The hash of the transaction (ORDER BY column 5 - optional)
  StringFilter hash = 5;

  // Filter by nonce - The nonce of the sender account at the time of the transaction (ORDER BY column 6 - optional)
  UInt64Filter nonce = 6;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 7;
  // Filter by slot - The slot number from beacon block payload (optional)
  UInt32Filter slot = 8;
  // Filter by epoch - The epoch number from beacon block payload (optional)
  UInt32Filter epoch = 9;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 10;
  // Filter by block_version - The version of the beacon block (optional)
  StringFilter block_version = 11;
  // Filter by from - The address of the account that sent the transaction (optional)
  StringFilter from = 12;
  // Filter by to - The address of the account that is the transaction recipient (optional)
  NullableStringFilter to = 13;
  // Filter by gas_price - The gas price of the transaction in wei (optional)
  StringFilter gas_price = 14;
  // Filter by gas - The maximum gas provided for the transaction execution (optional)
  UInt64Filter gas = 15;
  // Filter by gas_tip_cap - The priority fee (tip) the user has set for the transaction (optional)
  NullableStringFilter gas_tip_cap = 16;
  // Filter by gas_fee_cap - The max fee the user has set for the transaction (optional)
  NullableStringFilter gas_fee_cap = 17;
  // Filter by value - The value transferred with the transaction in wei (optional)
  StringFilter value = 18;
  // Filter by type - The type of the transaction (optional)
  UInt32Filter type = 19;
  // Filter by size - The size of the transaction data in bytes (optional)
  UInt32Filter size = 20;
  // Filter by call_data_size - The size of the call data of the transaction in bytes (optional)
  UInt32Filter call_data_size = 21;
  // Filter by blob_gas - The maximum gas provided for the blob transaction execution (optional)
  NullableUInt64Filter blob_gas = 22;
  // Filter by blob_gas_fee_cap - The max fee the user has set for the transaction (optional)
  NullableStringFilter blob_gas_fee_cap = 23;
  // Filter by blob_hashes - The hashes of the blob commitments for blob transactions (optional)
  ArrayStringFilter blob_hashes = 24;
  // Filter by blob_sidecars_size - The total size of the sidecars for blob transactions in bytes (optional)
  NullableUInt32Filter blob_sidecars_size = 25;
  // Filter by blob_sidecars_empty_size - The total empty size of the sidecars for blob transactions in bytes (optional)
  NullableUInt32Filter blob_sidecars_empty_size = 26;

  // The maximum number of canonical_beacon_block_execution_transaction to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 27;
  // A page token, received from a previous `ListCanonicalBeaconBlockExecutionTransaction` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 28;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 29;
}

// Response for listing canonical_beacon_block_execution_transaction records
message ListCanonicalBeaconBlockExecutionTransactionResponse {
  // The list of canonical_beacon_block_execution_transaction.
  repeated CanonicalBeaconBlockExecutionTransaction canonical_beacon_block_execution_transaction = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_block_execution_transaction record by primary key
message GetCanonicalBeaconBlockExecutionTransactionRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_block_execution_transaction record
message GetCanonicalBeaconBlockExecutionTransactionResponse {
  CanonicalBeaconBlockExecutionTransaction item = 1;
}

// Query canonical_beacon_block_execution_transaction data
service CanonicalBeaconBlockExecutionTransactionService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconBlockExecutionTransactionRequest) returns (ListCanonicalBeaconBlockExecutionTransactionResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconBlockExecutionTransactionRequest) returns (GetCanonicalBeaconBlockExecutionTransactionResponse);
}
