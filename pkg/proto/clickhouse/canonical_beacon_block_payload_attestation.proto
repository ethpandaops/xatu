syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Aggregated PTC payload attestations from canonical beacon blocks (max 4 per block).

message CanonicalBeaconBlockPayloadAttestation {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Slot number of the block containing this payload attestation
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // Epoch number
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // Root of the block containing this attestation
  string block_root = 16;
  // Block version (e.g. gloas)
  string block_version = 17;
  // Position of the payload attestation in the block body (0-3)
  uint32 position = 18;
  // The block root being attested to by the PTC
  string beacon_block_root = 19;
  // Whether the PTC attests payload was present
  bool payload_present = 20;
  // Whether the PTC attests blob data was available
  bool blob_data_available = 21;
  // Bitvector of PTC members (512 bits) as hex
  string aggregation_bits = 22;
  // Number of PTC validators in this aggregation
  uint32 attesting_validator_count = 23;
  // Name of the client that generated the event
  string meta_client_name = 24;
  // Unique Session ID of the client
  string meta_client_id = 25;
  // Version of the client
  string meta_client_version = 26;
  // Implementation of the client
  string meta_client_implementation = 27;
  // Operating system of the client
  string meta_client_os = 28;
  // IP address of the client
  google.protobuf.StringValue meta_client_ip = 29;
  // City of the client
  string meta_client_geo_city = 30;
  // Country of the client
  string meta_client_geo_country = 31;
  // Country code of the client
  string meta_client_geo_country_code = 32;
  // Continent code of the client
  string meta_client_geo_continent_code = 33;
  // Longitude of the client
  google.protobuf.DoubleValue meta_client_geo_longitude = 34;
  // Latitude of the client
  google.protobuf.DoubleValue meta_client_geo_latitude = 35;
  // ASN of the client
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 36;
  // AS organization of the client
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 37;
  // Ethereum network ID
  int32 meta_network_id = 38;
  // Ethereum network name
  string meta_network_name = 39;
  // Consensus client version
  string meta_consensus_version = 40;
  // Consensus client major version
  string meta_consensus_version_major = 41;
  // Consensus client minor version
  string meta_consensus_version_minor = 42;
  // Consensus client patch version
  string meta_consensus_version_patch = 43;
  // Consensus client implementation
  string meta_consensus_implementation = 44;
  // Labels associated with the event
  map<string, string> meta_labels = 45;
}

// Request for listing canonical_beacon_block_payload_attestation records
message ListCanonicalBeaconBlockPayloadAttestationRequest {
  // Filter by slot_start_date_time - The wall clock time when the slot started (PRIMARY KEY - required)
  UInt32Filter slot_start_date_time = 1;

  // Filter by meta_network_name - Ethereum network name (ORDER BY column 2 - optional)
  StringFilter meta_network_name = 2;

  // Filter by block_root - Root of the block containing this attestation (ORDER BY column 3 - optional)
  StringFilter block_root = 3;

  // Filter by position - Position of the payload attestation in the block body (0-3) (ORDER BY column 4 - optional)
  UInt32Filter position = 4;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by slot - Slot number of the block containing this payload attestation (optional)
  UInt32Filter slot = 6;
  // Filter by epoch - Epoch number (optional)
  UInt32Filter epoch = 7;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 8;
  // Filter by block_version - Block version (e.g. gloas) (optional)
  StringFilter block_version = 9;
  // Filter by beacon_block_root - The block root being attested to by the PTC (optional)
  StringFilter beacon_block_root = 10;
  // Filter by payload_present - Whether the PTC attests payload was present (optional)
  BoolFilter payload_present = 11;
  // Filter by blob_data_available - Whether the PTC attests blob data was available (optional)
  BoolFilter blob_data_available = 12;
  // Filter by aggregation_bits - Bitvector of PTC members (512 bits) as hex (optional)
  StringFilter aggregation_bits = 13;
  // Filter by attesting_validator_count - Number of PTC validators in this aggregation (optional)
  UInt32Filter attesting_validator_count = 14;
  // Filter by meta_client_name - Name of the client that generated the event (optional)
  StringFilter meta_client_name = 15;
  // Filter by meta_client_id - Unique Session ID of the client (optional)
  StringFilter meta_client_id = 16;
  // Filter by meta_client_version - Version of the client (optional)
  StringFilter meta_client_version = 17;
  // Filter by meta_client_implementation - Implementation of the client (optional)
  StringFilter meta_client_implementation = 18;
  // Filter by meta_client_os - Operating system of the client (optional)
  StringFilter meta_client_os = 19;
  // Filter by meta_client_ip - IP address of the client (optional)
  NullableStringFilter meta_client_ip = 20;
  // Filter by meta_client_geo_city - City of the client (optional)
  StringFilter meta_client_geo_city = 21;
  // Filter by meta_client_geo_country - Country of the client (optional)
  StringFilter meta_client_geo_country = 22;
  // Filter by meta_client_geo_country_code - Country code of the client (optional)
  StringFilter meta_client_geo_country_code = 23;
  // Filter by meta_client_geo_continent_code - Continent code of the client (optional)
  StringFilter meta_client_geo_continent_code = 24;
  // Filter by meta_client_geo_longitude - Longitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 25;
  // Filter by meta_client_geo_latitude - Latitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 26;
  // Filter by meta_client_geo_autonomous_system_number - ASN of the client (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 27;
  // Filter by meta_client_geo_autonomous_system_organization - AS organization of the client (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 28;
  // Filter by meta_network_id - Ethereum network ID (optional)
  Int32Filter meta_network_id = 29;
  // Filter by meta_consensus_version - Consensus client version (optional)
  StringFilter meta_consensus_version = 30;
  // Filter by meta_consensus_version_major - Consensus client major version (optional)
  StringFilter meta_consensus_version_major = 31;
  // Filter by meta_consensus_version_minor - Consensus client minor version (optional)
  StringFilter meta_consensus_version_minor = 32;
  // Filter by meta_consensus_version_patch - Consensus client patch version (optional)
  StringFilter meta_consensus_version_patch = 33;
  // Filter by meta_consensus_implementation - Consensus client implementation (optional)
  StringFilter meta_consensus_implementation = 34;
  // Filter by meta_labels - Labels associated with the event (optional)
  MapStringStringFilter meta_labels = 35;

  // The maximum number of canonical_beacon_block_payload_attestation to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 36;
  // A page token, received from a previous `ListCanonicalBeaconBlockPayloadAttestation` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 37;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 38;
}

// Response for listing canonical_beacon_block_payload_attestation records
message ListCanonicalBeaconBlockPayloadAttestationResponse {
  // The list of canonical_beacon_block_payload_attestation.
  repeated CanonicalBeaconBlockPayloadAttestation canonical_beacon_block_payload_attestation = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_block_payload_attestation record by primary key
message GetCanonicalBeaconBlockPayloadAttestationRequest {
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_block_payload_attestation record
message GetCanonicalBeaconBlockPayloadAttestationResponse {
  CanonicalBeaconBlockPayloadAttestation item = 1;
}

// Query canonical_beacon_block_payload_attestation data
service CanonicalBeaconBlockPayloadAttestationService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconBlockPayloadAttestationRequest) returns (ListCanonicalBeaconBlockPayloadAttestationResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconBlockPayloadAttestationRequest) returns (GetCanonicalBeaconBlockPayloadAttestationResponse);
}
