syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains proposer slashing from a beacon block.

message CanonicalBeaconBlockProposerSlashing {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The slot number from beacon block payload
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number from beacon block payload
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The root hash of the beacon block
  string block_root = 16;
  // The version of the beacon block
  string block_version = 17;
  // The slot number from the first signed header in the slashing payload
  uint32 signed_header_1_message_slot = 18;
  // The proposer index from the first signed header in the slashing payload
  uint32 signed_header_1_message_proposer_index = 19;
  // The body root from the first signed header in the slashing payload
  string signed_header_1_message_body_root = 20;
  // The parent root from the first signed header in the slashing payload
  string signed_header_1_message_parent_root = 21;
  // The state root from the first signed header in the slashing payload
  string signed_header_1_message_state_root = 22;
  // The signature for the first signed header in the slashing payload
  string signed_header_1_signature = 23;
  // The slot number from the second signed header in the slashing payload
  uint32 signed_header_2_message_slot = 24;
  // The proposer index from the second signed header in the slashing payload
  uint32 signed_header_2_message_proposer_index = 25;
  // The body root from the second signed header in the slashing payload
  string signed_header_2_message_body_root = 26;
  // The parent root from the second signed header in the slashing payload
  string signed_header_2_message_parent_root = 27;
  // The state root from the second signed header in the slashing payload
  string signed_header_2_message_state_root = 28;
  // The signature for the second signed header in the slashing payload
  string signed_header_2_signature = 29;
  // Ethereum network name
  string meta_network_name = 30;
}

// Request for listing canonical_beacon_block_proposer_slashing records
message ListCanonicalBeaconBlockProposerSlashingRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by block_root - The root hash of the beacon block (ORDER BY column 3 - optional)
  StringFilter block_root = 3;

  // Filter by signed_header_1_message_slot - The slot number from the first signed header in the slashing payload (ORDER BY column 4 - optional)
  UInt32Filter signed_header_1_message_slot = 4;

  // Filter by signed_header_2_message_slot - The slot number from the second signed header in the slashing payload (ORDER BY column 5 - optional)
  UInt32Filter signed_header_2_message_slot = 5;

  // Filter by signed_header_1_message_proposer_index - The proposer index from the first signed header in the slashing payload (ORDER BY column 6 - optional)
  UInt32Filter signed_header_1_message_proposer_index = 6;

  // Filter by signed_header_2_message_proposer_index - The proposer index from the second signed header in the slashing payload (ORDER BY column 7 - optional)
  UInt32Filter signed_header_2_message_proposer_index = 7;

  // Filter by signed_header_1_message_body_root - The body root from the first signed header in the slashing payload (ORDER BY column 8 - optional)
  StringFilter signed_header_1_message_body_root = 8;

  // Filter by signed_header_2_message_body_root - The body root from the second signed header in the slashing payload (ORDER BY column 9 - optional)
  StringFilter signed_header_2_message_body_root = 9;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 10;
  // Filter by slot - The slot number from beacon block payload (optional)
  UInt32Filter slot = 11;
  // Filter by epoch - The epoch number from beacon block payload (optional)
  UInt32Filter epoch = 12;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 13;
  // Filter by block_version - The version of the beacon block (optional)
  StringFilter block_version = 14;
  // Filter by signed_header_1_message_parent_root - The parent root from the first signed header in the slashing payload (optional)
  StringFilter signed_header_1_message_parent_root = 15;
  // Filter by signed_header_1_message_state_root - The state root from the first signed header in the slashing payload (optional)
  StringFilter signed_header_1_message_state_root = 16;
  // Filter by signed_header_1_signature - The signature for the first signed header in the slashing payload (optional)
  StringFilter signed_header_1_signature = 17;
  // Filter by signed_header_2_message_parent_root - The parent root from the second signed header in the slashing payload (optional)
  StringFilter signed_header_2_message_parent_root = 18;
  // Filter by signed_header_2_message_state_root - The state root from the second signed header in the slashing payload (optional)
  StringFilter signed_header_2_message_state_root = 19;
  // Filter by signed_header_2_signature - The signature for the second signed header in the slashing payload (optional)
  StringFilter signed_header_2_signature = 20;

  // The maximum number of canonical_beacon_block_proposer_slashing to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 21;
  // A page token, received from a previous `ListCanonicalBeaconBlockProposerSlashing` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 22;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 23;
}

// Response for listing canonical_beacon_block_proposer_slashing records
message ListCanonicalBeaconBlockProposerSlashingResponse {
  // The list of canonical_beacon_block_proposer_slashing.
  repeated CanonicalBeaconBlockProposerSlashing canonical_beacon_block_proposer_slashing = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_block_proposer_slashing record by primary key
message GetCanonicalBeaconBlockProposerSlashingRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_block_proposer_slashing record
message GetCanonicalBeaconBlockProposerSlashingResponse {
  CanonicalBeaconBlockProposerSlashing item = 1;
}

// Query canonical_beacon_block_proposer_slashing data
service CanonicalBeaconBlockProposerSlashingService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconBlockProposerSlashingRequest) returns (ListCanonicalBeaconBlockProposerSlashingResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconBlockProposerSlashingRequest) returns (GetCanonicalBeaconBlockProposerSlashingResponse);
}
