syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains the proposer reward breakdown for a canonical beacon block.

message CanonicalBeaconBlockReward {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The slot number the reward is for
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number the reward is for
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The root hash of the beacon block
  string block_root = 16;
  // The validator index of the block proposer
  uint32 proposer_index = 17;
  // The total block reward in gwei
  uint64 total = 18;
  // The reward from including attestations in gwei
  uint64 attestations = 19;
  // The reward from including the sync aggregate in gwei
  uint64 sync_aggregate = 20;
  // The reward from including proposer slashings in gwei
  uint64 proposer_slashings = 21;
  // The reward from including attester slashings in gwei
  uint64 attester_slashings = 22;
  // Ethereum network name
  string meta_network_name = 23;
}

// Request for listing canonical_beacon_block_reward records
message ListCanonicalBeaconBlockRewardRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by slot - The slot number the reward is for (ORDER BY column 3 - optional)
  UInt32Filter slot = 3;

  // Filter by block_root - The root hash of the beacon block (ORDER BY column 4 - optional)
  StringFilter block_root = 4;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by epoch - The epoch number the reward is for (optional)
  UInt32Filter epoch = 6;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 7;
  // Filter by proposer_index - The validator index of the block proposer (optional)
  UInt32Filter proposer_index = 8;
  // Filter by total - The total block reward in gwei (optional)
  UInt64Filter total = 9;
  // Filter by attestations - The reward from including attestations in gwei (optional)
  UInt64Filter attestations = 10;
  // Filter by sync_aggregate - The reward from including the sync aggregate in gwei (optional)
  UInt64Filter sync_aggregate = 11;
  // Filter by proposer_slashings - The reward from including proposer slashings in gwei (optional)
  UInt64Filter proposer_slashings = 12;
  // Filter by attester_slashings - The reward from including attester slashings in gwei (optional)
  UInt64Filter attester_slashings = 13;

  // The maximum number of canonical_beacon_block_reward to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 14;
  // A page token, received from a previous `ListCanonicalBeaconBlockReward` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 15;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 16;
}

// Response for listing canonical_beacon_block_reward records
message ListCanonicalBeaconBlockRewardResponse {
  // The list of canonical_beacon_block_reward.
  repeated CanonicalBeaconBlockReward canonical_beacon_block_reward = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_block_reward record by primary key
message GetCanonicalBeaconBlockRewardRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_block_reward record
message GetCanonicalBeaconBlockRewardResponse {
  CanonicalBeaconBlockReward item = 1;
}

// Query canonical_beacon_block_reward data
service CanonicalBeaconBlockRewardService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconBlockRewardRequest) returns (ListCanonicalBeaconBlockRewardResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconBlockRewardRequest) returns (GetCanonicalBeaconBlockRewardResponse);
}
