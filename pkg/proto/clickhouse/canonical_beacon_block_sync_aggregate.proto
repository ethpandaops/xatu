syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains canonical beacon block sync aggregate data with expanded validator participation.

message CanonicalBeaconBlockSyncAggregate {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // When the sentry received the event from a beacon node
  int64 event_date_time = 12;
  // Slot number in the beacon chain
  uint32 slot = 13;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 14;
  // The epoch number in the beacon chain
  uint32 epoch = 15;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 16;
  // The root hash of the beacon block
  string block_root = 17;
  // The version of the beacon block
  string block_version = 18;
  // The sync committee period number (epoch / 256)
  uint64 sync_committee_period = 19;
  // Raw 512-bit bitvector as hex string
  string sync_committee_bits = 20;
  // Aggregated signature from participating validators
  string sync_committee_signature = 21;
  // Validator indices that participated (voted)
  repeated uint32 validators_participated = 22;
  // Validator indices that missed (did not vote)
  repeated uint32 validators_missed = 23;
  // Number of validators that participated (0-512)
  uint32 participation_count = 24;
  // Ethereum network name
  string meta_network_name = 25;
}

// Request for listing canonical_beacon_block_sync_aggregate records
message ListCanonicalBeaconBlockSyncAggregateRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by slot - Slot number in the beacon chain (ORDER BY column 3 - optional)
  UInt32Filter slot = 3;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4;
  // Filter by event_date_time - When the sentry received the event from a beacon node (optional)
  Int64Filter event_date_time = 5;
  // Filter by epoch - The epoch number in the beacon chain (optional)
  UInt32Filter epoch = 6;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 7;
  // Filter by block_root - The root hash of the beacon block (optional)
  StringFilter block_root = 8;
  // Filter by block_version - The version of the beacon block (optional)
  StringFilter block_version = 9;
  // Filter by sync_committee_period - The sync committee period number (epoch / 256) (optional)
  UInt64Filter sync_committee_period = 10;
  // Filter by sync_committee_bits - Raw 512-bit bitvector as hex string (optional)
  StringFilter sync_committee_bits = 11;
  // Filter by sync_committee_signature - Aggregated signature from participating validators (optional)
  StringFilter sync_committee_signature = 12;
  // Filter by validators_participated - Validator indices that participated (voted) (optional)
  ArrayUInt32Filter validators_participated = 13;
  // Filter by validators_missed - Validator indices that missed (did not vote) (optional)
  ArrayUInt32Filter validators_missed = 14;
  // Filter by participation_count - Number of validators that participated (0-512) (optional)
  UInt32Filter participation_count = 15;

  // The maximum number of canonical_beacon_block_sync_aggregate to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 16;
  // A page token, received from a previous `ListCanonicalBeaconBlockSyncAggregate` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 17;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 18;
}

// Response for listing canonical_beacon_block_sync_aggregate records
message ListCanonicalBeaconBlockSyncAggregateResponse {
  // The list of canonical_beacon_block_sync_aggregate.
  repeated CanonicalBeaconBlockSyncAggregate canonical_beacon_block_sync_aggregate = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_block_sync_aggregate record by primary key
message GetCanonicalBeaconBlockSyncAggregateRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_block_sync_aggregate record
message GetCanonicalBeaconBlockSyncAggregateResponse {
  CanonicalBeaconBlockSyncAggregate item = 1;
}

// Query canonical_beacon_block_sync_aggregate data
service CanonicalBeaconBlockSyncAggregateService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconBlockSyncAggregateRequest) returns (ListCanonicalBeaconBlockSyncAggregateResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconBlockSyncAggregateRequest) returns (GetCanonicalBeaconBlockSyncAggregateResponse);
}
