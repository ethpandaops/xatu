syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains a voluntary exit from a beacon block.

message CanonicalBeaconBlockVoluntaryExit {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The slot number from beacon block payload
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number from beacon block payload
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The root hash of the beacon block
  string block_root = 16;
  // The version of the beacon block
  string block_version = 17;
  // The epoch number from the exit message
  uint32 voluntary_exit_message_epoch = 18;
  // The validator index from the exit message
  uint32 voluntary_exit_message_validator_index = 19;
  // The signature of the exit message
  string voluntary_exit_signature = 20;
  // Ethereum network name
  string meta_network_name = 21;
}

// Request for listing canonical_beacon_block_voluntary_exit records
message ListCanonicalBeaconBlockVoluntaryExitRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by block_root - The root hash of the beacon block (ORDER BY column 3 - optional)
  StringFilter block_root = 3;

  // Filter by voluntary_exit_message_epoch - The epoch number from the exit message (ORDER BY column 4 - optional)
  UInt32Filter voluntary_exit_message_epoch = 4;

  // Filter by voluntary_exit_message_validator_index - The validator index from the exit message (ORDER BY column 5 - optional)
  UInt32Filter voluntary_exit_message_validator_index = 5;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 6;
  // Filter by slot - The slot number from beacon block payload (optional)
  UInt32Filter slot = 7;
  // Filter by epoch - The epoch number from beacon block payload (optional)
  UInt32Filter epoch = 8;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 9;
  // Filter by block_version - The version of the beacon block (optional)
  StringFilter block_version = 10;
  // Filter by voluntary_exit_signature - The signature of the exit message (optional)
  StringFilter voluntary_exit_signature = 11;

  // The maximum number of canonical_beacon_block_voluntary_exit to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 12;
  // A page token, received from a previous `ListCanonicalBeaconBlockVoluntaryExit` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 13;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 14;
}

// Response for listing canonical_beacon_block_voluntary_exit records
message ListCanonicalBeaconBlockVoluntaryExitResponse {
  // The list of canonical_beacon_block_voluntary_exit.
  repeated CanonicalBeaconBlockVoluntaryExit canonical_beacon_block_voluntary_exit = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_block_voluntary_exit record by primary key
message GetCanonicalBeaconBlockVoluntaryExitRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_block_voluntary_exit record
message GetCanonicalBeaconBlockVoluntaryExitResponse {
  CanonicalBeaconBlockVoluntaryExit item = 1;
}

// Query canonical_beacon_block_voluntary_exit data
service CanonicalBeaconBlockVoluntaryExitService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconBlockVoluntaryExitRequest) returns (ListCanonicalBeaconBlockVoluntaryExitResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconBlockVoluntaryExitRequest) returns (GetCanonicalBeaconBlockVoluntaryExitResponse);
}
