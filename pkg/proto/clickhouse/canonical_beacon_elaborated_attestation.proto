syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains elaborated attestations from beacon blocks.

message CanonicalBeaconElaboratedAttestation {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The slot number of the block containing the attestation
  uint32 block_slot = 12;
  // The wall clock time when the block slot started
  uint32 block_slot_start_date_time = 13;
  // The epoch number of the block containing the attestation
  uint32 block_epoch = 14;
  // The wall clock time when the block epoch started
  uint32 block_epoch_start_date_time = 15;
  // The position of the attestation in the block
  uint32 position_in_block = 16;
  // The root of the block containing the attestation
  string block_root = 17;
  // Array of validator indices participating in the attestation
  repeated uint32 validators = 18;
  // The index of the committee making the attestation
  string committee_index = 19;
  // The root of the beacon block being attested to
  string beacon_block_root = 20;
  // The slot number being attested to
  uint32 slot = 21;
  uint32 slot_start_date_time = 22;
  uint32 epoch = 23;
  uint32 epoch_start_date_time = 24;
  // The source epoch referenced in the attestation
  uint32 source_epoch = 25;
  // The wall clock time when the source epoch started
  uint32 source_epoch_start_date_time = 26;
  // The root of the source checkpoint in the attestation
  string source_root = 27;
  // The target epoch referenced in the attestation
  uint32 target_epoch = 28;
  // The wall clock time when the target epoch started
  uint32 target_epoch_start_date_time = 29;
  // The root of the target checkpoint in the attestation
  string target_root = 30;
  // Ethereum network name
  string meta_network_name = 31;
}

// Request for listing canonical_beacon_elaborated_attestation records
message ListCanonicalBeaconElaboratedAttestationRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by block_root - The root of the block containing the attestation (ORDER BY column 3 - optional)
  StringFilter block_root = 3;

  // Filter by block_slot - The slot number of the block containing the attestation (ORDER BY column 4 - optional)
  UInt32Filter block_slot = 4;

  // Filter by position_in_block - The position of the attestation in the block (ORDER BY column 5 - optional)
  UInt32Filter position_in_block = 5;

  // Filter by beacon_block_root - The root of the beacon block being attested to (ORDER BY column 6 - optional)
  StringFilter beacon_block_root = 6;

  // Filter by slot - The slot number being attested to (ORDER BY column 7 - optional)
  UInt32Filter slot = 7;

  // Filter by committee_index - The index of the committee making the attestation (ORDER BY column 8 - optional)
  StringFilter committee_index = 8;

  // Filter by source_root - The root of the source checkpoint in the attestation (ORDER BY column 9 - optional)
  StringFilter source_root = 9;

  // Filter by target_root - The root of the target checkpoint in the attestation (ORDER BY column 10 - optional)
  StringFilter target_root = 10;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 11;
  // Filter by block_slot_start_date_time - The wall clock time when the block slot started (optional)
  UInt32Filter block_slot_start_date_time = 12;
  // Filter by block_epoch - The epoch number of the block containing the attestation (optional)
  UInt32Filter block_epoch = 13;
  // Filter by block_epoch_start_date_time - The wall clock time when the block epoch started (optional)
  UInt32Filter block_epoch_start_date_time = 14;
  // Filter by validators - Array of validator indices participating in the attestation (optional)
  ArrayUInt32Filter validators = 15;
  // Filter by epoch (optional)
  UInt32Filter epoch = 16;
  // Filter by epoch_start_date_time (optional)
  UInt32Filter epoch_start_date_time = 17;
  // Filter by source_epoch - The source epoch referenced in the attestation (optional)
  UInt32Filter source_epoch = 18;
  // Filter by source_epoch_start_date_time - The wall clock time when the source epoch started (optional)
  UInt32Filter source_epoch_start_date_time = 19;
  // Filter by target_epoch - The target epoch referenced in the attestation (optional)
  UInt32Filter target_epoch = 20;
  // Filter by target_epoch_start_date_time - The wall clock time when the target epoch started (optional)
  UInt32Filter target_epoch_start_date_time = 21;

  // The maximum number of canonical_beacon_elaborated_attestation to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 22;
  // A page token, received from a previous `ListCanonicalBeaconElaboratedAttestation` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 23;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 24;
}

// Response for listing canonical_beacon_elaborated_attestation records
message ListCanonicalBeaconElaboratedAttestationResponse {
  // The list of canonical_beacon_elaborated_attestation.
  repeated CanonicalBeaconElaboratedAttestation canonical_beacon_elaborated_attestation = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_elaborated_attestation record by primary key
message GetCanonicalBeaconElaboratedAttestationRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_elaborated_attestation record
message GetCanonicalBeaconElaboratedAttestationResponse {
  CanonicalBeaconElaboratedAttestation item = 1;
}

// Query canonical_beacon_elaborated_attestation data
service CanonicalBeaconElaboratedAttestationService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconElaboratedAttestationRequest) returns (ListCanonicalBeaconElaboratedAttestationResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconElaboratedAttestationRequest) returns (GetCanonicalBeaconElaboratedAttestationResponse);
}
