syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains the Gloas execution payload availability bit of each slot, as recorded by the canonical beacon state.

message CanonicalBeaconStateExecutionPayloadAvailability {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The slot the availability bit is for
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number the slot belongs to
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The state ID the bit was read from
  string state_id = 16;
  // Whether the slot execution payload was revealed and applied to the state
  bool available = 17;
  // Ethereum network name
  string meta_network_name = 18;
}

// Request for listing canonical_beacon_state_execution_payload_availability records
message ListCanonicalBeaconStateExecutionPayloadAvailabilityRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by slot - The slot the availability bit is for (ORDER BY column 3 - optional)
  UInt32Filter slot = 3;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 4;
  // Filter by epoch - The epoch number the slot belongs to (optional)
  UInt32Filter epoch = 5;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 6;
  // Filter by state_id - The state ID the bit was read from (optional)
  StringFilter state_id = 7;
  // Filter by available - Whether the slot execution payload was revealed and applied to the state (optional)
  BoolFilter available = 8;

  // The maximum number of canonical_beacon_state_execution_payload_availability to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 9;
  // A page token, received from a previous `ListCanonicalBeaconStateExecutionPayloadAvailability` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 10;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 11;
}

// Response for listing canonical_beacon_state_execution_payload_availability records
message ListCanonicalBeaconStateExecutionPayloadAvailabilityResponse {
  // The list of canonical_beacon_state_execution_payload_availability.
  repeated CanonicalBeaconStateExecutionPayloadAvailability canonical_beacon_state_execution_payload_availability = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_state_execution_payload_availability record by primary key
message GetCanonicalBeaconStateExecutionPayloadAvailabilityRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_state_execution_payload_availability record
message GetCanonicalBeaconStateExecutionPayloadAvailabilityResponse {
  CanonicalBeaconStateExecutionPayloadAvailability item = 1;
}

// Query canonical_beacon_state_execution_payload_availability data
service CanonicalBeaconStateExecutionPayloadAvailabilityService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconStateExecutionPayloadAvailabilityRequest) returns (ListCanonicalBeaconStateExecutionPayloadAvailabilityResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconStateExecutionPayloadAvailabilityRequest) returns (GetCanonicalBeaconStateExecutionPayloadAvailabilityResponse);
}
