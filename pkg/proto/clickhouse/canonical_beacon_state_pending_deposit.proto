syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains the Electra pending deposit queue snapshot for a canonical beacon state epoch.

message CanonicalBeaconStatePendingDeposit {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The epoch number the pending deposit queue snapshot is for
  uint32 epoch = 12;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 13;
  // The state ID the pending deposit was requested against
  string state_id = 14;
  // The index of the deposit within the pending deposits queue
  uint32 position_in_queue = 15;
  // The public key of the validator from the pending deposit
  string pubkey = 16;
  // The withdrawal credentials from the pending deposit
  string withdrawal_credentials = 17;
  // The deposit amount in gwei
  string amount = 18;
  // The deposit signature
  string signature = 19;
  // The slot at which the deposit was queued
  uint32 slot = 20;
  // Ethereum network name
  string meta_network_name = 21;
}

// Request for listing canonical_beacon_state_pending_deposit records
message ListCanonicalBeaconStatePendingDepositRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by epoch_start_date_time - The wall clock time when the epoch started (ORDER BY column 2 - optional)
  UInt32Filter epoch_start_date_time = 2;

  // Filter by epoch - The epoch number the pending deposit queue snapshot is for (ORDER BY column 3 - optional)
  UInt32Filter epoch = 3;

  // Filter by position_in_queue - The index of the deposit within the pending deposits queue (ORDER BY column 4 - optional)
  UInt32Filter position_in_queue = 4;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by state_id - The state ID the pending deposit was requested against (optional)
  StringFilter state_id = 6;
  // Filter by pubkey - The public key of the validator from the pending deposit (optional)
  StringFilter pubkey = 7;
  // Filter by withdrawal_credentials - The withdrawal credentials from the pending deposit (optional)
  StringFilter withdrawal_credentials = 8;
  // Filter by amount - The deposit amount in gwei (optional)
  StringFilter amount = 9;
  // Filter by signature - The deposit signature (optional)
  StringFilter signature = 10;
  // Filter by slot - The slot at which the deposit was queued (optional)
  UInt32Filter slot = 11;

  // The maximum number of canonical_beacon_state_pending_deposit to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 12;
  // A page token, received from a previous `ListCanonicalBeaconStatePendingDeposit` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 13;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 14;
}

// Response for listing canonical_beacon_state_pending_deposit records
message ListCanonicalBeaconStatePendingDepositResponse {
  // The list of canonical_beacon_state_pending_deposit.
  repeated CanonicalBeaconStatePendingDeposit canonical_beacon_state_pending_deposit = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_state_pending_deposit record by primary key
message GetCanonicalBeaconStatePendingDepositRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_state_pending_deposit record
message GetCanonicalBeaconStatePendingDepositResponse {
  CanonicalBeaconStatePendingDeposit item = 1;
}

// Query canonical_beacon_state_pending_deposit data
service CanonicalBeaconStatePendingDepositService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconStatePendingDepositRequest) returns (ListCanonicalBeaconStatePendingDepositResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconStatePendingDepositRequest) returns (GetCanonicalBeaconStatePendingDepositResponse);
}
