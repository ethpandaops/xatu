syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains the ordered payload timeliness committee of each Gloas slot, one row per committee position.

message CanonicalBeaconStatePtcMember {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The slot the payload timeliness committee serves
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number the slot belongs to
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The state ID the committee was read from
  string state_id = 16;
  // The index of the member within the committee, equal to its bit index in a payload attestation aggregation_bits
  uint32 position = 17;
  // The validator holding this position, which can repeat within a committee
  uint32 validator_index = 18;
  // Ethereum network name
  string meta_network_name = 19;
}

// Request for listing canonical_beacon_state_ptc_member records
message ListCanonicalBeaconStatePtcMemberRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by slot - The slot the payload timeliness committee serves (ORDER BY column 3 - optional)
  UInt32Filter slot = 3;

  // Filter by position - The index of the member within the committee, equal to its bit index in a payload attestation aggregation_bits (ORDER BY column 4 - optional)
  UInt32Filter position = 4;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by epoch - The epoch number the slot belongs to (optional)
  UInt32Filter epoch = 6;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 7;
  // Filter by state_id - The state ID the committee was read from (optional)
  StringFilter state_id = 8;
  // Filter by validator_index - The validator holding this position, which can repeat within a committee (optional)
  UInt32Filter validator_index = 9;

  // The maximum number of canonical_beacon_state_ptc_member to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 10;
  // A page token, received from a previous `ListCanonicalBeaconStatePtcMember` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 11;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 12;
}

// Response for listing canonical_beacon_state_ptc_member records
message ListCanonicalBeaconStatePtcMemberResponse {
  // The list of canonical_beacon_state_ptc_member.
  repeated CanonicalBeaconStatePtcMember canonical_beacon_state_ptc_member = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_state_ptc_member record by primary key
message GetCanonicalBeaconStatePtcMemberRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_state_ptc_member record
message GetCanonicalBeaconStatePtcMemberResponse {
  CanonicalBeaconStatePtcMember item = 1;
}

// Query canonical_beacon_state_ptc_member data
service CanonicalBeaconStatePtcMemberService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconStatePtcMemberRequest) returns (ListCanonicalBeaconStatePtcMemberResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconStatePtcMemberRequest) returns (GetCanonicalBeaconStatePtcMemberResponse);
}
