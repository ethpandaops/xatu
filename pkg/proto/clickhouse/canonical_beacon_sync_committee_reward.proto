syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains per-member sync committee rewards for a canonical beacon block.

message CanonicalBeaconSyncCommitteeReward {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The slot number the reward is for
  uint32 slot = 12;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 13;
  // The epoch number the reward is for
  uint32 epoch = 14;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 15;
  // The root hash of the beacon block
  string block_root = 16;
  // The validator index the reward applies to
  uint32 validator_index = 17;
  // The sync committee reward in gwei (negative when a penalty)
  int64 reward = 18;
  // Ethereum network name
  string meta_network_name = 19;
}

// Request for listing canonical_beacon_sync_committee_reward records
message ListCanonicalBeaconSyncCommitteeRewardRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - The wall clock time when the slot started (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by slot - The slot number the reward is for (ORDER BY column 3 - optional)
  UInt32Filter slot = 3;

  // Filter by block_root - The root hash of the beacon block (ORDER BY column 4 - optional)
  StringFilter block_root = 4;

  // Filter by validator_index - The validator index the reward applies to (ORDER BY column 5 - optional)
  UInt32Filter validator_index = 5;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 6;
  // Filter by epoch - The epoch number the reward is for (optional)
  UInt32Filter epoch = 7;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 8;
  // Filter by reward - The sync committee reward in gwei (negative when a penalty) (optional)
  Int64Filter reward = 9;

  // The maximum number of canonical_beacon_sync_committee_reward to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 10;
  // A page token, received from a previous `ListCanonicalBeaconSyncCommitteeReward` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 11;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 12;
}

// Response for listing canonical_beacon_sync_committee_reward records
message ListCanonicalBeaconSyncCommitteeRewardResponse {
  // The list of canonical_beacon_sync_committee_reward.
  repeated CanonicalBeaconSyncCommitteeReward canonical_beacon_sync_committee_reward = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_sync_committee_reward record by primary key
message GetCanonicalBeaconSyncCommitteeRewardRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_sync_committee_reward record
message GetCanonicalBeaconSyncCommitteeRewardResponse {
  CanonicalBeaconSyncCommitteeReward item = 1;
}

// Query canonical_beacon_sync_committee_reward data
service CanonicalBeaconSyncCommitteeRewardService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconSyncCommitteeRewardRequest) returns (ListCanonicalBeaconSyncCommitteeRewardResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconSyncCommitteeRewardRequest) returns (GetCanonicalBeaconSyncCommitteeRewardResponse);
}
