syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains a validator state for an epoch.

message CanonicalBeaconValidators {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The epoch number from beacon block payload
  uint32 epoch = 12;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 13;
  // The index of the validator
  uint32 index = 14;
  // The balance of the validator
  google.protobuf.UInt64Value balance = 15;
  // The status of the validator
  string status = 16;
  // The effective balance of the validator
  google.protobuf.UInt64Value effective_balance = 17;
  // Whether the validator is slashed
  bool slashed = 18;
  // The epoch when the validator was activated
  google.protobuf.UInt64Value activation_epoch = 19;
  // The epoch when the validator was activated
  google.protobuf.UInt64Value activation_eligibility_epoch = 20;
  // The epoch when the validator exited
  google.protobuf.UInt64Value exit_epoch = 21;
  // The epoch when the validator can withdraw
  google.protobuf.UInt64Value withdrawable_epoch = 22;
  // Ethereum network name
  string meta_network_name = 23;
}

// Request for listing canonical_beacon_validators records
message ListCanonicalBeaconValidatorsRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by epoch_start_date_time - The wall clock time when the epoch started (ORDER BY column 2 - optional)
  UInt32Filter epoch_start_date_time = 2;

  // Filter by index - The index of the validator (ORDER BY column 3 - optional)
  UInt32Filter index = 3;

  // Filter by status - The status of the validator (ORDER BY column 4 - optional)
  StringFilter status = 4;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by epoch - The epoch number from beacon block payload (optional)
  UInt32Filter epoch = 6;
  // Filter by balance - The balance of the validator (optional)
  NullableUInt64Filter balance = 7;
  // Filter by effective_balance - The effective balance of the validator (optional)
  NullableUInt64Filter effective_balance = 8;
  // Filter by slashed - Whether the validator is slashed (optional)
  BoolFilter slashed = 9;
  // Filter by activation_epoch - The epoch when the validator was activated (optional)
  NullableUInt64Filter activation_epoch = 10;
  // Filter by activation_eligibility_epoch - The epoch when the validator was activated (optional)
  NullableUInt64Filter activation_eligibility_epoch = 11;
  // Filter by exit_epoch - The epoch when the validator exited (optional)
  NullableUInt64Filter exit_epoch = 12;
  // Filter by withdrawable_epoch - The epoch when the validator can withdraw (optional)
  NullableUInt64Filter withdrawable_epoch = 13;

  // The maximum number of canonical_beacon_validators to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 14;
  // A page token, received from a previous `ListCanonicalBeaconValidators` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 15;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 16;
}

// Response for listing canonical_beacon_validators records
message ListCanonicalBeaconValidatorsResponse {
  // The list of canonical_beacon_validators.
  repeated CanonicalBeaconValidators canonical_beacon_validators = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_validators record by primary key
message GetCanonicalBeaconValidatorsRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_validators record
message GetCanonicalBeaconValidatorsResponse {
  CanonicalBeaconValidators item = 1;
}

// Query canonical_beacon_validators data
service CanonicalBeaconValidatorsService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconValidatorsRequest) returns (ListCanonicalBeaconValidatorsResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconValidatorsRequest) returns (GetCanonicalBeaconValidatorsResponse);
}
