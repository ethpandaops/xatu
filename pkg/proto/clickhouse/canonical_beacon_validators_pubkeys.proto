syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains a validator pubkeys for an epoch.

message CanonicalBeaconValidatorsPubkeys {
  // When this row was last updated
  uint32 updated_date_time = 11;
  // The epoch number from beacon block payload
  uint32 epoch = 12;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 13;
  // The index of the validator
  uint32 index = 14;
  // The public key of the validator
  string pubkey = 15;
  // Ethereum network name
  string meta_network_name = 16;
}

// Request for listing canonical_beacon_validators_pubkeys records
message ListCanonicalBeaconValidatorsPubkeysRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by index - The index of the validator (ORDER BY column 2 - optional)
  UInt32Filter index = 2;

  // Filter by pubkey - The public key of the validator (ORDER BY column 3 - optional)
  StringFilter pubkey = 3;

  // Filter by updated_date_time - When this row was last updated (optional)
  UInt32Filter updated_date_time = 4;
  // Filter by epoch - The epoch number from beacon block payload (optional)
  UInt32Filter epoch = 5;
  // Filter by epoch_start_date_time - The wall clock time when the epoch started (optional)
  UInt32Filter epoch_start_date_time = 6;

  // The maximum number of canonical_beacon_validators_pubkeys to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 7;
  // A page token, received from a previous `ListCanonicalBeaconValidatorsPubkeys` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 8;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 9;
}

// Response for listing canonical_beacon_validators_pubkeys records
message ListCanonicalBeaconValidatorsPubkeysResponse {
  // The list of canonical_beacon_validators_pubkeys.
  repeated CanonicalBeaconValidatorsPubkeys canonical_beacon_validators_pubkeys = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_beacon_validators_pubkeys record by primary key
message GetCanonicalBeaconValidatorsPubkeysRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_beacon_validators_pubkeys record
message GetCanonicalBeaconValidatorsPubkeysResponse {
  CanonicalBeaconValidatorsPubkeys item = 1;
}

// Query canonical_beacon_validators_pubkeys data
service CanonicalBeaconValidatorsPubkeysService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalBeaconValidatorsPubkeysRequest) returns (ListCanonicalBeaconValidatorsPubkeysResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalBeaconValidatorsPubkeysRequest) returns (GetCanonicalBeaconValidatorsPubkeysResponse);
}
