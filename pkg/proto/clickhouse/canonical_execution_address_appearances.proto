syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains canonical execution address appearance data.

message CanonicalExecutionAddressAppearances {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The block number
  uint64 block_number = 12;
  // The transaction hash that caused the address appearance
  string transaction_hash = 13;
  // The internal index of the address appearance within the transaction
  uint32 internal_index = 14;
  // The address of the address appearance
  string address = 15;
  // The relationship of the address to the transaction
  string relationship = 16;
  // Ethereum network name
  string meta_network_name = 17;
}

// Request for listing canonical_execution_address_appearances records
message ListCanonicalExecutionAddressAppearancesRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by block_number - The block number (ORDER BY column 2 - optional)
  UInt64Filter block_number = 2;

  // Filter by transaction_hash - The transaction hash that caused the address appearance (ORDER BY column 3 - optional)
  StringFilter transaction_hash = 3;

  // Filter by internal_index - The internal index of the address appearance within the transaction (ORDER BY column 4 - optional)
  UInt32Filter internal_index = 4;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by address - The address of the address appearance (optional)
  StringFilter address = 6;
  // Filter by relationship - The relationship of the address to the transaction (optional)
  StringFilter relationship = 7;

  // The maximum number of canonical_execution_address_appearances to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 8;
  // A page token, received from a previous `ListCanonicalExecutionAddressAppearances` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 9;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 10;
}

// Response for listing canonical_execution_address_appearances records
message ListCanonicalExecutionAddressAppearancesResponse {
  // The list of canonical_execution_address_appearances.
  repeated CanonicalExecutionAddressAppearances canonical_execution_address_appearances = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_execution_address_appearances record by primary key
message GetCanonicalExecutionAddressAppearancesRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_execution_address_appearances record
message GetCanonicalExecutionAddressAppearancesResponse {
  CanonicalExecutionAddressAppearances item = 1;
}

// Query canonical_execution_address_appearances data
service CanonicalExecutionAddressAppearancesService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalExecutionAddressAppearancesRequest) returns (ListCanonicalExecutionAddressAppearancesResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalExecutionAddressAppearancesRequest) returns (GetCanonicalExecutionAddressAppearancesResponse);
}
