syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains canonical execution erc20 transfer data.

message CanonicalExecutionErc20Transfers {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The block number
  uint64 block_number = 12;
  // The transaction index in the block
  uint64 transaction_index = 13;
  // The transaction hash
  string transaction_hash = 14;
  // The internal index of the transfer within the transaction
  uint32 internal_index = 15;
  // The log index in the block
  uint64 log_index = 16;
  // The erc20 address
  string erc20 = 17;
  // The from address
  string from_address = 18;
  // The to address
  string to_address = 19;
  // The value of the transfer
  string value = 20;
  // Ethereum network name
  string meta_network_name = 21;
}

// Request for listing canonical_execution_erc20_transfers records
message ListCanonicalExecutionErc20TransfersRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by block_number - The block number (ORDER BY column 2 - optional)
  UInt64Filter block_number = 2;

  // Filter by transaction_hash - The transaction hash (ORDER BY column 3 - optional)
  StringFilter transaction_hash = 3;

  // Filter by internal_index - The internal index of the transfer within the transaction (ORDER BY column 4 - optional)
  UInt32Filter internal_index = 4;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by transaction_index - The transaction index in the block (optional)
  UInt64Filter transaction_index = 6;
  // Filter by log_index - The log index in the block (optional)
  UInt64Filter log_index = 7;
  // Filter by erc20 - The erc20 address (optional)
  StringFilter erc20 = 8;
  // Filter by from_address - The from address (optional)
  StringFilter from_address = 9;
  // Filter by to_address - The to address (optional)
  StringFilter to_address = 10;
  // Filter by value - The value of the transfer (optional)
  StringFilter value = 11;

  // The maximum number of canonical_execution_erc20_transfers to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 12;
  // A page token, received from a previous `ListCanonicalExecutionErc20Transfers` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 13;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 14;
}

// Response for listing canonical_execution_erc20_transfers records
message ListCanonicalExecutionErc20TransfersResponse {
  // The list of canonical_execution_erc20_transfers.
  repeated CanonicalExecutionErc20Transfers canonical_execution_erc20_transfers = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_execution_erc20_transfers record by primary key
message GetCanonicalExecutionErc20TransfersRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_execution_erc20_transfers record
message GetCanonicalExecutionErc20TransfersResponse {
  CanonicalExecutionErc20Transfers item = 1;
}

// Query canonical_execution_erc20_transfers data
service CanonicalExecutionErc20TransfersService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalExecutionErc20TransfersRequest) returns (ListCanonicalExecutionErc20TransfersResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalExecutionErc20TransfersRequest) returns (GetCanonicalExecutionErc20TransfersResponse);
}
