syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains canonical execution storage reads data.

message CanonicalExecutionStorageReads {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The block number
  uint64 block_number = 12;
  // The transaction index
  uint64 transaction_index = 13;
  // The transaction hash associated with the storage read
  string transaction_hash = 14;
  // The internal index of the storage read within the transaction
  uint32 internal_index = 15;
  // The contract address associated with the storage read
  string contract_address = 16;
  // The storage slot key
  string slot = 17;
  // The value read from the storage slot
  string value = 18;
  // Ethereum network name
  string meta_network_name = 19;
}

// Request for listing canonical_execution_storage_reads records
message ListCanonicalExecutionStorageReadsRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by block_number - The block number (ORDER BY column 2 - optional)
  UInt64Filter block_number = 2;

  // Filter by transaction_hash - The transaction hash associated with the storage read (ORDER BY column 3 - optional)
  StringFilter transaction_hash = 3;

  // Filter by internal_index - The internal index of the storage read within the transaction (ORDER BY column 4 - optional)
  UInt32Filter internal_index = 4;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by transaction_index - The transaction index (optional)
  UInt64Filter transaction_index = 6;
  // Filter by contract_address - The contract address associated with the storage read (optional)
  StringFilter contract_address = 7;
  // Filter by slot - The storage slot key (optional)
  StringFilter slot = 8;
  // Filter by value - The value read from the storage slot (optional)
  StringFilter value = 9;

  // The maximum number of canonical_execution_storage_reads to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 10;
  // A page token, received from a previous `ListCanonicalExecutionStorageReads` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 11;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 12;
}

// Response for listing canonical_execution_storage_reads records
message ListCanonicalExecutionStorageReadsResponse {
  // The list of canonical_execution_storage_reads.
  repeated CanonicalExecutionStorageReads canonical_execution_storage_reads = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_execution_storage_reads record by primary key
message GetCanonicalExecutionStorageReadsRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_execution_storage_reads record
message GetCanonicalExecutionStorageReadsResponse {
  CanonicalExecutionStorageReads item = 1;
}

// Query canonical_execution_storage_reads data
service CanonicalExecutionStorageReadsService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalExecutionStorageReadsRequest) returns (ListCanonicalExecutionStorageReadsResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalExecutionStorageReadsRequest) returns (GetCanonicalExecutionStorageReadsResponse);
}
