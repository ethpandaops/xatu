syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Aggregated EVM execution data. Summary rows (operation="") contain frame metadata. Per-opcode rows contain aggregated gas/count per (frame, opcode).

message CanonicalExecutionTransactionStructlogAgg {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The block number
  uint64 block_number = 12;
  // The transaction hash
  string transaction_hash = 13;
  // The transaction position in the block
  uint64 transaction_index = 14;
  // Sequential frame ID within the transaction (0=root)
  uint32 call_frame_id = 15;
  // Parent frame ID (NULL for root frame)
  google.protobuf.UInt32Value parent_call_frame_id = 16;
  // Path of frame IDs from root to current frame
  repeated uint32 call_frame_path = 17;
  // Call nesting depth (0=root)
  uint32 depth = 18;
  // Contract address being called
  google.protobuf.StringValue target_address = 19;
  // Call type: CALL/DELEGATECALL/STATICCALL/CALLCODE/CREATE/CREATE2 (empty for root)
  string call_type = 20;
  // Opcode name for per-opcode rows, empty string for frame summary rows
  string operation = 21;
  // Number of opcodes (total for summary row, count for per-opcode row)
  uint64 opcode_count = 22;
  // Number of errors
  uint64 error_count = 23;
  // Gas consumed: SUM(gas_self) for per-opcode, frame self gas for summary
  uint64 gas = 24;
  // Cumulative gas: SUM(gas_used) for per-opcode, frame total for summary
  uint64 gas_cumulative = 25;
  // Minimum depth where opcode appeared (per-opcode rows)
  uint32 min_depth = 26;
  // Maximum depth where opcode appeared (per-opcode rows)
  uint32 max_depth = 27;
  // SUM(ceil(memory_bytes/32)) before each opcode executes. Used with sq_sum to compute memory expansion gas.
  uint64 memory_words_sum_before = 28;
  // SUM(ceil(memory_bytes/32)) after each opcode executes.
  uint64 memory_words_sum_after = 29;
  // SUM(words_before²). With sum_before, enables exact memory gas via E[cost(after)] - E[cost(before)].
  uint64 memory_words_sq_sum_before = 30;
  // SUM(words_after²). With sum_after, enables exact memory gas via E[cost(after)] - E[cost(before)].
  uint64 memory_words_sq_sum_after = 31;
  // SUM(memory_expansion_gas). Exact per-opcode memory expansion cost, pre-computed to avoid intDiv rounding in SQL reconstruction.
  uint64 memory_expansion_gas = 32;
  // Number of cold storage/account accesses (EIP-2929). cold_gas = cold_count * (cold_cost - warm_cost).
  uint64 cold_access_count = 33;
  // Gas refund (root summary row only)
  google.protobuf.UInt64Value gas_refund = 34;
  // Intrinsic gas (root summary row only, computed)
  google.protobuf.UInt64Value intrinsic_gas = 35;
  // Ethereum network name
  string meta_network_name = 36;
}

// Request for listing canonical_execution_transaction_structlog_agg records
message ListCanonicalExecutionTransactionStructlogAggRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by block_number - The block number (ORDER BY column 2 - optional)
  UInt64Filter block_number = 2;

  // Filter by transaction_hash - The transaction hash (ORDER BY column 3 - optional)
  StringFilter transaction_hash = 3;

  // Filter by call_frame_id - Sequential frame ID within the transaction (0=root) (ORDER BY column 4 - optional)
  UInt32Filter call_frame_id = 4;

  // Filter by operation - Opcode name for per-opcode rows, empty string for frame summary rows (ORDER BY column 5 - optional)
  StringFilter operation = 5;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 6;
  // Filter by transaction_index - The transaction position in the block (optional)
  UInt64Filter transaction_index = 7;
  // Filter by parent_call_frame_id - Parent frame ID (NULL for root frame) (optional)
  NullableUInt32Filter parent_call_frame_id = 8;
  // Filter by call_frame_path - Path of frame IDs from root to current frame (optional)
  ArrayUInt32Filter call_frame_path = 9;
  // Filter by depth - Call nesting depth (0=root) (optional)
  UInt32Filter depth = 10;
  // Filter by target_address - Contract address being called (optional)
  NullableStringFilter target_address = 11;
  // Filter by call_type - Call type: CALL/DELEGATECALL/STATICCALL/CALLCODE/CREATE/CREATE2 (empty for root) (optional)
  StringFilter call_type = 12;
  // Filter by opcode_count - Number of opcodes (total for summary row, count for per-opcode row) (optional)
  UInt64Filter opcode_count = 13;
  // Filter by error_count - Number of errors (optional)
  UInt64Filter error_count = 14;
  // Filter by gas - Gas consumed: SUM(gas_self) for per-opcode, frame self gas for summary (optional)
  UInt64Filter gas = 15;
  // Filter by gas_cumulative - Cumulative gas: SUM(gas_used) for per-opcode, frame total for summary (optional)
  UInt64Filter gas_cumulative = 16;
  // Filter by min_depth - Minimum depth where opcode appeared (per-opcode rows) (optional)
  UInt32Filter min_depth = 17;
  // Filter by max_depth - Maximum depth where opcode appeared (per-opcode rows) (optional)
  UInt32Filter max_depth = 18;
  // Filter by memory_words_sum_before - SUM(ceil(memory_bytes/32)) before each opcode executes. Used with sq_sum to compute memory expansion gas. (optional)
  UInt64Filter memory_words_sum_before = 19;
  // Filter by memory_words_sum_after - SUM(ceil(memory_bytes/32)) after each opcode executes. (optional)
  UInt64Filter memory_words_sum_after = 20;
  // Filter by memory_words_sq_sum_before - SUM(words_before²). With sum_before, enables exact memory gas via E[cost(after)] - E[cost(before)]. (optional)
  UInt64Filter memory_words_sq_sum_before = 21;
  // Filter by memory_words_sq_sum_after - SUM(words_after²). With sum_after, enables exact memory gas via E[cost(after)] - E[cost(before)]. (optional)
  UInt64Filter memory_words_sq_sum_after = 22;
  // Filter by memory_expansion_gas - SUM(memory_expansion_gas). Exact per-opcode memory expansion cost, pre-computed to avoid intDiv rounding in SQL reconstruction. (optional)
  UInt64Filter memory_expansion_gas = 23;
  // Filter by cold_access_count - Number of cold storage/account accesses (EIP-2929). cold_gas = cold_count * (cold_cost - warm_cost). (optional)
  UInt64Filter cold_access_count = 24;
  // Filter by gas_refund - Gas refund (root summary row only) (optional)
  NullableUInt64Filter gas_refund = 25;
  // Filter by intrinsic_gas - Intrinsic gas (root summary row only, computed) (optional)
  NullableUInt64Filter intrinsic_gas = 26;

  // The maximum number of canonical_execution_transaction_structlog_agg to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 27;
  // A page token, received from a previous `ListCanonicalExecutionTransactionStructlogAgg` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 28;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 29;
}

// Response for listing canonical_execution_transaction_structlog_agg records
message ListCanonicalExecutionTransactionStructlogAggResponse {
  // The list of canonical_execution_transaction_structlog_agg.
  repeated CanonicalExecutionTransactionStructlogAgg canonical_execution_transaction_structlog_agg = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single canonical_execution_transaction_structlog_agg record by primary key
message GetCanonicalExecutionTransactionStructlogAggRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single canonical_execution_transaction_structlog_agg record
message GetCanonicalExecutionTransactionStructlogAggResponse {
  CanonicalExecutionTransactionStructlogAgg item = 1;
}

// Query canonical_execution_transaction_structlog_agg data
service CanonicalExecutionTransactionStructlogAggService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListCanonicalExecutionTransactionStructlogAggRequest) returns (ListCanonicalExecutionTransactionStructlogAggResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetCanonicalExecutionTransactionStructlogAggRequest) returns (GetCanonicalExecutionTransactionStructlogAggResponse);
}
