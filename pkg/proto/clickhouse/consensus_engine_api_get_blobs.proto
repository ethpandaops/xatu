  // How long the engine_getBlobs call took in milliseconds
  uint64 duration_ms = 14;
  // Slot number of the beacon block being reconstructed
  uint32 slot = 15;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 16;
  // Epoch number derived from the slot
  uint32 epoch = 17;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 18;
  // Root of the beacon block (hex encoded with 0x prefix)
  string block_root = 19;
  // Root of the parent beacon block (hex encoded with 0x prefix)
  string parent_block_root = 20;
  // Number of versioned hashes requested
  uint32 requested_count = 21;
  // List of versioned hashes requested (derived from KZG commitments)
  repeated string versioned_hashes = 22;
  // Number of non-null blobs returned
  uint32 returned_count = 23;
  // Result status (SUCCESS, PARTIAL, EMPTY, UNSUPPORTED, ERROR)
  string status = 24;
  // Error details if status is ERROR or UNSUPPORTED
  google.protobuf.StringValue error_message = 25;
  // Version of the engine_getBlobs method (e.g., V1, V2)
  string method_version = 26;
