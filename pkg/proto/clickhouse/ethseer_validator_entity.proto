syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains a mapping of validators to entities

message EthseerValidatorEntity {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // When the client fetched the beacon block from ethseer.io
  int64 event_date_time = 12;
  // The index of the validator
  uint32 index = 13;
  // The public key of the validator
  string pubkey = 14;
  // The entity of the validator
  string entity = 15;
  // Ethereum network name
  string meta_network_name = 16;
}

// Request for listing ethseer_validator_entity records
message ListEthseerValidatorEntityRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by index - The index of the validator (ORDER BY column 2 - optional)
  UInt32Filter index = 2;

  // Filter by pubkey - The public key of the validator (ORDER BY column 3 - optional)
  StringFilter pubkey = 3;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 4;
  // Filter by event_date_time - When the client fetched the beacon block from ethseer.io (optional)
  Int64Filter event_date_time = 5;
  // Filter by entity - The entity of the validator (optional)
  StringFilter entity = 6;

  // The maximum number of ethseer_validator_entity to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 7;
  // A page token, received from a previous `ListEthseerValidatorEntity` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 8;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 9;
}

// Response for listing ethseer_validator_entity records
message ListEthseerValidatorEntityResponse {
  // The list of ethseer_validator_entity.
  repeated EthseerValidatorEntity ethseer_validator_entity = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single ethseer_validator_entity record by primary key
message GetEthseerValidatorEntityRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single ethseer_validator_entity record
message GetEthseerValidatorEntityResponse {
  EthseerValidatorEntity item = 1;
}

// Query ethseer_validator_entity data
service EthseerValidatorEntityService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListEthseerValidatorEntityRequest) returns (ListEthseerValidatorEntityResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetEthseerValidatorEntityRequest) returns (GetEthseerValidatorEntityResponse);
}
