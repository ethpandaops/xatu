syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains detailed performance metrics from execution client structured logging for block execution

message ExecutionBlockMetrics {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // When the event was received
  int64 event_date_time = 12;
  // Data source (e.g., client-logs)
  string source = 13;
  // Execution block number
  uint64 block_number = 14;
  // Execution block hash (hex encoded with 0x prefix)
  string block_hash = 15;
  // Total gas used by all transactions in the block
  uint64 gas_used = 16;
  // Number of transactions in the block
  uint32 tx_count = 17;
  // Time spent executing transactions in milliseconds
  double execution_ms = 18;
  // Time spent reading state in milliseconds
  double state_read_ms = 19;
  // Time spent computing state hash in milliseconds
  double state_hash_ms = 20;
  // Time spent committing state changes in milliseconds
  double commit_ms = 21;
  // Total time for block processing in milliseconds
  double total_ms = 22;
  // Throughput in million gas per second
  double mgas_per_sec = 23;
  // Number of account reads
  uint64 state_reads_accounts = 24;
  // Number of storage slot reads
  uint64 state_reads_storage_slots = 25;
  // Number of code reads
  uint64 state_reads_code = 26;
  // Total bytes of code read
  uint64 state_reads_code_bytes = 27;
  // Number of account writes
  uint64 state_writes_accounts = 28;
  // Number of accounts deleted
  uint64 state_writes_accounts_deleted = 29;
  // Number of storage slot writes
  uint64 state_writes_storage_slots = 30;
  // Number of storage slots deleted
  uint64 state_writes_storage_slots_deleted = 31;
  // Number of code writes
  uint64 state_writes_code = 32;
  // Total bytes of code written
  uint64 state_writes_code_bytes = 33;
  // Number of account cache hits
  int64 account_cache_hits = 34;
  // Number of account cache misses
  int64 account_cache_misses = 35;
  // Account cache hit rate as percentage
  double account_cache_hit_rate = 36;
  // Number of storage cache hits
  int64 storage_cache_hits = 37;
  // Number of storage cache misses
  int64 storage_cache_misses = 38;
  // Storage cache hit rate as percentage
  double storage_cache_hit_rate = 39;
  // Number of code cache hits
  int64 code_cache_hits = 40;
  // Number of code cache misses
  int64 code_cache_misses = 41;
  // Code cache hit rate as percentage
  double code_cache_hit_rate = 42;
  // Total bytes of code cache hits
  int64 code_cache_hit_bytes = 43;
  // Total bytes of code cache misses
  int64 code_cache_miss_bytes = 44;
  // Name of the client that generated the event
  string meta_client_name = 45;
  // Version of the client that generated the event
  string meta_client_version = 46;
  // Implementation of the client that generated the event
  string meta_client_implementation = 47;
  // Operating system of the client that generated the event
  string meta_client_os = 48;
  // IP address of the client that generated the event
  google.protobuf.StringValue meta_client_ip = 49;
  // City of the client that generated the event
  string meta_client_geo_city = 50;
  // Country of the client that generated the event
  string meta_client_geo_country = 51;
  // Country code of the client that generated the event
  string meta_client_geo_country_code = 52;
  // Continent code of the client that generated the event
  string meta_client_geo_continent_code = 53;
  // Longitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_longitude = 54;
  // Latitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_latitude = 55;
  // Autonomous system number of the client that generated the event
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 56;
  // Autonomous system organization of the client that generated the event
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 57;
  // Ethereum network name
  string meta_network_name = 58;
}

// Request for listing execution_block_metrics records
message ListExecutionBlockMetricsRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by block_number - Execution block number (ORDER BY column 2 - optional)
  UInt64Filter block_number = 2;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 3 - optional)
  StringFilter meta_client_name = 3;

  // Filter by event_date_time - When the event was received (ORDER BY column 4 - optional)
  Int64Filter event_date_time = 4;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by source - Data source (e.g., client-logs) (optional)
  StringFilter source = 6;
  // Filter by block_hash - Execution block hash (hex encoded with 0x prefix) (optional)
  StringFilter block_hash = 7;
  // Filter by gas_used - Total gas used by all transactions in the block (optional)
  UInt64Filter gas_used = 8;
  // Filter by tx_count - Number of transactions in the block (optional)
  UInt32Filter tx_count = 9;
  // Filter by execution_ms - Time spent executing transactions in milliseconds (optional)
  google.protobuf.DoubleValue execution_ms = 10;
  // Filter by state_read_ms - Time spent reading state in milliseconds (optional)
  google.protobuf.DoubleValue state_read_ms = 11;
  // Filter by state_hash_ms - Time spent computing state hash in milliseconds (optional)
  google.protobuf.DoubleValue state_hash_ms = 12;
  // Filter by commit_ms - Time spent committing state changes in milliseconds (optional)
  google.protobuf.DoubleValue commit_ms = 13;
  // Filter by total_ms - Total time for block processing in milliseconds (optional)
  google.protobuf.DoubleValue total_ms = 14;
  // Filter by mgas_per_sec - Throughput in million gas per second (optional)
  google.protobuf.DoubleValue mgas_per_sec = 15;
  // Filter by state_reads_accounts - Number of account reads (optional)
  UInt64Filter state_reads_accounts = 16;
  // Filter by state_reads_storage_slots - Number of storage slot reads (optional)
  UInt64Filter state_reads_storage_slots = 17;
  // Filter by state_reads_code - Number of code reads (optional)
  UInt64Filter state_reads_code = 18;
  // Filter by state_reads_code_bytes - Total bytes of code read (optional)
  UInt64Filter state_reads_code_bytes = 19;
  // Filter by state_writes_accounts - Number of account writes (optional)
  UInt64Filter state_writes_accounts = 20;
  // Filter by state_writes_accounts_deleted - Number of accounts deleted (optional)
  UInt64Filter state_writes_accounts_deleted = 21;
  // Filter by state_writes_storage_slots - Number of storage slot writes (optional)
  UInt64Filter state_writes_storage_slots = 22;
  // Filter by state_writes_storage_slots_deleted - Number of storage slots deleted (optional)
  UInt64Filter state_writes_storage_slots_deleted = 23;
  // Filter by state_writes_code - Number of code writes (optional)
  UInt64Filter state_writes_code = 24;
  // Filter by state_writes_code_bytes - Total bytes of code written (optional)
  UInt64Filter state_writes_code_bytes = 25;
  // Filter by account_cache_hits - Number of account cache hits (optional)
  Int64Filter account_cache_hits = 26;
  // Filter by account_cache_misses - Number of account cache misses (optional)
  Int64Filter account_cache_misses = 27;
  // Filter by account_cache_hit_rate - Account cache hit rate as percentage (optional)
  google.protobuf.DoubleValue account_cache_hit_rate = 28;
  // Filter by storage_cache_hits - Number of storage cache hits (optional)
  Int64Filter storage_cache_hits = 29;
  // Filter by storage_cache_misses - Number of storage cache misses (optional)
  Int64Filter storage_cache_misses = 30;
  // Filter by storage_cache_hit_rate - Storage cache hit rate as percentage (optional)
  google.protobuf.DoubleValue storage_cache_hit_rate = 31;
  // Filter by code_cache_hits - Number of code cache hits (optional)
  Int64Filter code_cache_hits = 32;
  // Filter by code_cache_misses - Number of code cache misses (optional)
  Int64Filter code_cache_misses = 33;
  // Filter by code_cache_hit_rate - Code cache hit rate as percentage (optional)
  google.protobuf.DoubleValue code_cache_hit_rate = 34;
  // Filter by code_cache_hit_bytes - Total bytes of code cache hits (optional)
  Int64Filter code_cache_hit_bytes = 35;
  // Filter by code_cache_miss_bytes - Total bytes of code cache misses (optional)
  Int64Filter code_cache_miss_bytes = 36;
  // Filter by meta_client_version - Version of the client that generated the event (optional)
  StringFilter meta_client_version = 37;
  // Filter by meta_client_implementation - Implementation of the client that generated the event (optional)
  StringFilter meta_client_implementation = 38;
  // Filter by meta_client_os - Operating system of the client that generated the event (optional)
  StringFilter meta_client_os = 39;
  // Filter by meta_client_ip - IP address of the client that generated the event (optional)
  NullableStringFilter meta_client_ip = 40;
  // Filter by meta_client_geo_city - City of the client that generated the event (optional)
  StringFilter meta_client_geo_city = 41;
  // Filter by meta_client_geo_country - Country of the client that generated the event (optional)
  StringFilter meta_client_geo_country = 42;
  // Filter by meta_client_geo_country_code - Country code of the client that generated the event (optional)
  StringFilter meta_client_geo_country_code = 43;
  // Filter by meta_client_geo_continent_code - Continent code of the client that generated the event (optional)
  StringFilter meta_client_geo_continent_code = 44;
  // Filter by meta_client_geo_longitude - Longitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 45;
  // Filter by meta_client_geo_latitude - Latitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 46;
  // Filter by meta_client_geo_autonomous_system_number - Autonomous system number of the client that generated the event (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 47;
  // Filter by meta_client_geo_autonomous_system_organization - Autonomous system organization of the client that generated the event (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 48;

  // The maximum number of execution_block_metrics to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 49;
  // A page token, received from a previous `ListExecutionBlockMetrics` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 50;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 51;
}

// Response for listing execution_block_metrics records
message ListExecutionBlockMetricsResponse {
  // The list of execution_block_metrics.
  repeated ExecutionBlockMetrics execution_block_metrics = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single execution_block_metrics record by primary key
message GetExecutionBlockMetricsRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single execution_block_metrics record
message GetExecutionBlockMetricsResponse {
  ExecutionBlockMetrics item = 1;
}

// Query execution_block_metrics data
service ExecutionBlockMetricsService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListExecutionBlockMetricsRequest) returns (ListExecutionBlockMetricsResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetExecutionBlockMetricsRequest) returns (GetExecutionBlockMetricsResponse);
}
