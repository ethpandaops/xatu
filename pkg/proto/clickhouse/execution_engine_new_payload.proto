syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains timing and instrumentation data for engine_newPayload calls from the execution layer perspective.

message ExecutionEngineNewPayload {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // When the event was received
  int64 event_date_time = 12;
  // Timestamp when the engine_newPayload call was received
  int64 requested_date_time = 13;
  // How long the engine_newPayload call took in milliseconds
  uint64 duration_ms = 14;
  // Source of the event (SNOOPER, EXECUTION_CLIENT)
  string source = 15;
  // Execution block number
  uint64 block_number = 16;
  // Execution block hash (hex encoded with 0x prefix)
  string block_hash = 17;
  // Parent execution block hash (hex encoded with 0x prefix)
  string parent_hash = 18;
  // Total gas used by all transactions in the block
  uint64 gas_used = 19;
  // Gas limit of the block
  uint64 gas_limit = 20;
  // Number of transactions in the block
  uint32 tx_count = 21;
  // Number of blobs in the block
  uint32 blob_count = 22;
  // Payload status returned (VALID, INVALID, SYNCING, ACCEPTED, INVALID_BLOCK_HASH)
  string status = 23;
  // Latest valid hash when status is INVALID (hex encoded with 0x prefix)
  google.protobuf.StringValue latest_valid_hash = 24;
  // Error message when validation fails
  google.protobuf.StringValue validation_error = 25;
  // Version of the engine_newPayload method (e.g., V3, V4)
  string method_version = 26;
  // Implementation of the execution client (e.g., go-ethereum, reth, nethermind)
  string meta_execution_implementation = 27;
  // Version of the execution client
  string meta_execution_version = 28;
  // Major version number of the execution client
  string meta_execution_version_major = 29;
  // Minor version number of the execution client
  string meta_execution_version_minor = 30;
  // Patch version number of the execution client
  string meta_execution_version_patch = 31;
  // Name of the client that generated the event
  string meta_client_name = 32;
  // Version of the client that generated the event
  string meta_client_version = 33;
  // Implementation of the client that generated the event
  string meta_client_implementation = 34;
  // Operating system of the client that generated the event
  string meta_client_os = 35;
  // IP address of the client that generated the event
  google.protobuf.StringValue meta_client_ip = 36;
  // City of the client that generated the event
  string meta_client_geo_city = 37;
  // Country of the client that generated the event
  string meta_client_geo_country = 38;
  // Country code of the client that generated the event
  string meta_client_geo_country_code = 39;
  // Continent code of the client that generated the event
  string meta_client_geo_continent_code = 40;
  // Longitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_longitude = 41;
  // Latitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_latitude = 42;
  // Autonomous system number of the client that generated the event
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 43;
  // Autonomous system organization of the client that generated the event
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 44;
  // Ethereum network name
  string meta_network_name = 45;
}

// Request for listing execution_engine_new_payload records
message ListExecutionEngineNewPayloadRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by block_number - Execution block number (ORDER BY column 2 - optional)
  UInt64Filter block_number = 2;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 3 - optional)
  StringFilter meta_client_name = 3;

  // Filter by block_hash - Execution block hash (hex encoded with 0x prefix) (ORDER BY column 4 - optional)
  StringFilter block_hash = 4;

  // Filter by event_date_time - When the event was received (ORDER BY column 5 - optional)
  Int64Filter event_date_time = 5;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 6;
  // Filter by requested_date_time - Timestamp when the engine_newPayload call was received (optional)
  Int64Filter requested_date_time = 7;
  // Filter by duration_ms - How long the engine_newPayload call took in milliseconds (optional)
  UInt64Filter duration_ms = 8;
  // Filter by source - Source of the event (SNOOPER, EXECUTION_CLIENT) (optional)
  StringFilter source = 9;
  // Filter by parent_hash - Parent execution block hash (hex encoded with 0x prefix) (optional)
  StringFilter parent_hash = 10;
  // Filter by gas_used - Total gas used by all transactions in the block (optional)
  UInt64Filter gas_used = 11;
  // Filter by gas_limit - Gas limit of the block (optional)
  UInt64Filter gas_limit = 12;
  // Filter by tx_count - Number of transactions in the block (optional)
  UInt32Filter tx_count = 13;
  // Filter by blob_count - Number of blobs in the block (optional)
  UInt32Filter blob_count = 14;
  // Filter by status - Payload status returned (VALID, INVALID, SYNCING, ACCEPTED, INVALID_BLOCK_HASH) (optional)
  StringFilter status = 15;
  // Filter by latest_valid_hash - Latest valid hash when status is INVALID (hex encoded with 0x prefix) (optional)
  NullableStringFilter latest_valid_hash = 16;
  // Filter by validation_error - Error message when validation fails (optional)
  NullableStringFilter validation_error = 17;
  // Filter by method_version - Version of the engine_newPayload method (e.g., V3, V4) (optional)
  StringFilter method_version = 18;
  // Filter by meta_execution_implementation - Implementation of the execution client (e.g., go-ethereum, reth, nethermind) (optional)
  StringFilter meta_execution_implementation = 19;
  // Filter by meta_execution_version - Version of the execution client (optional)
  StringFilter meta_execution_version = 20;
  // Filter by meta_execution_version_major - Major version number of the execution client (optional)
  StringFilter meta_execution_version_major = 21;
  // Filter by meta_execution_version_minor - Minor version number of the execution client (optional)
  StringFilter meta_execution_version_minor = 22;
  // Filter by meta_execution_version_patch - Patch version number of the execution client (optional)
  StringFilter meta_execution_version_patch = 23;
  // Filter by meta_client_version - Version of the client that generated the event (optional)
  StringFilter meta_client_version = 24;
  // Filter by meta_client_implementation - Implementation of the client that generated the event (optional)
  StringFilter meta_client_implementation = 25;
  // Filter by meta_client_os - Operating system of the client that generated the event (optional)
  StringFilter meta_client_os = 26;
  // Filter by meta_client_ip - IP address of the client that generated the event (optional)
  NullableStringFilter meta_client_ip = 27;
  // Filter by meta_client_geo_city - City of the client that generated the event (optional)
  StringFilter meta_client_geo_city = 28;
  // Filter by meta_client_geo_country - Country of the client that generated the event (optional)
  StringFilter meta_client_geo_country = 29;
  // Filter by meta_client_geo_country_code - Country code of the client that generated the event (optional)
  StringFilter meta_client_geo_country_code = 30;
  // Filter by meta_client_geo_continent_code - Continent code of the client that generated the event (optional)
  StringFilter meta_client_geo_continent_code = 31;
  // Filter by meta_client_geo_longitude - Longitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 32;
  // Filter by meta_client_geo_latitude - Latitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 33;
  // Filter by meta_client_geo_autonomous_system_number - Autonomous system number of the client that generated the event (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 34;
  // Filter by meta_client_geo_autonomous_system_organization - Autonomous system organization of the client that generated the event (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 35;

  // The maximum number of execution_engine_new_payload to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 36;
  // A page token, received from a previous `ListExecutionEngineNewPayload` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 37;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 38;
}

// Response for listing execution_engine_new_payload records
message ListExecutionEngineNewPayloadResponse {
  // The list of execution_engine_new_payload.
  repeated ExecutionEngineNewPayload execution_engine_new_payload = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single execution_engine_new_payload record by primary key
message GetExecutionEngineNewPayloadRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single execution_engine_new_payload record
message GetExecutionEngineNewPayloadResponse {
  ExecutionEngineNewPayload item = 1;
}

// Query execution_engine_new_payload data
service ExecutionEngineNewPayloadService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListExecutionEngineNewPayloadRequest) returns (ListExecutionEngineNewPayloadResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetExecutionEngineNewPayloadRequest) returns (GetExecutionEngineNewPayloadResponse);
}
