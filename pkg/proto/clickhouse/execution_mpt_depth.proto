syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains execution layer Merkle Patricia Trie depth metrics including nodes written and nodes deleted at specific block heights.

message ExecutionMptDepth {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The block number
  uint64 block_number = 12;
  // State root hash of the execution layer at this block
  string state_root = 13;
  // State root hash of the execution layer at the parent block
  string parent_state_root = 14;
  // The total number of trie nodes written at all depths of account tries
  uint64 total_account_written_nodes = 15;
  // The total number of bytes written at all depths of account tries
  uint64 total_account_written_bytes = 16;
  // The total number of trie nodes deleted at all depths of account tries
  uint64 total_account_deleted_nodes = 17;
  // The total number of bytes deleted at all depths of account tries
  uint64 total_account_deleted_bytes = 18;
  // The total number of trie nodes written at all depths of storage tries
  uint64 total_storage_written_nodes = 19;
  // The total number of bytes written at all depths of storage tries
  uint64 total_storage_written_bytes = 20;
  // The total number of trie nodes deleted at all depths of storage tries
  uint64 total_storage_deleted_nodes = 21;
  // The total number of bytes deleted at all depths of storage tries
  uint64 total_storage_deleted_bytes = 22;
  // Map of depth to number of nodes written at that depth of account trie
  map<uint32, uint64> account_written_nodes = 23;
  // Map of depth to number of bytes written at that depth of account trie
  map<uint32, uint64> account_written_bytes = 24;
  // Map of depth to number of nodes deleted at that depth of account trie
  map<uint32, uint64> account_deleted_nodes = 25;
  // Map of depth to number of bytes deleted at that depth of account trie
  map<uint32, uint64> account_deleted_bytes = 26;
  // Map of depth to number of nodes written at that depth of storage tries
  map<uint32, uint64> storage_written_nodes = 27;
  // Map of depth to number of bytes written at that depth of storage tries
  map<uint32, uint64> storage_written_bytes = 28;
  // Map of depth to number of nodes deleted at that depth of storage tries
  map<uint32, uint64> storage_deleted_nodes = 29;
  // Map of depth to number of bytes deleted at that depth of storage tries
  map<uint32, uint64> storage_deleted_bytes = 30;
  // Name of the client that generated the event
  string meta_client_name = 31;
  // Unique Session ID of the client that generated the event. This changes every time the client is restarted.
  string meta_client_id = 32;
  // Version of the client that generated the event
  string meta_client_version = 33;
  // Implementation of the client that generated the event
  string meta_client_implementation = 34;
  // Operating system of the client that generated the event
  string meta_client_os = 35;
  // IP address of the client that generated the event
  google.protobuf.StringValue meta_client_ip = 36;
  // City of the client that generated the event
  string meta_client_geo_city = 37;
  // Country of the client that generated the event
  string meta_client_geo_country = 38;
  // Country code of the client that generated the event
  string meta_client_geo_country_code = 39;
  // Continent code of the client that generated the event
  string meta_client_geo_continent_code = 40;
  // Longitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_longitude = 41;
  // Latitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_latitude = 42;
  // Autonomous system number of the client that generated the event
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 43;
  // Autonomous system organization of the client that generated the event
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 44;
  // Ethereum network ID
  int32 meta_network_id = 45;
  // Ethereum network name
  string meta_network_name = 46;
  // Execution client version that generated the event
  string meta_execution_version = 47;
  // Execution client major version that generated the event
  string meta_execution_version_major = 48;
  // Execution client minor version that generated the event
  string meta_execution_version_minor = 49;
  // Execution client patch version that generated the event
  string meta_execution_version_patch = 50;
  // Execution client implementation that generated the event
  string meta_execution_implementation = 51;
  // Labels associated with the event
  map<string, string> meta_labels = 52;
}

// Request for listing execution_mpt_depth records
message ListExecutionMptDepthRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by block_number - The block number (ORDER BY column 2 - optional)
  UInt64Filter block_number = 2;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 3 - optional)
  StringFilter meta_client_name = 3;

  // Filter by state_root - State root hash of the execution layer at this block (ORDER BY column 4 - optional)
  StringFilter state_root = 4;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by parent_state_root - State root hash of the execution layer at the parent block (optional)
  StringFilter parent_state_root = 6;
  // Filter by total_account_written_nodes - The total number of trie nodes written at all depths of account tries (optional)
  UInt64Filter total_account_written_nodes = 7;
  // Filter by total_account_written_bytes - The total number of bytes written at all depths of account tries (optional)
  UInt64Filter total_account_written_bytes = 8;
  // Filter by total_account_deleted_nodes - The total number of trie nodes deleted at all depths of account tries (optional)
  UInt64Filter total_account_deleted_nodes = 9;
  // Filter by total_account_deleted_bytes - The total number of bytes deleted at all depths of account tries (optional)
  UInt64Filter total_account_deleted_bytes = 10;
  // Filter by total_storage_written_nodes - The total number of trie nodes written at all depths of storage tries (optional)
  UInt64Filter total_storage_written_nodes = 11;
  // Filter by total_storage_written_bytes - The total number of bytes written at all depths of storage tries (optional)
  UInt64Filter total_storage_written_bytes = 12;
  // Filter by total_storage_deleted_nodes - The total number of trie nodes deleted at all depths of storage tries (optional)
  UInt64Filter total_storage_deleted_nodes = 13;
  // Filter by total_storage_deleted_bytes - The total number of bytes deleted at all depths of storage tries (optional)
  UInt64Filter total_storage_deleted_bytes = 14;
  // Filter by account_written_nodes - Map of depth to number of nodes written at that depth of account trie (optional)
  map<uint32, uint64> account_written_nodes = 15;
  // Filter by account_written_bytes - Map of depth to number of bytes written at that depth of account trie (optional)
  map<uint32, uint64> account_written_bytes = 16;
  // Filter by account_deleted_nodes - Map of depth to number of nodes deleted at that depth of account trie (optional)
  map<uint32, uint64> account_deleted_nodes = 17;
  // Filter by account_deleted_bytes - Map of depth to number of bytes deleted at that depth of account trie (optional)
  map<uint32, uint64> account_deleted_bytes = 18;
  // Filter by storage_written_nodes - Map of depth to number of nodes written at that depth of storage tries (optional)
  map<uint32, uint64> storage_written_nodes = 19;
  // Filter by storage_written_bytes - Map of depth to number of bytes written at that depth of storage tries (optional)
  map<uint32, uint64> storage_written_bytes = 20;
  // Filter by storage_deleted_nodes - Map of depth to number of nodes deleted at that depth of storage tries (optional)
  map<uint32, uint64> storage_deleted_nodes = 21;
  // Filter by storage_deleted_bytes - Map of depth to number of bytes deleted at that depth of storage tries (optional)
  map<uint32, uint64> storage_deleted_bytes = 22;
  // Filter by meta_client_id - Unique Session ID of the client that generated the event. This changes every time the client is restarted. (optional)
  StringFilter meta_client_id = 23;
  // Filter by meta_client_version - Version of the client that generated the event (optional)
  StringFilter meta_client_version = 24;
  // Filter by meta_client_implementation - Implementation of the client that generated the event (optional)
  StringFilter meta_client_implementation = 25;
  // Filter by meta_client_os - Operating system of the client that generated the event (optional)
  StringFilter meta_client_os = 26;
  // Filter by meta_client_ip - IP address of the client that generated the event (optional)
  NullableStringFilter meta_client_ip = 27;
  // Filter by meta_client_geo_city - City of the client that generated the event (optional)
  StringFilter meta_client_geo_city = 28;
  // Filter by meta_client_geo_country - Country of the client that generated the event (optional)
  StringFilter meta_client_geo_country = 29;
  // Filter by meta_client_geo_country_code - Country code of the client that generated the event (optional)
  StringFilter meta_client_geo_country_code = 30;
  // Filter by meta_client_geo_continent_code - Continent code of the client that generated the event (optional)
  StringFilter meta_client_geo_continent_code = 31;
  // Filter by meta_client_geo_longitude - Longitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 32;
  // Filter by meta_client_geo_latitude - Latitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 33;
  // Filter by meta_client_geo_autonomous_system_number - Autonomous system number of the client that generated the event (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 34;
  // Filter by meta_client_geo_autonomous_system_organization - Autonomous system organization of the client that generated the event (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 35;
  // Filter by meta_network_id - Ethereum network ID (optional)
  Int32Filter meta_network_id = 36;
  // Filter by meta_execution_version - Execution client version that generated the event (optional)
  StringFilter meta_execution_version = 37;
  // Filter by meta_execution_version_major - Execution client major version that generated the event (optional)
  StringFilter meta_execution_version_major = 38;
  // Filter by meta_execution_version_minor - Execution client minor version that generated the event (optional)
  StringFilter meta_execution_version_minor = 39;
  // Filter by meta_execution_version_patch - Execution client patch version that generated the event (optional)
  StringFilter meta_execution_version_patch = 40;
  // Filter by meta_execution_implementation - Execution client implementation that generated the event (optional)
  StringFilter meta_execution_implementation = 41;
  // Filter by meta_labels - Labels associated with the event (optional)
  MapStringStringFilter meta_labels = 42;

  // The maximum number of execution_mpt_depth to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 43;
  // A page token, received from a previous `ListExecutionMptDepth` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 44;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 45;
}

// Response for listing execution_mpt_depth records
message ListExecutionMptDepthResponse {
  // The list of execution_mpt_depth.
  repeated ExecutionMptDepth execution_mpt_depth = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single execution_mpt_depth record by primary key
message GetExecutionMptDepthRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single execution_mpt_depth record
message GetExecutionMptDepthResponse {
  ExecutionMptDepth item = 1;
}

// Query execution_mpt_depth data
service ExecutionMptDepthService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListExecutionMptDepthRequest) returns (ListExecutionMptDepthResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetExecutionMptDepthRequest) returns (GetExecutionMptDepthResponse);
}
