syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains execution layer state size write/delete metrics (count and bytes for accounts, storage, contract code, and account/storage trie nodes) at specific block heights. Net deltas are MATERIALIZED columns derived as writes - deletes.

message ExecutionStateSizeDelta {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // The block number
  uint64 block_number = 12;
  // State root hash of the execution layer at this block
  string state_root = 13;
  // State root hash of the execution layer at the parent block
  string parent_state_root = 14;
  // Accounts written at this block (creations + updates)
  uint64 account_writes = 15;
  // Bytes of account data written at this block
  uint64 account_write_bytes = 16;
  // Account trie nodes written at this block
  uint64 account_trienode_writes = 17;
  // Bytes of account trie node data written at this block
  uint64 account_trienode_write_bytes = 18;
  // New unique contract code blobs added at this block (deduped by hash)
  uint64 contract_code_writes = 19;
  // Bytes of new contract code added at this block
  uint64 contract_code_write_bytes = 20;
  // Storage slots written at this block (creations + updates)
  uint64 storage_writes = 21;
  // Bytes of storage slot data written at this block
  uint64 storage_write_bytes = 22;
  // Storage trie nodes written at this block
  uint64 storage_trienode_writes = 23;
  // Bytes of storage trie node data written at this block
  uint64 storage_trienode_write_bytes = 24;
  // Accounts deleted at this block (deletions + updates)
  uint64 account_deletes = 25;
  // Bytes of account data deleted at this block
  uint64 account_delete_bytes = 26;
  // Account trie nodes deleted at this block
  uint64 account_trienode_deletes = 27;
  // Bytes of account trie node data deleted at this block
  uint64 account_trienode_delete_bytes = 28;
  // Always 0 - reserved for future ref-counted code blob tracking
  uint64 contract_code_deletes = 29;
  // Always 0 - reserved for future ref-counted code blob tracking
  uint64 contract_code_delete_bytes = 30;
  // Storage slots deleted at this block (deletions + updates)
  uint64 storage_deletes = 31;
  // Bytes of storage slot data deleted at this block
  uint64 storage_delete_bytes = 32;
  // Storage trie nodes deleted at this block
  uint64 storage_trienode_deletes = 33;
  // Bytes of storage trie node data deleted at this block
  uint64 storage_trienode_delete_bytes = 34;
  // Net change in accounts (writes - deletes)
  int64 account_delta = 35;
  // Net change in account bytes
  int64 account_bytes_delta = 36;
  // Net change in account trie nodes
  int64 account_trienode_delta = 37;
  // Net change in account trie node bytes
  int64 account_trienode_bytes_delta = 38;
  // Net change in contract codes (equals contract_code_writes while deletes are untracked)
  int64 contract_code_delta = 39;
  // Net change in contract code bytes
  int64 contract_code_bytes_delta = 40;
  // Net change in storage slots
  int64 storage_delta = 41;
  // Net change in storage slot bytes
  int64 storage_bytes_delta = 42;
  // Net change in storage trie nodes
  int64 storage_trienode_delta = 43;
  // Net change in storage trie node bytes
  int64 storage_trienode_bytes_delta = 44;
  // Name of the client that generated the event
  string meta_client_name = 45;
  // Unique Session ID of the client that generated the event. This changes every time the client is restarted.
  string meta_client_id = 46;
  // Version of the client that generated the event
  string meta_client_version = 47;
  // Implementation of the client that generated the event
  string meta_client_implementation = 48;
  // Operating system of the client that generated the event
  string meta_client_os = 49;
  // IP address of the client that generated the event
  google.protobuf.StringValue meta_client_ip = 50;
  // City of the client that generated the event
  string meta_client_geo_city = 51;
  // Country of the client that generated the event
  string meta_client_geo_country = 52;
  // Country code of the client that generated the event
  string meta_client_geo_country_code = 53;
  // Continent code of the client that generated the event
  string meta_client_geo_continent_code = 54;
  // Longitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_longitude = 55;
  // Latitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_latitude = 56;
  // Autonomous system number of the client that generated the event
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 57;
  // Autonomous system organization of the client that generated the event
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 58;
  // Ethereum network ID
  int32 meta_network_id = 59;
  // Ethereum network name
  string meta_network_name = 60;
  // Execution client version that generated the event
  string meta_execution_version = 61;
  // Execution client major version that generated the event
  string meta_execution_version_major = 62;
  // Execution client minor version that generated the event
  string meta_execution_version_minor = 63;
  // Execution client patch version that generated the event
  string meta_execution_version_patch = 64;
  // Execution client implementation that generated the event
  string meta_execution_implementation = 65;
  // Labels associated with the event
  map<string, string> meta_labels = 66;
}

// Request for listing execution_state_size_delta records
message ListExecutionStateSizeDeltaRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by block_number - The block number (ORDER BY column 2 - optional)
  UInt64Filter block_number = 2;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 3 - optional)
  StringFilter meta_client_name = 3;

  // Filter by state_root - State root hash of the execution layer at this block (ORDER BY column 4 - optional)
  StringFilter state_root = 4;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by parent_state_root - State root hash of the execution layer at the parent block (optional)
  StringFilter parent_state_root = 6;
  // Filter by account_writes - Accounts written at this block (creations + updates) (optional)
  UInt64Filter account_writes = 7;
  // Filter by account_write_bytes - Bytes of account data written at this block (optional)
  UInt64Filter account_write_bytes = 8;
  // Filter by account_trienode_writes - Account trie nodes written at this block (optional)
  UInt64Filter account_trienode_writes = 9;
  // Filter by account_trienode_write_bytes - Bytes of account trie node data written at this block (optional)
  UInt64Filter account_trienode_write_bytes = 10;
  // Filter by contract_code_writes - New unique contract code blobs added at this block (deduped by hash) (optional)
  UInt64Filter contract_code_writes = 11;
  // Filter by contract_code_write_bytes - Bytes of new contract code added at this block (optional)
  UInt64Filter contract_code_write_bytes = 12;
  // Filter by storage_writes - Storage slots written at this block (creations + updates) (optional)
  UInt64Filter storage_writes = 13;
  // Filter by storage_write_bytes - Bytes of storage slot data written at this block (optional)
  UInt64Filter storage_write_bytes = 14;
  // Filter by storage_trienode_writes - Storage trie nodes written at this block (optional)
  UInt64Filter storage_trienode_writes = 15;
  // Filter by storage_trienode_write_bytes - Bytes of storage trie node data written at this block (optional)
  UInt64Filter storage_trienode_write_bytes = 16;
  // Filter by account_deletes - Accounts deleted at this block (deletions + updates) (optional)
  UInt64Filter account_deletes = 17;
  // Filter by account_delete_bytes - Bytes of account data deleted at this block (optional)
  UInt64Filter account_delete_bytes = 18;
  // Filter by account_trienode_deletes - Account trie nodes deleted at this block (optional)
  UInt64Filter account_trienode_deletes = 19;
  // Filter by account_trienode_delete_bytes - Bytes of account trie node data deleted at this block (optional)
  UInt64Filter account_trienode_delete_bytes = 20;
  // Filter by contract_code_deletes - Always 0 - reserved for future ref-counted code blob tracking (optional)
  UInt64Filter contract_code_deletes = 21;
  // Filter by contract_code_delete_bytes - Always 0 - reserved for future ref-counted code blob tracking (optional)
  UInt64Filter contract_code_delete_bytes = 22;
  // Filter by storage_deletes - Storage slots deleted at this block (deletions + updates) (optional)
  UInt64Filter storage_deletes = 23;
  // Filter by storage_delete_bytes - Bytes of storage slot data deleted at this block (optional)
  UInt64Filter storage_delete_bytes = 24;
  // Filter by storage_trienode_deletes - Storage trie nodes deleted at this block (optional)
  UInt64Filter storage_trienode_deletes = 25;
  // Filter by storage_trienode_delete_bytes - Bytes of storage trie node data deleted at this block (optional)
  UInt64Filter storage_trienode_delete_bytes = 26;
  // Filter by account_delta - Net change in accounts (writes - deletes) (optional)
  Int64Filter account_delta = 27;
  // Filter by account_bytes_delta - Net change in account bytes (optional)
  Int64Filter account_bytes_delta = 28;
  // Filter by account_trienode_delta - Net change in account trie nodes (optional)
  Int64Filter account_trienode_delta = 29;
  // Filter by account_trienode_bytes_delta - Net change in account trie node bytes (optional)
  Int64Filter account_trienode_bytes_delta = 30;
  // Filter by contract_code_delta - Net change in contract codes (equals contract_code_writes while deletes are untracked) (optional)
  Int64Filter contract_code_delta = 31;
  // Filter by contract_code_bytes_delta - Net change in contract code bytes (optional)
  Int64Filter contract_code_bytes_delta = 32;
  // Filter by storage_delta - Net change in storage slots (optional)
  Int64Filter storage_delta = 33;
  // Filter by storage_bytes_delta - Net change in storage slot bytes (optional)
  Int64Filter storage_bytes_delta = 34;
  // Filter by storage_trienode_delta - Net change in storage trie nodes (optional)
  Int64Filter storage_trienode_delta = 35;
  // Filter by storage_trienode_bytes_delta - Net change in storage trie node bytes (optional)
  Int64Filter storage_trienode_bytes_delta = 36;
  // Filter by meta_client_id - Unique Session ID of the client that generated the event. This changes every time the client is restarted. (optional)
  StringFilter meta_client_id = 37;
  // Filter by meta_client_version - Version of the client that generated the event (optional)
  StringFilter meta_client_version = 38;
  // Filter by meta_client_implementation - Implementation of the client that generated the event (optional)
  StringFilter meta_client_implementation = 39;
  // Filter by meta_client_os - Operating system of the client that generated the event (optional)
  StringFilter meta_client_os = 40;
  // Filter by meta_client_ip - IP address of the client that generated the event (optional)
  NullableStringFilter meta_client_ip = 41;
  // Filter by meta_client_geo_city - City of the client that generated the event (optional)
  StringFilter meta_client_geo_city = 42;
  // Filter by meta_client_geo_country - Country of the client that generated the event (optional)
  StringFilter meta_client_geo_country = 43;
  // Filter by meta_client_geo_country_code - Country code of the client that generated the event (optional)
  StringFilter meta_client_geo_country_code = 44;
  // Filter by meta_client_geo_continent_code - Continent code of the client that generated the event (optional)
  StringFilter meta_client_geo_continent_code = 45;
  // Filter by meta_client_geo_longitude - Longitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 46;
  // Filter by meta_client_geo_latitude - Latitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 47;
  // Filter by meta_client_geo_autonomous_system_number - Autonomous system number of the client that generated the event (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 48;
  // Filter by meta_client_geo_autonomous_system_organization - Autonomous system organization of the client that generated the event (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 49;
  // Filter by meta_network_id - Ethereum network ID (optional)
  Int32Filter meta_network_id = 50;
  // Filter by meta_execution_version - Execution client version that generated the event (optional)
  StringFilter meta_execution_version = 51;
  // Filter by meta_execution_version_major - Execution client major version that generated the event (optional)
  StringFilter meta_execution_version_major = 52;
  // Filter by meta_execution_version_minor - Execution client minor version that generated the event (optional)
  StringFilter meta_execution_version_minor = 53;
  // Filter by meta_execution_version_patch - Execution client patch version that generated the event (optional)
  StringFilter meta_execution_version_patch = 54;
  // Filter by meta_execution_implementation - Execution client implementation that generated the event (optional)
  StringFilter meta_execution_implementation = 55;
  // Filter by meta_labels - Labels associated with the event (optional)
  MapStringStringFilter meta_labels = 56;

  // The maximum number of execution_state_size_delta to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 57;
  // A page token, received from a previous `ListExecutionStateSizeDelta` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 58;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 59;
}

// Response for listing execution_state_size_delta records
message ListExecutionStateSizeDeltaResponse {
  // The list of execution_state_size_delta.
  repeated ExecutionStateSizeDelta execution_state_size_delta = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single execution_state_size_delta record by primary key
message GetExecutionStateSizeDeltaRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single execution_state_size_delta record
message GetExecutionStateSizeDeltaResponse {
  ExecutionStateSizeDelta item = 1;
}

// Query execution_state_size_delta data
service ExecutionStateSizeDeltaService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListExecutionStateSizeDeltaRequest) returns (ListExecutionStateSizeDeltaResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetExecutionStateSizeDeltaRequest) returns (GetExecutionStateSizeDeltaResponse);
}
