syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains the details of the CONNECTED events from the libp2p client.

message Libp2pConnected {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Timestamp of the event
  int64 event_date_time = 12;
  // Unique key associated with the identifier of the remote peer
  int64 remote_peer_id_unique_key = 13;
  // Protocol of the remote peer
  string remote_protocol = 14;
  // Transport protocol of the remote peer
  string remote_transport_protocol = 15;
  // Port of the remote peer
  google.protobuf.UInt32Value remote_port = 16;
  // IP address of the remote peer that generated the event
  google.protobuf.StringValue remote_ip = 17;
  // City of the remote peer that generated the event
  string remote_geo_city = 18;
  // Country of the remote peer that generated the event
  string remote_geo_country = 19;
  // Country code of the remote peer that generated the event
  string remote_geo_country_code = 20;
  // Continent code of the remote peer that generated the event
  string remote_geo_continent_code = 21;
  // Longitude of the remote peer that generated the event
  google.protobuf.DoubleValue remote_geo_longitude = 22;
  // Latitude of the remote peer that generated the event
  google.protobuf.DoubleValue remote_geo_latitude = 23;
  // Autonomous system number of the remote peer that generated the event
  google.protobuf.UInt32Value remote_geo_autonomous_system_number = 24;
  // Autonomous system organization of the remote peer that generated the event
  google.protobuf.StringValue remote_geo_autonomous_system_organization = 25;
  // Implementation of the remote peer
  string remote_agent_implementation = 26;
  // Version of the remote peer
  string remote_agent_version = 27;
  // Major version of the remote peer
  string remote_agent_version_major = 28;
  // Minor version of the remote peer
  string remote_agent_version_minor = 29;
  // Patch version of the remote peer
  string remote_agent_version_patch = 30;
  // Platform of the remote peer
  string remote_agent_platform = 31;
  // Connection direction
  string direction = 32;
  // Timestamp when the connection was opened
  uint32 opened = 33;
  // Whether the connection is transient
  bool transient = 34;
  // Name of the client that generated the event
  string meta_client_name = 35;
  // Version of the client that generated the event
  string meta_client_version = 36;
  // Implementation of the client that generated the event
  string meta_client_implementation = 37;
  // Operating system of the client that generated the event
  string meta_client_os = 38;
  // IP address of the client that generated the event
  google.protobuf.StringValue meta_client_ip = 39;
  // City of the client that generated the event
  string meta_client_geo_city = 40;
  // Country of the client that generated the event
  string meta_client_geo_country = 41;
  // Country code of the client that generated the event
  string meta_client_geo_country_code = 42;
  // Continent code of the client that generated the event
  string meta_client_geo_continent_code = 43;
  // Longitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_longitude = 44;
  // Latitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_latitude = 45;
  // Autonomous system number of the client that generated the event
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 46;
  // Autonomous system organization of the client that generated the event
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 47;
  // Ethereum network name
  string meta_network_name = 48;
}

// Request for listing libp2p_connected records
message ListLibp2pConnectedRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by event_date_time - Timestamp of the event (ORDER BY column 2 - optional)
  Int64Filter event_date_time = 2;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 3 - optional)
  StringFilter meta_client_name = 3;

  // Filter by remote_peer_id_unique_key - Unique key associated with the identifier of the remote peer (ORDER BY column 4 - optional)
  Int64Filter remote_peer_id_unique_key = 4;

  // Filter by direction - Connection direction (ORDER BY column 5 - optional)
  StringFilter direction = 5;

  // Filter by opened - Timestamp when the connection was opened (ORDER BY column 6 - optional)
  UInt32Filter opened = 6;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 7;
  // Filter by remote_protocol - Protocol of the remote peer (optional)
  StringFilter remote_protocol = 8;
  // Filter by remote_transport_protocol - Transport protocol of the remote peer (optional)
  StringFilter remote_transport_protocol = 9;
  // Filter by remote_port - Port of the remote peer (optional)
  NullableUInt32Filter remote_port = 10;
  // Filter by remote_ip - IP address of the remote peer that generated the event (optional)
  NullableStringFilter remote_ip = 11;
  // Filter by remote_geo_city - City of the remote peer that generated the event (optional)
  StringFilter remote_geo_city = 12;
  // Filter by remote_geo_country - Country of the remote peer that generated the event (optional)
  StringFilter remote_geo_country = 13;
  // Filter by remote_geo_country_code - Country code of the remote peer that generated the event (optional)
  StringFilter remote_geo_country_code = 14;
  // Filter by remote_geo_continent_code - Continent code of the remote peer that generated the event (optional)
  StringFilter remote_geo_continent_code = 15;
  // Filter by remote_geo_longitude - Longitude of the remote peer that generated the event (optional)
  google.protobuf.DoubleValue remote_geo_longitude = 16;
  // Filter by remote_geo_latitude - Latitude of the remote peer that generated the event (optional)
  google.protobuf.DoubleValue remote_geo_latitude = 17;
  // Filter by remote_geo_autonomous_system_number - Autonomous system number of the remote peer that generated the event (optional)
  NullableUInt32Filter remote_geo_autonomous_system_number = 18;
  // Filter by remote_geo_autonomous_system_organization - Autonomous system organization of the remote peer that generated the event (optional)
  NullableStringFilter remote_geo_autonomous_system_organization = 19;
  // Filter by remote_agent_implementation - Implementation of the remote peer (optional)
  StringFilter remote_agent_implementation = 20;
  // Filter by remote_agent_version - Version of the remote peer (optional)
  StringFilter remote_agent_version = 21;
  // Filter by remote_agent_version_major - Major version of the remote peer (optional)
  StringFilter remote_agent_version_major = 22;
  // Filter by remote_agent_version_minor - Minor version of the remote peer (optional)
  StringFilter remote_agent_version_minor = 23;
  // Filter by remote_agent_version_patch - Patch version of the remote peer (optional)
  StringFilter remote_agent_version_patch = 24;
  // Filter by remote_agent_platform - Platform of the remote peer (optional)
  StringFilter remote_agent_platform = 25;
  // Filter by transient - Whether the connection is transient (optional)
  BoolFilter transient = 26;
  // Filter by meta_client_version - Version of the client that generated the event (optional)
  StringFilter meta_client_version = 27;
  // Filter by meta_client_implementation - Implementation of the client that generated the event (optional)
  StringFilter meta_client_implementation = 28;
  // Filter by meta_client_os - Operating system of the client that generated the event (optional)
  StringFilter meta_client_os = 29;
  // Filter by meta_client_ip - IP address of the client that generated the event (optional)
  NullableStringFilter meta_client_ip = 30;
  // Filter by meta_client_geo_city - City of the client that generated the event (optional)
  StringFilter meta_client_geo_city = 31;
  // Filter by meta_client_geo_country - Country of the client that generated the event (optional)
  StringFilter meta_client_geo_country = 32;
  // Filter by meta_client_geo_country_code - Country code of the client that generated the event (optional)
  StringFilter meta_client_geo_country_code = 33;
  // Filter by meta_client_geo_continent_code - Continent code of the client that generated the event (optional)
  StringFilter meta_client_geo_continent_code = 34;
  // Filter by meta_client_geo_longitude - Longitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 35;
  // Filter by meta_client_geo_latitude - Latitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 36;
  // Filter by meta_client_geo_autonomous_system_number - Autonomous system number of the client that generated the event (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 37;
  // Filter by meta_client_geo_autonomous_system_organization - Autonomous system organization of the client that generated the event (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 38;

  // The maximum number of libp2p_connected to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 39;
  // A page token, received from a previous `ListLibp2pConnected` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 40;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 41;
}

// Response for listing libp2p_connected records
message ListLibp2pConnectedResponse {
  // The list of libp2p_connected.
  repeated Libp2pConnected libp2p_connected = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single libp2p_connected record by primary key
message GetLibp2pConnectedRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single libp2p_connected record
message GetLibp2pConnectedResponse {
  Libp2pConnected item = 1;
}

// Query libp2p_connected data
service Libp2pConnectedService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListLibp2pConnectedRequest) returns (ListLibp2pConnectedResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetLibp2pConnectedRequest) returns (GetLibp2pConnectedResponse);
}
