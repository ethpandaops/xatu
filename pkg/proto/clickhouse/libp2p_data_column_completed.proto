syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains custody data column completions, one row per node per column whatever the path that completed it

message Libp2pDataColumnCompleted {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Timestamp of the event with millisecond precision
  int64 event_date_time = 12;
  // Slot of the block the column belongs to. 0 when the capture point could not resolve it
  uint32 slot = 13;
  // Start date and time of the slot. Unix epoch when the slot is unknown
  uint32 slot_start_date_time = 14;
  // Epoch of the block the column belongs to. 0 when the slot is unknown
  uint32 epoch = 15;
  // Start date and time of the epoch. Unix epoch when the slot is unknown
  uint32 epoch_start_date_time = 16;
  // Slot number of the wall clock when the column completed
  uint32 wallclock_slot = 17;
  // Start date and time of the wall clock slot when the column completed
  uint32 wallclock_slot_start_date_time = 18;
  // Epoch number of the wall clock when the column completed
  uint32 wallclock_epoch = 19;
  // Start date and time of the wall clock epoch when the column completed
  uint32 wallclock_epoch_start_date_time = 20;
  // Milliseconds between the slot start and the completion. 0 when the slot is unknown
  uint32 propagation_slot_start_diff = 21;
  // Unique key of the peer whose message completed the column. 0 when no peer did
  int64 peer_id_unique_key = 22;
  // Root of the beacon block the column belongs to
  string beacon_block_root = 23;
  // Data column index
  uint64 column_index = 24;
  // Path that completed the column: FULL_GOSSIP, PARTIAL_GOSSIP, EL, RECONSTRUCTION or UNKNOWN
  string completed_via = 25;
  // Number of cells in the completed column
  uint32 cells_total = 26;
  // Number of cells received over gossip
  uint32 cells_from_gossip = 27;
  // Number of cells built from blobs returned by the execution layer
  uint32 cells_from_el = 28;
  // Number of distinct peers that contributed cells
  uint32 contributing_peers = 29;
  // Number of KZG commitments of the block
  uint32 kzg_commitments_count = 30;
  // Layer of the topic in the gossipsub protocol
  string topic_layer = 31;
  // Fork digest value of the topic
  string topic_fork_digest_value = 32;
  // Name of the topic
  string topic_name = 33;
  // Encoding used for the topic
  string topic_encoding = 34;
  // Name of the client that generated the event
  string meta_client_name = 35;
  // Version of the client that generated the event
  string meta_client_version = 36;
  // Implementation of the client that generated the event
  string meta_client_implementation = 37;
  // Operating system of the client that generated the event
  string meta_client_os = 38;
  // IP address of the client that generated the event
  google.protobuf.StringValue meta_client_ip = 39;
  // City of the client that generated the event
  string meta_client_geo_city = 40;
  // Country of the client that generated the event
  string meta_client_geo_country = 41;
  // Country code of the client that generated the event
  string meta_client_geo_country_code = 42;
  // Continent code of the client that generated the event
  string meta_client_geo_continent_code = 43;
  // Longitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_longitude = 44;
  // Latitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_latitude = 45;
  // Autonomous system number of the client that generated the event
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 46;
  // Autonomous system organization of the client that generated the event
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 47;
  // Name of the network associated with the client
  string meta_network_name = 48;
}

// Request for listing libp2p_data_column_completed records
message ListLibp2pDataColumnCompletedRequest {
  // Filter by meta_network_name - Name of the network associated with the client (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - Start date and time of the slot. Unix epoch when the slot is unknown (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 3 - optional)
  StringFilter meta_client_name = 3;

  // Filter by beacon_block_root - Root of the beacon block the column belongs to (ORDER BY column 4 - optional)
  StringFilter beacon_block_root = 4;

  // Filter by column_index - Data column index (ORDER BY column 5 - optional)
  UInt64Filter column_index = 5;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 6;
  // Filter by event_date_time - Timestamp of the event with millisecond precision (optional)
  Int64Filter event_date_time = 7;
  // Filter by slot - Slot of the block the column belongs to. 0 when the capture point could not resolve it (optional)
  UInt32Filter slot = 8;
  // Filter by epoch - Epoch of the block the column belongs to. 0 when the slot is unknown (optional)
  UInt32Filter epoch = 9;
  // Filter by epoch_start_date_time - Start date and time of the epoch. Unix epoch when the slot is unknown (optional)
  UInt32Filter epoch_start_date_time = 10;
  // Filter by wallclock_slot - Slot number of the wall clock when the column completed (optional)
  UInt32Filter wallclock_slot = 11;
  // Filter by wallclock_slot_start_date_time - Start date and time of the wall clock slot when the column completed (optional)
  UInt32Filter wallclock_slot_start_date_time = 12;
  // Filter by wallclock_epoch - Epoch number of the wall clock when the column completed (optional)
  UInt32Filter wallclock_epoch = 13;
  // Filter by wallclock_epoch_start_date_time - Start date and time of the wall clock epoch when the column completed (optional)
  UInt32Filter wallclock_epoch_start_date_time = 14;
  // Filter by propagation_slot_start_diff - Milliseconds between the slot start and the completion. 0 when the slot is unknown (optional)
  UInt32Filter propagation_slot_start_diff = 15;
  // Filter by peer_id_unique_key - Unique key of the peer whose message completed the column. 0 when no peer did (optional)
  Int64Filter peer_id_unique_key = 16;
  // Filter by completed_via - Path that completed the column: FULL_GOSSIP, PARTIAL_GOSSIP, EL, RECONSTRUCTION or UNKNOWN (optional)
  StringFilter completed_via = 17;
  // Filter by cells_total - Number of cells in the completed column (optional)
  UInt32Filter cells_total = 18;
  // Filter by cells_from_gossip - Number of cells received over gossip (optional)
  UInt32Filter cells_from_gossip = 19;
  // Filter by cells_from_el - Number of cells built from blobs returned by the execution layer (optional)
  UInt32Filter cells_from_el = 20;
  // Filter by contributing_peers - Number of distinct peers that contributed cells (optional)
  UInt32Filter contributing_peers = 21;
  // Filter by kzg_commitments_count - Number of KZG commitments of the block (optional)
  UInt32Filter kzg_commitments_count = 22;
  // Filter by topic_layer - Layer of the topic in the gossipsub protocol (optional)
  StringFilter topic_layer = 23;
  // Filter by topic_fork_digest_value - Fork digest value of the topic (optional)
  StringFilter topic_fork_digest_value = 24;
  // Filter by topic_name - Name of the topic (optional)
  StringFilter topic_name = 25;
  // Filter by topic_encoding - Encoding used for the topic (optional)
  StringFilter topic_encoding = 26;
  // Filter by meta_client_version - Version of the client that generated the event (optional)
  StringFilter meta_client_version = 27;
  // Filter by meta_client_implementation - Implementation of the client that generated the event (optional)
  StringFilter meta_client_implementation = 28;
  // Filter by meta_client_os - Operating system of the client that generated the event (optional)
  StringFilter meta_client_os = 29;
  // Filter by meta_client_ip - IP address of the client that generated the event (optional)
  NullableStringFilter meta_client_ip = 30;
  // Filter by meta_client_geo_city - City of the client that generated the event (optional)
  StringFilter meta_client_geo_city = 31;
  // Filter by meta_client_geo_country - Country of the client that generated the event (optional)
  StringFilter meta_client_geo_country = 32;
  // Filter by meta_client_geo_country_code - Country code of the client that generated the event (optional)
  StringFilter meta_client_geo_country_code = 33;
  // Filter by meta_client_geo_continent_code - Continent code of the client that generated the event (optional)
  StringFilter meta_client_geo_continent_code = 34;
  // Filter by meta_client_geo_longitude - Longitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 35;
  // Filter by meta_client_geo_latitude - Latitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 36;
  // Filter by meta_client_geo_autonomous_system_number - Autonomous system number of the client that generated the event (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 37;
  // Filter by meta_client_geo_autonomous_system_organization - Autonomous system organization of the client that generated the event (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 38;

  // The maximum number of libp2p_data_column_completed to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 39;
  // A page token, received from a previous `ListLibp2pDataColumnCompleted` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 40;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 41;
}

// Response for listing libp2p_data_column_completed records
message ListLibp2pDataColumnCompletedResponse {
  // The list of libp2p_data_column_completed.
  repeated Libp2pDataColumnCompleted libp2p_data_column_completed = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single libp2p_data_column_completed record by primary key
message GetLibp2pDataColumnCompletedRequest {
  // Name of the network associated with the client
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single libp2p_data_column_completed record
message GetLibp2pDataColumnCompletedResponse {
  Libp2pDataColumnCompleted item = 1;
}

// Query libp2p_data_column_completed data
service Libp2pDataColumnCompletedService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListLibp2pDataColumnCompletedRequest) returns (ListLibp2pDataColumnCompletedResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetLibp2pDataColumnCompletedRequest) returns (GetLibp2pDataColumnCompletedResponse);
}
