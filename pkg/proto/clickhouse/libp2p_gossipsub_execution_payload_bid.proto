  // Layer of the gossipsub topic
  string topic_layer = 33;
  // Fork digest value of the topic
  string topic_fork_digest_value = 34;
  // Name of the topic
  string topic_name = 35;
  // Encoding used for the topic
  string topic_encoding = 36;
  // Name of the client that generated the event
  string meta_client_name = 37;
  // Unique Session ID of the client
  string meta_client_id = 38;
  // Version of the client
  string meta_client_version = 39;
  // Implementation of the client
  string meta_client_implementation = 40;
  // Operating system of the client
  string meta_client_os = 41;
  // IP address of the client
  google.protobuf.StringValue meta_client_ip = 42;
  // City of the client
  string meta_client_geo_city = 43;
  // Country of the client
  string meta_client_geo_country = 44;
  // Country code of the client
  string meta_client_geo_country_code = 45;
  // Continent code of the client
  string meta_client_geo_continent_code = 46;
  // Longitude of the client
  google.protobuf.DoubleValue meta_client_geo_longitude = 47;
  // Latitude of the client
  google.protobuf.DoubleValue meta_client_geo_latitude = 48;
  // ASN of the client
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 49;
  // AS organization of the client
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 50;
  // Ethereum network ID
  int32 meta_network_id = 51;
  // Ethereum network name
  string meta_network_name = 52;
