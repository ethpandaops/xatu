  int32 propagation_slot_start_diff = 21;
  // Index of the builder, NULL when self-built
  google.protobuf.UInt64Value builder_index = 22;
  // Execution block hash committed to in the bid
  string block_hash = 23;
  // Parent execution block hash
  string parent_block_hash = 24;
  // Bid value in Gwei
  uint64 value = 25;
  // Execution payment in Gwei
  uint64 execution_payment = 26;
  // Fee recipient address
  string fee_recipient = 27;
  // Gas limit
  uint64 gas_limit = 28;
