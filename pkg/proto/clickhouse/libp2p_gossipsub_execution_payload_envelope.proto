syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Execution payload envelope gossip propagation from libp2p.

message Libp2pGossipsubExecutionPayloadEnvelope {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Timestamp of the event with millisecond precision
  int64 event_date_time = 12;
  // Slot number
  uint32 slot = 13;
  // Start date and time of the slot
  uint32 slot_start_date_time = 14;
  // Epoch number
  uint32 epoch = 15;
  // Start date and time of the epoch
  uint32 epoch_start_date_time = 16;
  // Wall clock slot when the event was received
  uint32 wallclock_slot = 17;
  // Start time of the wall clock slot
  uint32 wallclock_slot_start_date_time = 18;
  // Wall clock epoch when the event was received
  uint32 wallclock_epoch = 19;
  // Start time of the wall clock epoch
  uint32 wallclock_epoch_start_date_time = 20;
  // Propagation delay from slot start in ms
  uint32 propagation_slot_start_diff = 21;
  // Beacon block root the envelope references
  string block_root = 22;
  // Index of the builder that produced the payload, NULL when self-built
  google.protobuf.UInt64Value builder_index = 23;
  // Execution block hash
  string block_hash = 24;
  // Unique key for the peer identifier
  int64 peer_id_unique_key = 25;
  // Identifier of the gossip message
  string message_id = 26;
  // Size of the message in bytes
  uint32 message_size = 27;
  // Layer of the gossipsub topic
  string topic_layer = 28;
  // Fork digest value of the topic
  string topic_fork_digest_value = 29;
  // Name of the topic
  string topic_name = 30;
  // Encoding used for the topic
  string topic_encoding = 31;
  // Name of the client that generated the event
  string meta_client_name = 32;
  // Unique Session ID of the client
  string meta_client_id = 33;
  // Version of the client
  string meta_client_version = 34;
  // Implementation of the client
  string meta_client_implementation = 35;
  // Operating system of the client
  string meta_client_os = 36;
  // IP address of the client
  google.protobuf.StringValue meta_client_ip = 37;
  // City of the client
  string meta_client_geo_city = 38;
  // Country of the client
  string meta_client_geo_country = 39;
  // Country code of the client
  string meta_client_geo_country_code = 40;
  // Continent code of the client
  string meta_client_geo_continent_code = 41;
  // Longitude of the client
  google.protobuf.DoubleValue meta_client_geo_longitude = 42;
  // Latitude of the client
  google.protobuf.DoubleValue meta_client_geo_latitude = 43;
  // ASN of the client
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 44;
  // AS organization of the client
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 45;
  // Ethereum network ID
  int32 meta_network_id = 46;
  // Ethereum network name
  string meta_network_name = 47;
}

