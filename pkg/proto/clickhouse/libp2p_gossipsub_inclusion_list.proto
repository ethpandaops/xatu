syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Signed inclusion lists (EIP-7805 FOCIL) received on the inclusion_list gossipsub topic

message Libp2pGossipsubInclusionList {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Timestamp of the event with millisecond precision
  int64 event_date_time = 12;
  // Slot of the inclusion list
  uint32 slot = 13;
  // Start date and time of the slot
  uint32 slot_start_date_time = 14;
  // Epoch number
  uint32 epoch = 15;
  // Start date and time of the epoch
  uint32 epoch_start_date_time = 16;
  // Wall clock slot when the event was received
  uint32 wallclock_slot = 17;
  // Start time of the wall clock slot
  uint32 wallclock_slot_start_date_time = 18;
  // Wall clock epoch when the event was received
  uint32 wallclock_epoch = 19;
  // Start time of the wall clock epoch
  uint32 wallclock_epoch_start_date_time = 20;
  // Propagation delay from slot start in ms
  uint32 propagation_slot_start_diff = 21;
  // Index of the inclusion list committee member that signed the list
  uint32 validator_index = 22;
  // Dependent root the inclusion list committee was computed from
  string dependent_root = 23;
  // Number of transactions in the inclusion list
  uint32 transactions_count = 24;
  // Total size of the transactions in bytes
  uint32 transactions_total_bytes = 25;
  // Keccak-256 hashes of the transactions, in list order
  repeated string transaction_hashes = 26;
  // Unique key for the peer identifier
  int64 peer_id_unique_key = 27;
  // Identifier of the gossip message
  string message_id = 28;
  // Size of the message in bytes
  uint32 message_size = 29;
  // Layer of the gossipsub topic
  string topic_layer = 30;
  // Fork digest value of the topic
  string topic_fork_digest_value = 31;
  // Name of the topic
  string topic_name = 32;
  // Encoding used for the topic
  string topic_encoding = 33;
  // Name of the client that generated the event
  string meta_client_name = 34;
  // Unique Session ID of the client
  string meta_client_id = 35;
  // Version of the client
  string meta_client_version = 36;
  // Implementation of the client
  string meta_client_implementation = 37;
  // Operating system of the client
  string meta_client_os = 38;
  // IP address of the client
  google.protobuf.StringValue meta_client_ip = 39;
  // City of the client
  string meta_client_geo_city = 40;
  // Country of the client
  string meta_client_geo_country = 41;
  // Country code of the client
  string meta_client_geo_country_code = 42;
  // Continent code of the client
  string meta_client_geo_continent_code = 43;
  // Longitude of the client
  google.protobuf.DoubleValue meta_client_geo_longitude = 44;
  // Latitude of the client
  google.protobuf.DoubleValue meta_client_geo_latitude = 45;
  // ASN of the client
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 46;
  // AS organization of the client
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 47;
  // Ethereum network ID
  int32 meta_network_id = 48;
  // Ethereum network name
  string meta_network_name = 49;
}

// Request for listing libp2p_gossipsub_inclusion_list records
message ListLibp2pGossipsubInclusionListRequest {
  // Filter by slot_start_date_time - Start date and time of the slot (PRIMARY KEY - required)
  UInt32Filter slot_start_date_time = 1;

  // Filter by meta_network_name - Ethereum network name (ORDER BY column 2 - optional)
  StringFilter meta_network_name = 2;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 3 - optional)
  StringFilter meta_client_name = 3;

  // Filter by peer_id_unique_key - Unique key for the peer identifier (ORDER BY column 4 - optional)
  Int64Filter peer_id_unique_key = 4;

  // Filter by message_id - Identifier of the gossip message (ORDER BY column 5 - optional)
  StringFilter message_id = 5;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 6;
  // Filter by event_date_time - Timestamp of the event with millisecond precision (optional)
  Int64Filter event_date_time = 7;
  // Filter by slot - Slot of the inclusion list (optional)
  UInt32Filter slot = 8;
  // Filter by epoch - Epoch number (optional)
  UInt32Filter epoch = 9;
  // Filter by epoch_start_date_time - Start date and time of the epoch (optional)
  UInt32Filter epoch_start_date_time = 10;
  // Filter by wallclock_slot - Wall clock slot when the event was received (optional)
  UInt32Filter wallclock_slot = 11;
  // Filter by wallclock_slot_start_date_time - Start time of the wall clock slot (optional)
  UInt32Filter wallclock_slot_start_date_time = 12;
  // Filter by wallclock_epoch - Wall clock epoch when the event was received (optional)
  UInt32Filter wallclock_epoch = 13;
  // Filter by wallclock_epoch_start_date_time - Start time of the wall clock epoch (optional)
  UInt32Filter wallclock_epoch_start_date_time = 14;
  // Filter by propagation_slot_start_diff - Propagation delay from slot start in ms (optional)
  UInt32Filter propagation_slot_start_diff = 15;
  // Filter by validator_index - Index of the inclusion list committee member that signed the list (optional)
  UInt32Filter validator_index = 16;
  // Filter by dependent_root - Dependent root the inclusion list committee was computed from (optional)
  StringFilter dependent_root = 17;
  // Filter by transactions_count - Number of transactions in the inclusion list (optional)
  UInt32Filter transactions_count = 18;
  // Filter by transactions_total_bytes - Total size of the transactions in bytes (optional)
  UInt32Filter transactions_total_bytes = 19;
  // Filter by transaction_hashes - Keccak-256 hashes of the transactions, in list order (optional)
  ArrayStringFilter transaction_hashes = 20;
  // Filter by message_size - Size of the message in bytes (optional)
  UInt32Filter message_size = 21;
  // Filter by topic_layer - Layer of the gossipsub topic (optional)
  StringFilter topic_layer = 22;
  // Filter by topic_fork_digest_value - Fork digest value of the topic (optional)
  StringFilter topic_fork_digest_value = 23;
  // Filter by topic_name - Name of the topic (optional)
  StringFilter topic_name = 24;
  // Filter by topic_encoding - Encoding used for the topic (optional)
  StringFilter topic_encoding = 25;
  // Filter by meta_client_id - Unique Session ID of the client (optional)
  StringFilter meta_client_id = 26;
  // Filter by meta_client_version - Version of the client (optional)
  StringFilter meta_client_version = 27;
  // Filter by meta_client_implementation - Implementation of the client (optional)
  StringFilter meta_client_implementation = 28;
  // Filter by meta_client_os - Operating system of the client (optional)
  StringFilter meta_client_os = 29;
  // Filter by meta_client_ip - IP address of the client (optional)
  NullableStringFilter meta_client_ip = 30;
  // Filter by meta_client_geo_city - City of the client (optional)
  StringFilter meta_client_geo_city = 31;
  // Filter by meta_client_geo_country - Country of the client (optional)
  StringFilter meta_client_geo_country = 32;
  // Filter by meta_client_geo_country_code - Country code of the client (optional)
  StringFilter meta_client_geo_country_code = 33;
  // Filter by meta_client_geo_continent_code - Continent code of the client (optional)
  StringFilter meta_client_geo_continent_code = 34;
  // Filter by meta_client_geo_longitude - Longitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 35;
  // Filter by meta_client_geo_latitude - Latitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 36;
  // Filter by meta_client_geo_autonomous_system_number - ASN of the client (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 37;
  // Filter by meta_client_geo_autonomous_system_organization - AS organization of the client (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 38;
  // Filter by meta_network_id - Ethereum network ID (optional)
  Int32Filter meta_network_id = 39;

  // The maximum number of libp2p_gossipsub_inclusion_list to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 40;
  // A page token, received from a previous `ListLibp2pGossipsubInclusionList` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 41;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 42;
}

// Response for listing libp2p_gossipsub_inclusion_list records
message ListLibp2pGossipsubInclusionListResponse {
  // The list of libp2p_gossipsub_inclusion_list.
  repeated Libp2pGossipsubInclusionList libp2p_gossipsub_inclusion_list = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single libp2p_gossipsub_inclusion_list record by primary key
message GetLibp2pGossipsubInclusionListRequest {
  // Start date and time of the slot
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single libp2p_gossipsub_inclusion_list record
message GetLibp2pGossipsubInclusionListResponse {
  Libp2pGossipsubInclusionList item = 1;
}

// Query libp2p_gossipsub_inclusion_list data
service Libp2pGossipsubInclusionListService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListLibp2pGossipsubInclusionListRequest) returns (ListLibp2pGossipsubInclusionListResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetLibp2pGossipsubInclusionListRequest) returns (GetLibp2pGossipsubInclusionListResponse);
}
