syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains raw gossipsub message payloads keyed by message ID. The sharding key is content-derived so duplicates from multiple capture clients land on the same shard and deduplicate.

message Libp2pGossipsubMessagePayload {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Timestamp of the event
  int64 event_date_time = 12;
  // Slot number of the wall clock when the message was received
  uint32 wallclock_slot = 13;
  // Start date and time of the wall clock slot when the message was received
  uint32 wallclock_slot_start_date_time = 14;
  // Epoch number of the wall clock when the message was received
  uint32 wallclock_epoch = 15;
  // Start date and time of the wall clock epoch when the message was received
  uint32 wallclock_epoch_start_date_time = 16;
  // Layer of the topic
  string topic_layer = 17;
  // Fork digest value of the topic
  string topic_fork_digest_value = 18;
  // Name of the topic
  string topic_name = 19;
  // Encoding of the topic
  string topic_encoding = 20;
  // Gossipsub message ID, derived from the message contents
  string message_id = 21;
  // Size of the message payload in bytes
  uint32 message_size = 22;
  // Raw gossipsub message payload as received off the wire (snappy-framed SSZ)
  string message_data = 23;
  // Name of the client that generated the event
  string meta_client_name = 24;
  // Version of the client that generated the event
  string meta_client_version = 25;
  // Implementation of the client that generated the event
  string meta_client_implementation = 26;
  // Operating system of the client that generated the event
  string meta_client_os = 27;
  // IP address of the client that generated the event
  google.protobuf.StringValue meta_client_ip = 28;
  // City of the client that generated the event
  string meta_client_geo_city = 29;
  // Country of the client that generated the event
  string meta_client_geo_country = 30;
  // Country code of the client that generated the event
  string meta_client_geo_country_code = 31;
  // Continent code of the client that generated the event
  string meta_client_geo_continent_code = 32;
  // Longitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_longitude = 33;
  // Latitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_latitude = 34;
  // Autonomous system number of the client that generated the event
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 35;
  // Autonomous system organization of the client that generated the event
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 36;
  // Ethereum network name
  string meta_network_name = 37;
}

// Request for listing libp2p_gossipsub_message_payload records
message ListLibp2pGossipsubMessagePayloadRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by wallclock_slot_start_date_time - Start date and time of the wall clock slot when the message was received (ORDER BY column 2 - optional)
  UInt32Filter wallclock_slot_start_date_time = 2;

  // Filter by topic_fork_digest_value - Fork digest value of the topic (ORDER BY column 3 - optional)
  StringFilter topic_fork_digest_value = 3;

  // Filter by topic_name - Name of the topic (ORDER BY column 4 - optional)
  StringFilter topic_name = 4;

  // Filter by message_id - Gossipsub message ID, derived from the message contents (ORDER BY column 5 - optional)
  StringFilter message_id = 5;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 6;
  // Filter by event_date_time - Timestamp of the event (optional)
  Int64Filter event_date_time = 7;
  // Filter by wallclock_slot - Slot number of the wall clock when the message was received (optional)
  UInt32Filter wallclock_slot = 8;
  // Filter by wallclock_epoch - Epoch number of the wall clock when the message was received (optional)
  UInt32Filter wallclock_epoch = 9;
  // Filter by wallclock_epoch_start_date_time - Start date and time of the wall clock epoch when the message was received (optional)
  UInt32Filter wallclock_epoch_start_date_time = 10;
  // Filter by topic_layer - Layer of the topic (optional)
  StringFilter topic_layer = 11;
  // Filter by topic_encoding - Encoding of the topic (optional)
  StringFilter topic_encoding = 12;
  // Filter by message_size - Size of the message payload in bytes (optional)
  UInt32Filter message_size = 13;
  // Filter by message_data - Raw gossipsub message payload as received off the wire (snappy-framed SSZ) (optional)
  StringFilter message_data = 14;
  // Filter by meta_client_name - Name of the client that generated the event (optional)
  StringFilter meta_client_name = 15;
  // Filter by meta_client_version - Version of the client that generated the event (optional)
  StringFilter meta_client_version = 16;
  // Filter by meta_client_implementation - Implementation of the client that generated the event (optional)
  StringFilter meta_client_implementation = 17;
  // Filter by meta_client_os - Operating system of the client that generated the event (optional)
  StringFilter meta_client_os = 18;
  // Filter by meta_client_ip - IP address of the client that generated the event (optional)
  NullableStringFilter meta_client_ip = 19;
  // Filter by meta_client_geo_city - City of the client that generated the event (optional)
  StringFilter meta_client_geo_city = 20;
  // Filter by meta_client_geo_country - Country of the client that generated the event (optional)
  StringFilter meta_client_geo_country = 21;
  // Filter by meta_client_geo_country_code - Country code of the client that generated the event (optional)
  StringFilter meta_client_geo_country_code = 22;
  // Filter by meta_client_geo_continent_code - Continent code of the client that generated the event (optional)
  StringFilter meta_client_geo_continent_code = 23;
  // Filter by meta_client_geo_longitude - Longitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 24;
  // Filter by meta_client_geo_latitude - Latitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 25;
  // Filter by meta_client_geo_autonomous_system_number - Autonomous system number of the client that generated the event (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 26;
  // Filter by meta_client_geo_autonomous_system_organization - Autonomous system organization of the client that generated the event (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 27;

  // The maximum number of libp2p_gossipsub_message_payload to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 28;
  // A page token, received from a previous `ListLibp2pGossipsubMessagePayload` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 29;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 30;
}

// Response for listing libp2p_gossipsub_message_payload records
message ListLibp2pGossipsubMessagePayloadResponse {
  // The list of libp2p_gossipsub_message_payload.
  repeated Libp2pGossipsubMessagePayload libp2p_gossipsub_message_payload = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single libp2p_gossipsub_message_payload record by primary key
message GetLibp2pGossipsubMessagePayloadRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single libp2p_gossipsub_message_payload record
message GetLibp2pGossipsubMessagePayloadResponse {
  Libp2pGossipsubMessagePayload item = 1;
}

// Query libp2p_gossipsub_message_payload data
service Libp2pGossipsubMessagePayloadService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListLibp2pGossipsubMessagePayloadRequest) returns (ListLibp2pGossipsubMessagePayloadResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetLibp2pGossipsubMessagePayloadRequest) returns (GetLibp2pGossipsubMessagePayloadResponse);
}
