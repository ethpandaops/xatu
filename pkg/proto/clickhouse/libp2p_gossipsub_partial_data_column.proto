option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains gossipsub partial messages extension RPC parts on data column topics, one row per observation in either direction

message Libp2pGossipsubPartialDataColumn {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Timestamp of the event with millisecond precision
  int64 event_date_time = 12;
  // Slot of the block the partial belongs to. 0 when the capture point could not resolve it
  uint32 slot = 13;
  // Start date and time of the slot. Unix epoch when the slot is unknown
  uint32 slot_start_date_time = 14;
  // Epoch of the block the partial belongs to. 0 when the slot is unknown
  uint32 epoch = 15;
  // Start date and time of the epoch. Unix epoch when the slot is unknown
  uint32 epoch_start_date_time = 16;
  // Slot number of the wall clock when the event was captured
  uint32 wallclock_slot = 17;
  // Start date and time of the wall clock slot when the event was captured
  uint32 wallclock_slot_start_date_time = 18;
  // Epoch number of the wall clock when the event was captured
  uint32 wallclock_epoch = 19;
  // Start date and time of the wall clock epoch when the event was captured
  uint32 wallclock_epoch_start_date_time = 20;
  // Milliseconds between the slot start and the capture. 0 when the slot is unknown
  uint32 propagation_slot_start_diff = 21;
  // RPC direction relative to the capturing node: RECV, SEND or DROP
  string direction = 22;
  // WIRE when read from the raw RPC, APP when read after the gossipsub router filtered it. Counts are not comparable across capture points
  string capture_point = 23;
  // Unique key of the remote peer: the sender for RECV, the recipient for SEND and DROP
  int64 peer_id_unique_key = 24;
  // Layer of the topic in the gossipsub protocol
  string topic_layer = 25;
  // Fork digest value of the topic
  string topic_fork_digest_value = 26;
  // Name of the topic
  string topic_name = 27;
  // Encoding used for the topic
  string topic_encoding = 28;
  // Hex encoded partial messages group ID: version byte followed by the SSZ encoded block identity
  string group_id = 29;
  // Group ID version byte: 0 for fulu, 1 for gloas
  uint32 group_version = 30;
  // Root of the beacon block the partial belongs to
  string beacon_block_root = 31;
  // Data column index
  uint64 column_index = 32;
  // Whether the RPC part carried a partial message body
  bool has_message = 33;
  // Size of the SSZ encoded partial message in bytes. 0 for metadata-only parts
  uint32 message_size = 34;
  // Number of cells carried in the partial message
  uint32 cells_count = 35;
  // Hex encoded SSZ cells_present_bitmap of the partial message
  string cells_bitmap = 36;
  // Length of the cells bitlist, equal to the block blob count
  uint32 bitmap_length = 37;
  // Whether the partial message carried the partial data column header
  bool has_header = 38;
  // Number of KZG commitments in the header. 0 when no header was carried
  uint32 kzg_commitments_count = 39;
  // Proposer index from the header signed block header. 0 when no header was carried
  uint32 proposer_index = 40;
  // Whether the RPC part carried parts metadata
  bool has_metadata = 41;
  // Size of the SSZ encoded parts metadata in bytes
  uint32 metadata_size = 42;
  // Number of set bits in the parts metadata available bitlist
  uint32 metadata_available_count = 43;
  // Number of set bits in the parts metadata requests bitlist
  uint32 metadata_requests_count = 44;
  // Hex encoded SSZ parts metadata available bitlist
  string metadata_available = 45;
  // Hex encoded SSZ parts metadata requests bitlist
  string metadata_requests = 46;
  // Unique key of the event, derived from the event ID
  int64 unique_key = 47;
  // Name of the client that generated the event
  string meta_client_name = 48;
  // Version of the client that generated the event
  string meta_client_version = 49;
  // Implementation of the client that generated the event
  string meta_client_implementation = 50;
  // Operating system of the client that generated the event
  string meta_client_os = 51;
  // IP address of the client that generated the event
  google.protobuf.StringValue meta_client_ip = 52;
  // City of the client that generated the event
  string meta_client_geo_city = 53;
  // Country of the client that generated the event
  string meta_client_geo_country = 54;
  // Country code of the client that generated the event
  string meta_client_geo_country_code = 55;
  // Continent code of the client that generated the event
  string meta_client_geo_continent_code = 56;
  // Longitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_longitude = 57;
  // Latitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_latitude = 58;
  // Autonomous system number of the client that generated the event
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 59;
  // Autonomous system organization of the client that generated the event
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 60;
  // Name of the network associated with the client
  string meta_network_name = 61;
}

