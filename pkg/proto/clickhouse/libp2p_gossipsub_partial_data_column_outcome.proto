  // Unique key of the peer that sent the partial message
  int64 peer_id_unique_key = 21;
  // Layer of the topic in the gossipsub protocol
  string topic_layer = 22;
  // Fork digest value of the topic
  string topic_fork_digest_value = 23;
  // Name of the topic
  string topic_name = 24;
  // Encoding used for the topic
  string topic_encoding = 25;
  // Hex encoded partial messages group ID: version byte followed by the SSZ encoded block identity
  string group_id = 26;
