syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Individual PTC payload attestation messages from libp2p gossip (~512 per slot).

message Libp2pGossipsubPayloadAttestationMessage {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Timestamp of the event with millisecond precision
  int64 event_date_time = 12;
  // Slot number
  uint32 slot = 13;
  // Start date and time of the slot
  uint32 slot_start_date_time = 14;
  // Epoch number
  uint32 epoch = 15;
  // Start date and time of the epoch
  uint32 epoch_start_date_time = 16;
  // Wall clock slot when the event was received
  uint32 wallclock_slot = 17;
  // Start time of the wall clock slot
  uint32 wallclock_slot_start_date_time = 18;
  // Wall clock epoch when the event was received
  uint32 wallclock_epoch = 19;
  // Start time of the wall clock epoch
  uint32 wallclock_epoch_start_date_time = 20;
  // Propagation delay from slot start in ms
  uint32 propagation_slot_start_diff = 21;
  // Index of the PTC validator
  uint32 validator_index = 22;
  // Block root being attested to
  string beacon_block_root = 23;
  // Whether the validator attests payload was present
  bool payload_present = 24;
  // Whether the validator attests blob data was available
  bool blob_data_available = 25;
  // Unique key for the peer identifier
  int64 peer_id_unique_key = 26;
  // Identifier of the gossip message
  string message_id = 27;
  // Size of the message in bytes
  uint32 message_size = 28;
  // Layer of the gossipsub topic
  string topic_layer = 29;
  // Fork digest value of the topic
  string topic_fork_digest_value = 30;
  // Name of the topic
  string topic_name = 31;
  // Encoding used for the topic
  string topic_encoding = 32;
  // Name of the client that generated the event
  string meta_client_name = 33;
  // Unique Session ID of the client
  string meta_client_id = 34;
  // Version of the client
  string meta_client_version = 35;
  // Implementation of the client
  string meta_client_implementation = 36;
  // Operating system of the client
  string meta_client_os = 37;
  // IP address of the client
  google.protobuf.StringValue meta_client_ip = 38;
  // City of the client
  string meta_client_geo_city = 39;
  // Country of the client
  string meta_client_geo_country = 40;
  // Country code of the client
  string meta_client_geo_country_code = 41;
  // Continent code of the client
  string meta_client_geo_continent_code = 42;
  // Longitude of the client
  google.protobuf.DoubleValue meta_client_geo_longitude = 43;
  // Latitude of the client
  google.protobuf.DoubleValue meta_client_geo_latitude = 44;
  // ASN of the client
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 45;
  // AS organization of the client
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 46;
  // Ethereum network ID
  int32 meta_network_id = 47;
  // Ethereum network name
  string meta_network_name = 48;
}

// Request for listing libp2p_gossipsub_payload_attestation_message records
message ListLibp2pGossipsubPayloadAttestationMessageRequest {
  // Filter by slot_start_date_time - Start date and time of the slot (PRIMARY KEY - required)
  UInt32Filter slot_start_date_time = 1;

  // Filter by meta_network_name - Ethereum network name (ORDER BY column 2 - optional)
  StringFilter meta_network_name = 2;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 3 - optional)
  StringFilter meta_client_name = 3;

  // Filter by peer_id_unique_key - Unique key for the peer identifier (ORDER BY column 4 - optional)
  Int64Filter peer_id_unique_key = 4;

  // Filter by message_id - Identifier of the gossip message (ORDER BY column 5 - optional)
  StringFilter message_id = 5;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 6;
  // Filter by event_date_time - Timestamp of the event with millisecond precision (optional)
  Int64Filter event_date_time = 7;
  // Filter by slot - Slot number (optional)
  UInt32Filter slot = 8;
  // Filter by epoch - Epoch number (optional)
  UInt32Filter epoch = 9;
  // Filter by epoch_start_date_time - Start date and time of the epoch (optional)
  UInt32Filter epoch_start_date_time = 10;
  // Filter by wallclock_slot - Wall clock slot when the event was received (optional)
  UInt32Filter wallclock_slot = 11;
  // Filter by wallclock_slot_start_date_time - Start time of the wall clock slot (optional)
  UInt32Filter wallclock_slot_start_date_time = 12;
  // Filter by wallclock_epoch - Wall clock epoch when the event was received (optional)
  UInt32Filter wallclock_epoch = 13;
  // Filter by wallclock_epoch_start_date_time - Start time of the wall clock epoch (optional)
  UInt32Filter wallclock_epoch_start_date_time = 14;
  // Filter by propagation_slot_start_diff - Propagation delay from slot start in ms (optional)
  UInt32Filter propagation_slot_start_diff = 15;
  // Filter by validator_index - Index of the PTC validator (optional)
  UInt32Filter validator_index = 16;
  // Filter by beacon_block_root - Block root being attested to (optional)
  StringFilter beacon_block_root = 17;
  // Filter by payload_present - Whether the validator attests payload was present (optional)
  BoolFilter payload_present = 18;
  // Filter by blob_data_available - Whether the validator attests blob data was available (optional)
  BoolFilter blob_data_available = 19;
  // Filter by message_size - Size of the message in bytes (optional)
  UInt32Filter message_size = 20;
  // Filter by topic_layer - Layer of the gossipsub topic (optional)
  StringFilter topic_layer = 21;
  // Filter by topic_fork_digest_value - Fork digest value of the topic (optional)
  StringFilter topic_fork_digest_value = 22;
  // Filter by topic_name - Name of the topic (optional)
  StringFilter topic_name = 23;
  // Filter by topic_encoding - Encoding used for the topic (optional)
  StringFilter topic_encoding = 24;
  // Filter by meta_client_id - Unique Session ID of the client (optional)
  StringFilter meta_client_id = 25;
  // Filter by meta_client_version - Version of the client (optional)
  StringFilter meta_client_version = 26;
  // Filter by meta_client_implementation - Implementation of the client (optional)
  StringFilter meta_client_implementation = 27;
  // Filter by meta_client_os - Operating system of the client (optional)
  StringFilter meta_client_os = 28;
  // Filter by meta_client_ip - IP address of the client (optional)
  NullableStringFilter meta_client_ip = 29;
  // Filter by meta_client_geo_city - City of the client (optional)
  StringFilter meta_client_geo_city = 30;
  // Filter by meta_client_geo_country - Country of the client (optional)
  StringFilter meta_client_geo_country = 31;
  // Filter by meta_client_geo_country_code - Country code of the client (optional)
  StringFilter meta_client_geo_country_code = 32;
  // Filter by meta_client_geo_continent_code - Continent code of the client (optional)
  StringFilter meta_client_geo_continent_code = 33;
  // Filter by meta_client_geo_longitude - Longitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 34;
  // Filter by meta_client_geo_latitude - Latitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 35;
  // Filter by meta_client_geo_autonomous_system_number - ASN of the client (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 36;
  // Filter by meta_client_geo_autonomous_system_organization - AS organization of the client (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 37;
  // Filter by meta_network_id - Ethereum network ID (optional)
  Int32Filter meta_network_id = 38;

  // The maximum number of libp2p_gossipsub_payload_attestation_message to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 39;
  // A page token, received from a previous `ListLibp2pGossipsubPayloadAttestationMessage` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 40;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 41;
}

// Response for listing libp2p_gossipsub_payload_attestation_message records
message ListLibp2pGossipsubPayloadAttestationMessageResponse {
  // The list of libp2p_gossipsub_payload_attestation_message.
  repeated Libp2pGossipsubPayloadAttestationMessage libp2p_gossipsub_payload_attestation_message = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single libp2p_gossipsub_payload_attestation_message record by primary key
message GetLibp2pGossipsubPayloadAttestationMessageRequest {
  // Start date and time of the slot
  uint32 slot_start_date_time = 1; // Primary key (required)
}

// Response for getting a single libp2p_gossipsub_payload_attestation_message record
message GetLibp2pGossipsubPayloadAttestationMessageResponse {
  Libp2pGossipsubPayloadAttestationMessage item = 1;
}

// Query libp2p_gossipsub_payload_attestation_message data
service Libp2pGossipsubPayloadAttestationMessageService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListLibp2pGossipsubPayloadAttestationMessageRequest) returns (ListLibp2pGossipsubPayloadAttestationMessageResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetLibp2pGossipsubPayloadAttestationMessageRequest) returns (GetLibp2pGossipsubPayloadAttestationMessageResponse);
}
