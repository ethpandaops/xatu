syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains the status handling events for libp2p peers.

message Libp2pHandleStatus {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Timestamp of the event
  int64 event_date_time = 12;
  // Unique key associated with the identifier of the peer
  int64 peer_id_unique_key = 13;
  // Error message if the status handling failed
  google.protobuf.StringValue error = 14;
  // The protocol of the status handling event
  string protocol = 15;
  // Direction of the RPC request (inbound or outbound)
  string direction = 16;
  // Requested finalized epoch
  google.protobuf.UInt32Value request_finalized_epoch = 17;
  // Requested finalized root
  google.protobuf.StringValue request_finalized_root = 18;
  // Requested fork digest
  string request_fork_digest = 19;
  // Requested head root
  google.protobuf.StringValue request_head_root = 20;
  // Requested head slot
  google.protobuf.UInt32Value request_head_slot = 21;
  // Requested earliest available slot
  google.protobuf.UInt32Value request_earliest_available_slot = 22;
  // Response finalized epoch
  google.protobuf.UInt32Value response_finalized_epoch = 23;
  // Response finalized root
  google.protobuf.StringValue response_finalized_root = 24;
  // Response fork digest
  string response_fork_digest = 25;
  // Response head root
  google.protobuf.StringValue response_head_root = 26;
  // Response head slot
  google.protobuf.UInt32Value response_head_slot = 27;
  // Response earliest available slot
  google.protobuf.UInt32Value response_earliest_available_slot = 28;
  // How long it took to handle the status request in milliseconds
  string latency_milliseconds = 29;
  // Name of the client that generated the event
  string meta_client_name = 30;
  // Version of the client that generated the event
  string meta_client_version = 31;
  // Implementation of the client that generated the event
  string meta_client_implementation = 32;
  // Operating system of the client that generated the event
  string meta_client_os = 33;
  // IP address of the client that generated the event
  google.protobuf.StringValue meta_client_ip = 34;
  // City of the client that generated the event
  string meta_client_geo_city = 35;
  // Country of the client that generated the event
  string meta_client_geo_country = 36;
  // Country code of the client that generated the event
  string meta_client_geo_country_code = 37;
  // Continent code of the client that generated the event
  string meta_client_geo_continent_code = 38;
  // Longitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_longitude = 39;
  // Latitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_latitude = 40;
  // Autonomous system number of the client that generated the event
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 41;
  // Autonomous system organization of the client that generated the event
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 42;
  // Ethereum network name
  string meta_network_name = 43;
}

// Request for listing libp2p_handle_status records
message ListLibp2pHandleStatusRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by event_date_time - Timestamp of the event (ORDER BY column 2 - optional)
  Int64Filter event_date_time = 2;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 3 - optional)
  StringFilter meta_client_name = 3;

  // Filter by peer_id_unique_key - Unique key associated with the identifier of the peer (ORDER BY column 4 - optional)
  Int64Filter peer_id_unique_key = 4;

  // Filter by latency_milliseconds - How long it took to handle the status request in milliseconds (ORDER BY column 5 - optional)
  StringFilter latency_milliseconds = 5;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 6;
  // Filter by error - Error message if the status handling failed (optional)
  NullableStringFilter error = 7;
  // Filter by protocol - The protocol of the status handling event (optional)
  StringFilter protocol = 8;
  // Filter by direction - Direction of the RPC request (inbound or outbound) (optional)
  StringFilter direction = 9;
  // Filter by request_finalized_epoch - Requested finalized epoch (optional)
  NullableUInt32Filter request_finalized_epoch = 10;
  // Filter by request_finalized_root - Requested finalized root (optional)
  NullableStringFilter request_finalized_root = 11;
  // Filter by request_fork_digest - Requested fork digest (optional)
  StringFilter request_fork_digest = 12;
  // Filter by request_head_root - Requested head root (optional)
  NullableStringFilter request_head_root = 13;
  // Filter by request_head_slot - Requested head slot (optional)
  NullableUInt32Filter request_head_slot = 14;
  // Filter by request_earliest_available_slot - Requested earliest available slot (optional)
  NullableUInt32Filter request_earliest_available_slot = 15;
  // Filter by response_finalized_epoch - Response finalized epoch (optional)
  NullableUInt32Filter response_finalized_epoch = 16;
  // Filter by response_finalized_root - Response finalized root (optional)
  NullableStringFilter response_finalized_root = 17;
  // Filter by response_fork_digest - Response fork digest (optional)
  StringFilter response_fork_digest = 18;
  // Filter by response_head_root - Response head root (optional)
  NullableStringFilter response_head_root = 19;
  // Filter by response_head_slot - Response head slot (optional)
  NullableUInt32Filter response_head_slot = 20;
  // Filter by response_earliest_available_slot - Response earliest available slot (optional)
  NullableUInt32Filter response_earliest_available_slot = 21;
  // Filter by meta_client_version - Version of the client that generated the event (optional)
  StringFilter meta_client_version = 22;
  // Filter by meta_client_implementation - Implementation of the client that generated the event (optional)
  StringFilter meta_client_implementation = 23;
  // Filter by meta_client_os - Operating system of the client that generated the event (optional)
  StringFilter meta_client_os = 24;
  // Filter by meta_client_ip - IP address of the client that generated the event (optional)
  NullableStringFilter meta_client_ip = 25;
  // Filter by meta_client_geo_city - City of the client that generated the event (optional)
  StringFilter meta_client_geo_city = 26;
  // Filter by meta_client_geo_country - Country of the client that generated the event (optional)
  StringFilter meta_client_geo_country = 27;
  // Filter by meta_client_geo_country_code - Country code of the client that generated the event (optional)
  StringFilter meta_client_geo_country_code = 28;
  // Filter by meta_client_geo_continent_code - Continent code of the client that generated the event (optional)
  StringFilter meta_client_geo_continent_code = 29;
  // Filter by meta_client_geo_longitude - Longitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 30;
  // Filter by meta_client_geo_latitude - Latitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 31;
  // Filter by meta_client_geo_autonomous_system_number - Autonomous system number of the client that generated the event (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 32;
  // Filter by meta_client_geo_autonomous_system_organization - Autonomous system organization of the client that generated the event (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 33;

  // The maximum number of libp2p_handle_status to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 34;
  // A page token, received from a previous `ListLibp2pHandleStatus` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 35;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 36;
}

// Response for listing libp2p_handle_status records
message ListLibp2pHandleStatusResponse {
  // The list of libp2p_handle_status.
  repeated Libp2pHandleStatus libp2p_handle_status = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single libp2p_handle_status record by primary key
message GetLibp2pHandleStatusRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single libp2p_handle_status record
message GetLibp2pHandleStatusResponse {
  Libp2pHandleStatus item = 1;
}

// Query libp2p_handle_status data
service Libp2pHandleStatusService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListLibp2pHandleStatusRequest) returns (ListLibp2pHandleStatusResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetLibp2pHandleStatusRequest) returns (GetLibp2pHandleStatusResponse);
}
