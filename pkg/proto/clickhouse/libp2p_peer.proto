syntax = "proto3";

package clickhouse.v1;

import "common.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains the original peer id of a seahashed peer_id + meta_network_name, commonly seen in other tables as the field peer_id_unique_key

message Libp2pPeer {
  // Unique identifier for each record, seahash of peer_id + meta_network_name
  int64 unique_key = 11;
  // Timestamp when the record was last updated
  uint32 updated_date_time = 12;
  // Peer ID
  string peer_id = 13;
  // Ethereum network name
  string meta_network_name = 14;
}

// Request for listing libp2p_peer records
message ListLibp2pPeerRequest {
  // Filter by unique_key - Unique identifier for each record, seahash of peer_id + meta_network_name (PRIMARY KEY - required)
  Int64Filter unique_key = 1;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 2;
  // Filter by peer_id - Peer ID (optional)
  StringFilter peer_id = 3;
  // Filter by meta_network_name - Ethereum network name (optional)
  StringFilter meta_network_name = 4;

  // The maximum number of libp2p_peer to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 5;
  // A page token, received from a previous `ListLibp2pPeer` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 6;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 7;
}

// Response for listing libp2p_peer records
message ListLibp2pPeerResponse {
  // The list of libp2p_peer.
  repeated Libp2pPeer libp2p_peer = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single libp2p_peer record by primary key
message GetLibp2pPeerRequest {
  // Unique identifier for each record, seahash of peer_id + meta_network_name
  int64 unique_key = 1; // Primary key (required)
}

// Response for getting a single libp2p_peer record
message GetLibp2pPeerResponse {
  Libp2pPeer item = 1;
}

// Query libp2p_peer data
service Libp2pPeerService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListLibp2pPeerRequest) returns (ListLibp2pPeerResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetLibp2pPeerRequest) returns (GetLibp2pPeerResponse);
}
