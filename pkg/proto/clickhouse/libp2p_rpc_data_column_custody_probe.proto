option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains custody probe events for data column availability verification

message Libp2pRpcDataColumnCustodyProbe {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // When the probe was executed
  int64 event_date_time = 12;
  // Slot number being probed
  uint32 slot = 13;
  // The wall clock time when the slot started
  uint32 slot_start_date_time = 14;
  // Epoch number of the slot being probed
  uint32 epoch = 15;
  // The wall clock time when the epoch started
  uint32 epoch_start_date_time = 16;
  // The wallclock slot when the request was sent
  uint32 wallclock_request_slot = 17;
  // The start time for the slot when the request was sent
  uint32 wallclock_request_slot_start_date_time = 18;
  // The wallclock epoch when the request was sent
  uint32 wallclock_request_epoch = 19;
  // The start time for the wallclock epoch when the request was sent
  uint32 wallclock_request_epoch_start_date_time = 20;
  // Column index being probed
  uint64 column_index = 21;
  // Number of rows in the column
  uint32 column_rows_count = 22;
  // Root of the beacon block
  string beacon_block_root = 23;
  // Unique key associated with the identifier of the peer
  int64 peer_id_unique_key = 24;
  // Result of the probe
  string result = 25;
  // Response time in milliseconds
  int32 response_time_ms = 26;
  // Error message if probe failed
  google.protobuf.StringValue error = 27;
  // Name of the client that executed the probe
  string meta_client_name = 28;
  // Version of the client
  string meta_client_version = 29;
  // Implementation of the client
  string meta_client_implementation = 30;
  // Operating system of the client
  string meta_client_os = 31;
  // IP address of the client
  google.protobuf.StringValue meta_client_ip = 32;
  // City of the client
  string meta_client_geo_city = 33;
  // Country of the client
  string meta_client_geo_country = 34;
  // Country code of the client
  string meta_client_geo_country_code = 35;
  // Continent code of the client
  string meta_client_geo_continent_code = 36;
  // Longitude of the client
  google.protobuf.DoubleValue meta_client_geo_longitude = 37;
  // Latitude of the client
  google.protobuf.DoubleValue meta_client_geo_latitude = 38;
  // Autonomous system number of the client
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 39;
  // Autonomous system organization of the client
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 40;
  // Ethereum network name
  string meta_network_name = 41;
}

