syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains heartbeat events from libp2p peers

message Libp2pSyntheticHeartbeat {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // Timestamp of the heartbeat event
  int64 event_date_time = 12;
  // Unique key of the remote peer
  int64 remote_peer_id_unique_key = 13;
  // Multiaddress of the remote peer
  string remote_maddrs = 14;
  // EWMA latency in milliseconds (0 if unavailable)
  google.protobuf.Int64Value latency_ms = 15;
  // Connection direction (Unknown/Inbound/Outbound)
  string direction = 16;
  // List of supported protocols
  repeated string protocols = 17;
  // Connection age in milliseconds
  google.protobuf.Int64Value connection_age_ms = 18;
  // Implementation of the remote peer
  string remote_agent_implementation = 19;
  // Version of the remote peer
  string remote_agent_version = 20;
  // Major version of the remote peer
  string remote_agent_version_major = 21;
  // Minor version of the remote peer
  string remote_agent_version_minor = 22;
  // Patch version of the remote peer
  string remote_agent_version_patch = 23;
  // Platform of the remote peer
  string remote_agent_platform = 24;
  // IP address of the remote peer
  google.protobuf.StringValue remote_ip = 25;
  // Port of the remote peer
  google.protobuf.UInt32Value remote_port = 26;
  // City of the remote peer
  string remote_geo_city = 27;
  // Country of the remote peer
  string remote_geo_country = 28;
  // Country code of the remote peer
  string remote_geo_country_code = 29;
  // Continent code of the remote peer
  string remote_geo_continent_code = 30;
  // Longitude of the remote peer
  google.protobuf.DoubleValue remote_geo_longitude = 31;
  // Latitude of the remote peer
  google.protobuf.DoubleValue remote_geo_latitude = 32;
  // ASN of the remote peer
  google.protobuf.UInt32Value remote_geo_autonomous_system_number = 33;
  // AS organization of the remote peer
  google.protobuf.StringValue remote_geo_autonomous_system_organization = 34;
  // Name of the client that generated the event
  string meta_client_name = 35;
  // Version of the client
  string meta_client_version = 36;
  // Implementation of the client
  string meta_client_implementation = 37;
  // Operating system of the client
  string meta_client_os = 38;
  // IP address of the client
  google.protobuf.StringValue meta_client_ip = 39;
  // City of the client
  string meta_client_geo_city = 40;
  // Country of the client
  string meta_client_geo_country = 41;
  // Country code of the client
  string meta_client_geo_country_code = 42;
  // Continent code of the client
  string meta_client_geo_continent_code = 43;
  // Longitude of the client
  google.protobuf.DoubleValue meta_client_geo_longitude = 44;
  // Latitude of the client
  google.protobuf.DoubleValue meta_client_geo_latitude = 45;
  // ASN of the client
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 46;
  // AS organization of the client
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 47;
  // Ethereum network name
  string meta_network_name = 48;
}

// Request for listing libp2p_synthetic_heartbeat records
message ListLibp2pSyntheticHeartbeatRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by event_date_time - Timestamp of the heartbeat event (ORDER BY column 2 - optional)
  Int64Filter event_date_time = 2;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 3 - optional)
  StringFilter meta_client_name = 3;

  // Filter by remote_peer_id_unique_key - Unique key of the remote peer (ORDER BY column 4 - optional)
  Int64Filter remote_peer_id_unique_key = 4;

  // Filter by updated_date_time - Timestamp when the record was last updated (ORDER BY column 5 - optional)
  UInt32Filter updated_date_time = 5;

  // Filter by remote_maddrs - Multiaddress of the remote peer (optional)
  StringFilter remote_maddrs = 6;
  // Filter by latency_ms - EWMA latency in milliseconds (0 if unavailable) (optional)
  NullableInt64Filter latency_ms = 7;
  // Filter by direction - Connection direction (Unknown/Inbound/Outbound) (optional)
  StringFilter direction = 8;
  // Filter by protocols - List of supported protocols (optional)
  ArrayStringFilter protocols = 9;
  // Filter by connection_age_ms - Connection age in milliseconds (optional)
  NullableInt64Filter connection_age_ms = 10;
  // Filter by remote_agent_implementation - Implementation of the remote peer (optional)
  StringFilter remote_agent_implementation = 11;
  // Filter by remote_agent_version - Version of the remote peer (optional)
  StringFilter remote_agent_version = 12;
  // Filter by remote_agent_version_major - Major version of the remote peer (optional)
  StringFilter remote_agent_version_major = 13;
  // Filter by remote_agent_version_minor - Minor version of the remote peer (optional)
  StringFilter remote_agent_version_minor = 14;
  // Filter by remote_agent_version_patch - Patch version of the remote peer (optional)
  StringFilter remote_agent_version_patch = 15;
  // Filter by remote_agent_platform - Platform of the remote peer (optional)
  StringFilter remote_agent_platform = 16;
  // Filter by remote_ip - IP address of the remote peer (optional)
  NullableStringFilter remote_ip = 17;
  // Filter by remote_port - Port of the remote peer (optional)
  NullableUInt32Filter remote_port = 18;
  // Filter by remote_geo_city - City of the remote peer (optional)
  StringFilter remote_geo_city = 19;
  // Filter by remote_geo_country - Country of the remote peer (optional)
  StringFilter remote_geo_country = 20;
  // Filter by remote_geo_country_code - Country code of the remote peer (optional)
  StringFilter remote_geo_country_code = 21;
  // Filter by remote_geo_continent_code - Continent code of the remote peer (optional)
  StringFilter remote_geo_continent_code = 22;
  // Filter by remote_geo_longitude - Longitude of the remote peer (optional)
  google.protobuf.DoubleValue remote_geo_longitude = 23;
  // Filter by remote_geo_latitude - Latitude of the remote peer (optional)
  google.protobuf.DoubleValue remote_geo_latitude = 24;
  // Filter by remote_geo_autonomous_system_number - ASN of the remote peer (optional)
  NullableUInt32Filter remote_geo_autonomous_system_number = 25;
  // Filter by remote_geo_autonomous_system_organization - AS organization of the remote peer (optional)
  NullableStringFilter remote_geo_autonomous_system_organization = 26;
  // Filter by meta_client_version - Version of the client (optional)
  StringFilter meta_client_version = 27;
  // Filter by meta_client_implementation - Implementation of the client (optional)
  StringFilter meta_client_implementation = 28;
  // Filter by meta_client_os - Operating system of the client (optional)
  StringFilter meta_client_os = 29;
  // Filter by meta_client_ip - IP address of the client (optional)
  NullableStringFilter meta_client_ip = 30;
  // Filter by meta_client_geo_city - City of the client (optional)
  StringFilter meta_client_geo_city = 31;
  // Filter by meta_client_geo_country - Country of the client (optional)
  StringFilter meta_client_geo_country = 32;
  // Filter by meta_client_geo_country_code - Country code of the client (optional)
  StringFilter meta_client_geo_country_code = 33;
  // Filter by meta_client_geo_continent_code - Continent code of the client (optional)
  StringFilter meta_client_geo_continent_code = 34;
  // Filter by meta_client_geo_longitude - Longitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 35;
  // Filter by meta_client_geo_latitude - Latitude of the client (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 36;
  // Filter by meta_client_geo_autonomous_system_number - ASN of the client (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 37;
  // Filter by meta_client_geo_autonomous_system_organization - AS organization of the client (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 38;

  // The maximum number of libp2p_synthetic_heartbeat to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 39;
  // A page token, received from a previous `ListLibp2pSyntheticHeartbeat` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 40;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 41;
}

// Response for listing libp2p_synthetic_heartbeat records
message ListLibp2pSyntheticHeartbeatResponse {
  // The list of libp2p_synthetic_heartbeat.
  repeated Libp2pSyntheticHeartbeat libp2p_synthetic_heartbeat = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single libp2p_synthetic_heartbeat record by primary key
message GetLibp2pSyntheticHeartbeatRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single libp2p_synthetic_heartbeat record
message GetLibp2pSyntheticHeartbeatResponse {
  Libp2pSyntheticHeartbeat item = 1;
}

// Query libp2p_synthetic_heartbeat data
service Libp2pSyntheticHeartbeatService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListLibp2pSyntheticHeartbeatRequest) returns (ListLibp2pSyntheticHeartbeatResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetLibp2pSyntheticHeartbeatRequest) returns (GetLibp2pSyntheticHeartbeatResponse);
}
