syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains MEV relay block bids data.

message MevRelayBidTrace {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // When the bid was fetched
  int64 event_date_time = 12;
  // Slot number within the block bid
  uint32 slot = 13;
  // The start time for the slot that the bid is for
  uint32 slot_start_date_time = 14;
  // Epoch number derived from the slot that the bid is for
  uint32 epoch = 15;
  // The start time for the epoch that the bid is for
  uint32 epoch_start_date_time = 16;
  // The wallclock slot when the request was sent
  uint32 wallclock_request_slot = 17;
  // The start time for the slot when the request was sent
  uint32 wallclock_request_slot_start_date_time = 18;
  // The wallclock epoch when the request was sent
  uint32 wallclock_request_epoch = 19;
  // The start time for the wallclock epoch when the request was sent
  uint32 wallclock_request_epoch_start_date_time = 20;
  // The time in the slot when the request was sent
  uint32 requested_at_slot_time = 21;
  // The time in the slot when the response was received
  uint32 response_at_slot_time = 22;
  // The relay that the bid was fetched from
  string relay_name = 23;
  // The parent hash of the bid
  string parent_hash = 24;
  // The block number of the bid
  uint64 block_number = 25;
  // The block hash of the bid
  string block_hash = 26;
  // The builder pubkey of the bid
  string builder_pubkey = 27;
  // The proposer pubkey of the bid
  string proposer_pubkey = 28;
  // The proposer fee recipient of the bid
  string proposer_fee_recipient = 29;
  // The gas limit of the bid
  uint64 gas_limit = 30;
  // The gas used of the bid
  uint64 gas_used = 31;
  // The transaction value in float64
  string value = 32;
  // The number of transactions in the bid
  uint32 num_tx = 33;
  // The timestamp of the bid
  int64 timestamp = 34;
  // The timestamp of the bid in milliseconds
  int64 timestamp_ms = 35;
  // Whether the bid was optimistic
  bool optimistic_submission = 36;
  // Name of the client that generated the event
  string meta_client_name = 37;
  // Version of the client that generated the event
  string meta_client_version = 38;
  // Implementation of the client that generated the event
  string meta_client_implementation = 39;
  // Operating system of the client that generated the event
  string meta_client_os = 40;
  // IP address of the client that generated the event
  google.protobuf.StringValue meta_client_ip = 41;
  // City of the client that generated the event
  string meta_client_geo_city = 42;
  // Country of the client that generated the event
  string meta_client_geo_country = 43;
  // Country code of the client that generated the event
  string meta_client_geo_country_code = 44;
  // Continent code of the client that generated the event
  string meta_client_geo_continent_code = 45;
  // Longitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_longitude = 46;
  // Latitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_latitude = 47;
  // Autonomous system number of the client that generated the event
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 48;
  // Autonomous system organization of the client that generated the event
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 49;
  // Ethereum network name
  string meta_network_name = 50;
}

// Request for listing mev_relay_bid_trace records
message ListMevRelayBidTraceRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by slot_start_date_time - The start time for the slot that the bid is for (ORDER BY column 2 - optional)
  UInt32Filter slot_start_date_time = 2;

  // Filter by relay_name - The relay that the bid was fetched from (ORDER BY column 3 - optional)
  StringFilter relay_name = 3;

  // Filter by block_hash - The block hash of the bid (ORDER BY column 4 - optional)
  StringFilter block_hash = 4;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 5 - optional)
  StringFilter meta_client_name = 5;

  // Filter by builder_pubkey - The builder pubkey of the bid (ORDER BY column 6 - optional)
  StringFilter builder_pubkey = 6;

  // Filter by proposer_pubkey - The proposer pubkey of the bid (ORDER BY column 7 - optional)
  StringFilter proposer_pubkey = 7;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 8;
  // Filter by event_date_time - When the bid was fetched (optional)
  Int64Filter event_date_time = 9;
  // Filter by slot - Slot number within the block bid (optional)
  UInt32Filter slot = 10;
  // Filter by epoch - Epoch number derived from the slot that the bid is for (optional)
  UInt32Filter epoch = 11;
  // Filter by epoch_start_date_time - The start time for the epoch that the bid is for (optional)
  UInt32Filter epoch_start_date_time = 12;
  // Filter by wallclock_request_slot - The wallclock slot when the request was sent (optional)
  UInt32Filter wallclock_request_slot = 13;
  // Filter by wallclock_request_slot_start_date_time - The start time for the slot when the request was sent (optional)
  UInt32Filter wallclock_request_slot_start_date_time = 14;
  // Filter by wallclock_request_epoch - The wallclock epoch when the request was sent (optional)
  UInt32Filter wallclock_request_epoch = 15;
  // Filter by wallclock_request_epoch_start_date_time - The start time for the wallclock epoch when the request was sent (optional)
  UInt32Filter wallclock_request_epoch_start_date_time = 16;
  // Filter by requested_at_slot_time - The time in the slot when the request was sent (optional)
  UInt32Filter requested_at_slot_time = 17;
  // Filter by response_at_slot_time - The time in the slot when the response was received (optional)
  UInt32Filter response_at_slot_time = 18;
  // Filter by parent_hash - The parent hash of the bid (optional)
  StringFilter parent_hash = 19;
  // Filter by block_number - The block number of the bid (optional)
  UInt64Filter block_number = 20;
  // Filter by proposer_fee_recipient - The proposer fee recipient of the bid (optional)
  StringFilter proposer_fee_recipient = 21;
  // Filter by gas_limit - The gas limit of the bid (optional)
  UInt64Filter gas_limit = 22;
  // Filter by gas_used - The gas used of the bid (optional)
  UInt64Filter gas_used = 23;
  // Filter by value - The transaction value in float64 (optional)
  StringFilter value = 24;
  // Filter by num_tx - The number of transactions in the bid (optional)
  UInt32Filter num_tx = 25;
  // Filter by timestamp - The timestamp of the bid (optional)
  Int64Filter timestamp = 26;
  // Filter by timestamp_ms - The timestamp of the bid in milliseconds (optional)
  Int64Filter timestamp_ms = 27;
  // Filter by optimistic_submission - Whether the bid was optimistic (optional)
  BoolFilter optimistic_submission = 28;
  // Filter by meta_client_version - Version of the client that generated the event (optional)
  StringFilter meta_client_version = 29;
  // Filter by meta_client_implementation - Implementation of the client that generated the event (optional)
  StringFilter meta_client_implementation = 30;
  // Filter by meta_client_os - Operating system of the client that generated the event (optional)
  StringFilter meta_client_os = 31;
  // Filter by meta_client_ip - IP address of the client that generated the event (optional)
  NullableStringFilter meta_client_ip = 32;
  // Filter by meta_client_geo_city - City of the client that generated the event (optional)
  StringFilter meta_client_geo_city = 33;
  // Filter by meta_client_geo_country - Country of the client that generated the event (optional)
  StringFilter meta_client_geo_country = 34;
  // Filter by meta_client_geo_country_code - Country code of the client that generated the event (optional)
  StringFilter meta_client_geo_country_code = 35;
  // Filter by meta_client_geo_continent_code - Continent code of the client that generated the event (optional)
  StringFilter meta_client_geo_continent_code = 36;
  // Filter by meta_client_geo_longitude - Longitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 37;
  // Filter by meta_client_geo_latitude - Latitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 38;
  // Filter by meta_client_geo_autonomous_system_number - Autonomous system number of the client that generated the event (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 39;
  // Filter by meta_client_geo_autonomous_system_organization - Autonomous system organization of the client that generated the event (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 40;

  // The maximum number of mev_relay_bid_trace to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 41;
  // A page token, received from a previous `ListMevRelayBidTrace` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 42;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 43;
}

// Response for listing mev_relay_bid_trace records
message ListMevRelayBidTraceResponse {
  // The list of mev_relay_bid_trace.
  repeated MevRelayBidTrace mev_relay_bid_trace = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single mev_relay_bid_trace record by primary key
message GetMevRelayBidTraceRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single mev_relay_bid_trace record
message GetMevRelayBidTraceResponse {
  MevRelayBidTrace item = 1;
}

// Query mev_relay_bid_trace data
service MevRelayBidTraceService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListMevRelayBidTraceRequest) returns (ListMevRelayBidTraceResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetMevRelayBidTraceRequest) returns (GetMevRelayBidTraceResponse);
}
