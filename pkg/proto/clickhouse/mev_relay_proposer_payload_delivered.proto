syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains MEV relay proposer payload delivered data.

message MevRelayProposerPayloadDelivered {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // When the payload was delivered
  int64 event_date_time = 12;
  // Slot number within the payload
  uint32 slot = 13;
  // The start time for the slot that the bid is for
  uint32 slot_start_date_time = 14;
  // Epoch number derived from the slot that the bid is for
  uint32 epoch = 15;
  // The start time for the epoch that the bid is for
  uint32 epoch_start_date_time = 16;
  // The wallclock slot when the request was sent
  uint32 wallclock_slot = 17;
  // The start time for the slot when the request was sent
  uint32 wallclock_slot_start_date_time = 18;
  // The wallclock epoch when the request was sent
  uint32 wallclock_epoch = 19;
  // The start time for the wallclock epoch when the request was sent
  uint32 wallclock_epoch_start_date_time = 20;
  // The block number of the payload
  uint64 block_number = 21;
  // The relay that delivered the payload
  string relay_name = 22;
  // The block hash associated with the payload
  string block_hash = 23;
  // The proposer pubkey that received the payload
  string proposer_pubkey = 24;
  // The builder pubkey that sent the payload
  string builder_pubkey = 25;
  // The proposer fee recipient of the payload
  string proposer_fee_recipient = 26;
  // The gas limit of the payload
  uint64 gas_limit = 27;
  // The gas used by the payload
  uint64 gas_used = 28;
  // The bid value in wei
  string value = 29;
  // The number of transactions in the payload
  uint32 num_tx = 30;
  // Name of the client that generated the event
  string meta_client_name = 31;
  // Version of the client that generated the event
  string meta_client_version = 32;
  // Implementation of the client that generated the event
  string meta_client_implementation = 33;
  // Operating system of the client that generated the event
  string meta_client_os = 34;
  // IP address of the client that generated the event
  google.protobuf.StringValue meta_client_ip = 35;
  // City of the client that generated the event
  string meta_client_geo_city = 36;
  // Country of the client that generated the event
  string meta_client_geo_country = 37;
  // Country code of the client that generated the event
  string meta_client_geo_country_code = 38;
  // Continent code of the client that generated the event
  string meta_client_geo_continent_code = 39;
  // Longitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_longitude = 40;
  // Latitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_latitude = 41;
  // Autonomous system number of the client that generated the event
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 42;
  // Autonomous system organization of the client that generated the event
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 43;
  // Ethereum network name
  string meta_network_name = 44;
}

// Request for listing mev_relay_proposer_payload_delivered records
