syntax = "proto3";

package clickhouse.v1;

import "common.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/ethpandaops/xatu/pkg/proto/clickhouse";
// Contains execution node records discovered by the Xatu discovery module.

message NodeRecordExecution {
  // Timestamp when the record was last updated
  uint32 updated_date_time = 11;
  // When the event was generated
  int64 event_date_time = 12;
  // Ethereum Node Record as text
  string enr = 13;
  // Execution client name
  string name = 14;
  // Execution client version
  string version = 15;
  // Execution client major version
  string version_major = 16;
  // Execution client minor version
  string version_minor = 17;
  // Execution client patch version
  string version_patch = 18;
  // Execution client implementation
  string implementation = 19;
  // List of capabilities (e.g., eth/65,eth/66)
  repeated string capabilities = 20;
  // Protocol version
  string protocol_version = 21;
  // Total difficulty of the chain
  string total_difficulty = 22;
  // Head block hash
  string head = 23;
  // Genesis block hash
  string genesis = 24;
  // Fork ID hash
  string fork_id_hash = 25;
  // Fork ID next block
  string fork_id_next = 26;
  // Node ID from ENR
  string node_id = 27;
  // IP address of the execution node
  google.protobuf.StringValue ip = 28;
  // TCP port from ENR
  google.protobuf.UInt32Value tcp = 29;
  // UDP port from ENR
  google.protobuf.UInt32Value udp = 30;
  // Whether the execution node has an IPv6 address
  bool has_ipv6 = 31;
  // City of the execution node
  string geo_city = 32;
  // Country of the execution node
  string geo_country = 33;
  // Country code of the execution node
  string geo_country_code = 34;
  // Continent code of the execution node
  string geo_continent_code = 35;
  // Longitude of the execution node
  google.protobuf.DoubleValue geo_longitude = 36;
  // Latitude of the execution node
  google.protobuf.DoubleValue geo_latitude = 37;
  // Autonomous system number of the execution node
  google.protobuf.UInt32Value geo_autonomous_system_number = 38;
  // Autonomous system organization of the execution node
  google.protobuf.StringValue geo_autonomous_system_organization = 39;
  // Name of the client that generated the event
  string meta_client_name = 40;
  // Version of the client that generated the event
  string meta_client_version = 41;
  // Implementation of the client that generated the event
  string meta_client_implementation = 42;
  // Operating system of the client that generated the event
  string meta_client_os = 43;
  // IP address of the client that generated the event
  google.protobuf.StringValue meta_client_ip = 44;
  // City of the client that generated the event
  string meta_client_geo_city = 45;
  // Country of the client that generated the event
  string meta_client_geo_country = 46;
  // Country code of the client that generated the event
  string meta_client_geo_country_code = 47;
  // Continent code of the client that generated the event
  string meta_client_geo_continent_code = 48;
  // Longitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_longitude = 49;
  // Latitude of the client that generated the event
  google.protobuf.DoubleValue meta_client_geo_latitude = 50;
  // Autonomous system number of the client that generated the event
  google.protobuf.UInt32Value meta_client_geo_autonomous_system_number = 51;
  // Autonomous system organization of the client that generated the event
  google.protobuf.StringValue meta_client_geo_autonomous_system_organization = 52;
  // Ethereum network name
  string meta_network_name = 53;
}

// Request for listing node_record_execution records
message ListNodeRecordExecutionRequest {
  // Filter by meta_network_name - Ethereum network name (PRIMARY KEY - required)
  StringFilter meta_network_name = 1;

  // Filter by event_date_time - When the event was generated (ORDER BY column 2 - optional)
  Int64Filter event_date_time = 2;

  // Filter by node_id - Node ID from ENR (ORDER BY column 3 - optional)
  StringFilter node_id = 3;

  // Filter by meta_client_name - Name of the client that generated the event (ORDER BY column 4 - optional)
  StringFilter meta_client_name = 4;

  // Filter by updated_date_time - Timestamp when the record was last updated (optional)
  UInt32Filter updated_date_time = 5;
  // Filter by enr - Ethereum Node Record as text (optional)
  StringFilter enr = 6;
  // Filter by name - Execution client name (optional)
  StringFilter name = 7;
  // Filter by version - Execution client version (optional)
  StringFilter version = 8;
  // Filter by version_major - Execution client major version (optional)
  StringFilter version_major = 9;
  // Filter by version_minor - Execution client minor version (optional)
  StringFilter version_minor = 10;
  // Filter by version_patch - Execution client patch version (optional)
  StringFilter version_patch = 11;
  // Filter by implementation - Execution client implementation (optional)
  StringFilter implementation = 12;
  // Filter by capabilities - List of capabilities (e.g., eth/65,eth/66) (optional)
  ArrayStringFilter capabilities = 13;
  // Filter by protocol_version - Protocol version (optional)
  StringFilter protocol_version = 14;
  // Filter by total_difficulty - Total difficulty of the chain (optional)
  StringFilter total_difficulty = 15;
  // Filter by head - Head block hash (optional)
  StringFilter head = 16;
  // Filter by genesis - Genesis block hash (optional)
  StringFilter genesis = 17;
  // Filter by fork_id_hash - Fork ID hash (optional)
  StringFilter fork_id_hash = 18;
  // Filter by fork_id_next - Fork ID next block (optional)
  StringFilter fork_id_next = 19;
  // Filter by ip - IP address of the execution node (optional)
  NullableStringFilter ip = 20;
  // Filter by tcp - TCP port from ENR (optional)
  NullableUInt32Filter tcp = 21;
  // Filter by udp - UDP port from ENR (optional)
  NullableUInt32Filter udp = 22;
  // Filter by has_ipv6 - Whether the execution node has an IPv6 address (optional)
  BoolFilter has_ipv6 = 23;
  // Filter by geo_city - City of the execution node (optional)
  StringFilter geo_city = 24;
  // Filter by geo_country - Country of the execution node (optional)
  StringFilter geo_country = 25;
  // Filter by geo_country_code - Country code of the execution node (optional)
  StringFilter geo_country_code = 26;
  // Filter by geo_continent_code - Continent code of the execution node (optional)
  StringFilter geo_continent_code = 27;
  // Filter by geo_longitude - Longitude of the execution node (optional)
  google.protobuf.DoubleValue geo_longitude = 28;
  // Filter by geo_latitude - Latitude of the execution node (optional)
  google.protobuf.DoubleValue geo_latitude = 29;
  // Filter by geo_autonomous_system_number - Autonomous system number of the execution node (optional)
  NullableUInt32Filter geo_autonomous_system_number = 30;
  // Filter by geo_autonomous_system_organization - Autonomous system organization of the execution node (optional)
  NullableStringFilter geo_autonomous_system_organization = 31;
  // Filter by meta_client_version - Version of the client that generated the event (optional)
  StringFilter meta_client_version = 32;
  // Filter by meta_client_implementation - Implementation of the client that generated the event (optional)
  StringFilter meta_client_implementation = 33;
  // Filter by meta_client_os - Operating system of the client that generated the event (optional)
  StringFilter meta_client_os = 34;
  // Filter by meta_client_ip - IP address of the client that generated the event (optional)
  NullableStringFilter meta_client_ip = 35;
  // Filter by meta_client_geo_city - City of the client that generated the event (optional)
  StringFilter meta_client_geo_city = 36;
  // Filter by meta_client_geo_country - Country of the client that generated the event (optional)
  StringFilter meta_client_geo_country = 37;
  // Filter by meta_client_geo_country_code - Country code of the client that generated the event (optional)
  StringFilter meta_client_geo_country_code = 38;
  // Filter by meta_client_geo_continent_code - Continent code of the client that generated the event (optional)
  StringFilter meta_client_geo_continent_code = 39;
  // Filter by meta_client_geo_longitude - Longitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_longitude = 40;
  // Filter by meta_client_geo_latitude - Latitude of the client that generated the event (optional)
  google.protobuf.DoubleValue meta_client_geo_latitude = 41;
  // Filter by meta_client_geo_autonomous_system_number - Autonomous system number of the client that generated the event (optional)
  NullableUInt32Filter meta_client_geo_autonomous_system_number = 42;
  // Filter by meta_client_geo_autonomous_system_organization - Autonomous system organization of the client that generated the event (optional)
  NullableStringFilter meta_client_geo_autonomous_system_organization = 43;

  // The maximum number of node_record_execution to return.
  // If unspecified, at most 100 items will be returned.
  // The maximum value is 10000; values above 10000 will be coerced to 10000.
  int32 page_size = 44;
  // A page token, received from a previous `ListNodeRecordExecution` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 45;
  // The order of results. Format: comma-separated list of fields.
  // Example: "foo,bar" or "foo desc,bar" for descending order on foo.
  // If unspecified, results will be returned in the default order.
  string order_by = 46;
}

// Response for listing node_record_execution records
message ListNodeRecordExecutionResponse {
  // The list of node_record_execution.
  repeated NodeRecordExecution node_record_execution = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request for getting a single node_record_execution record by primary key
message GetNodeRecordExecutionRequest {
  // Ethereum network name
  string meta_network_name = 1; // Primary key (required)
}

// Response for getting a single node_record_execution record
message GetNodeRecordExecutionResponse {
  NodeRecordExecution item = 1;
}

// Query node_record_execution data
service NodeRecordExecutionService {
  // List records | Retrieve paginated results with optional filtering
  rpc List(ListNodeRecordExecutionRequest) returns (ListNodeRecordExecutionResponse);
  // Get record | Retrieve a single record by primary key
  rpc Get(GetNodeRecordExecutionRequest) returns (GetNodeRecordExecutionResponse);
}
