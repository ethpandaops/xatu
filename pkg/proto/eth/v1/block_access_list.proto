syntax = "proto3";

package xatu.eth.v1;

option go_package = "github.com/ethpandaops/xatu/pkg/proto/eth/v1";

import "google/protobuf/descriptor.proto";
import "google/protobuf/wrappers.proto";

message BlockAccessListStorageChange {
  google.protobuf.UInt32Value block_access_index = 1
      [ json_name = "block_access_index" ];
  google.protobuf.StringValue key = 2;
  google.protobuf.StringValue new_value = 3 [ json_name = "new_value" ];
}

message BlockAccessListBalanceChange {
  google.protobuf.UInt32Value block_access_index = 1
      [ json_name = "block_access_index" ];
  google.protobuf.StringValue post_balance = 2
      [ json_name = "post_balance" ];
}

message BlockAccessListNonceChange {
  google.protobuf.UInt32Value block_access_index = 1
      [ json_name = "block_access_index" ];
  google.protobuf.UInt64Value new_nonce = 2 [ json_name = "new_nonce" ];
}

message BlockAccessListCodeChange {
  google.protobuf.UInt32Value block_access_index = 1
      [ json_name = "block_access_index" ];
  google.protobuf.StringValue new_code = 2 [ json_name = "new_code" ];
}

message BlockAccessListStorageRead {
  google.protobuf.StringValue key = 1;
}

message BlockAccessListEntry {
  google.protobuf.StringValue address = 1;
  repeated BlockAccessListStorageChange storage_changes = 2
      [ json_name = "storage_changes" ];
  repeated BlockAccessListBalanceChange balance_changes = 3
      [ json_name = "balance_changes" ];
  repeated BlockAccessListNonceChange nonce_changes = 4
      [ json_name = "nonce_changes" ];
  repeated BlockAccessListCodeChange code_changes = 5
      [ json_name = "code_changes" ];
  repeated BlockAccessListStorageRead storage_reads = 6
      [ json_name = "storage_reads" ];
}

message BlockAccessList {
  repeated BlockAccessListEntry entries = 1;
}

// BlockAccessListChange is a denormalized representation of a single change
// within a block access list. Used for ClickHouse storage where each change
// becomes one row.
message BlockAccessListChange {
  google.protobuf.StringValue address = 1;
  // change_type is one of: "storage", "balance", "nonce", "code", "storage_read", "touched"
  string change_type = 2 [ json_name = "change_type" ];
  google.protobuf.UInt32Value block_access_index = 3
      [ json_name = "block_access_index" ];
  // storage_key is set only for storage changes
  google.protobuf.StringValue storage_key = 4 [ json_name = "storage_key" ];
  // new_value contains the new value for any change type
  google.protobuf.StringValue new_value = 5 [ json_name = "new_value" ];
}

// BlockAccessListSummary aggregates one block access list into per-block
// statistics. Counts cover the whole block; "changes" are records of state
// that the block modified, "reads" are slots that were only read.
message BlockAccessListSummary {
  // accounts_touched is the number of distinct addresses in the access list,
  // including accounts that were only read or touched.
  google.protobuf.UInt32Value accounts_touched = 1
      [ json_name = "accounts_touched" ];
  // storage_slots_changed is the number of distinct (address, slot) pairs
  // that were written at least once.
  google.protobuf.UInt32Value storage_slots_changed = 2
      [ json_name = "storage_slots_changed" ];
  // storage_changes is the number of individual storage write records
  // (one per slot and block access index).
  google.protobuf.UInt32Value storage_changes = 3
      [ json_name = "storage_changes" ];
  // storage_reads is the number of distinct (address, slot) pairs that were
  // read without being written.
  google.protobuf.UInt32Value storage_reads = 4
      [ json_name = "storage_reads" ];
  // balance_changes is the number of balance change records.
  google.protobuf.UInt32Value balance_changes = 5
      [ json_name = "balance_changes" ];
  // nonce_changes is the number of nonce change records.
  google.protobuf.UInt32Value nonce_changes = 6
      [ json_name = "nonce_changes" ];
  // code_changes is the number of code change records.
  google.protobuf.UInt32Value code_changes = 7
      [ json_name = "code_changes" ];
  // total_changes is storage_changes + balance_changes + nonce_changes +
  // code_changes.
  google.protobuf.UInt32Value total_changes = 8
      [ json_name = "total_changes" ];
  // bal_size_bytes is the length of the RLP encoded access list as carried in
  // the execution payload.
  google.protobuf.UInt32Value bal_size_bytes = 9
      [ json_name = "bal_size_bytes" ];
  // bal_hash is the keccak256 hash of the RLP encoded access list as carried
  // in the execution payload (hex encoded with 0x prefix).
  google.protobuf.StringValue bal_hash = 10 [ json_name = "bal_hash" ];
}
