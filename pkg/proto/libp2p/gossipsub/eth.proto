syntax = "proto3";

package xatu.libp2p.gossipsub.eth;

option go_package = "github.com/ethpandaops/xatu/pkg/proto/libp2p/gossipsub";

import "google/protobuf/wrappers.proto";

message BeaconBlock {
    google.protobuf.StringValue block = 1 [json_name = "block"];
    google.protobuf.UInt64Value slot = 2 [json_name = "slot"];
    google.protobuf.UInt64Value proposer_index = 3 [json_name = "proposer_index"];
}

message BlobSidecar {
    google.protobuf.UInt64Value index = 1 [json_name = "index"];
    google.protobuf.UInt64Value slot = 2 [json_name = "slot"];
    google.protobuf.UInt64Value proposer_index = 3 [json_name = "proposer_index"];
    google.protobuf.StringValue state_root = 4 [json_name = "state_root"];
    google.protobuf.StringValue parent_root = 5 [json_name = "parent_root"];
    google.protobuf.StringValue block_root = 6 [json_name = "block_root"];
}

message DataColumnSidecar {
    google.protobuf.UInt64Value index = 1 [json_name = "index"];
    google.protobuf.UInt64Value slot = 2 [json_name = "slot"];
    google.protobuf.UInt64Value proposer_index = 3 [json_name = "proposer_index"];
    google.protobuf.StringValue state_root = 4 [json_name = "state_root"];
    google.protobuf.StringValue parent_root = 5 [json_name = "parent_root"];
    google.protobuf.UInt32Value kzg_commitments_count = 6 [json_name = "kzg_commitments_count"];
    google.protobuf.StringValue block_root = 7 [json_name = "block_root"];
}

// EIP-7732 ePBS gossipsub types

// ExecutionPayloadEnvelope is a summary of a SignedExecutionPayloadEnvelope
// received on the execution_payload gossipsub topic.
message ExecutionPayloadEnvelope {
    google.protobuf.UInt64Value slot = 1 [json_name = "slot"];
    google.protobuf.UInt64Value builder_index = 2 [json_name = "builder_index"];
    google.protobuf.StringValue beacon_block_root = 3 [json_name = "beacon_block_root"];
    google.protobuf.StringValue block_hash = 4 [json_name = "block_hash"];
    google.protobuf.StringValue state_root = 5 [json_name = "state_root"];
}

// ExecutionPayloadBid is a summary of a SignedExecutionPayloadBid
// received on the execution_payload_bid gossipsub topic.
message ExecutionPayloadBid {
    google.protobuf.UInt64Value slot = 1 [json_name = "slot"];
    google.protobuf.UInt64Value builder_index = 2 [json_name = "builder_index"];
    google.protobuf.StringValue block_hash = 3 [json_name = "block_hash"];
    google.protobuf.StringValue parent_block_hash = 4 [json_name = "parent_block_hash"];
    google.protobuf.UInt64Value value = 5 [json_name = "value"];
    google.protobuf.UInt64Value execution_payment = 6 [json_name = "execution_payment"];
    google.protobuf.StringValue fee_recipient = 7 [json_name = "fee_recipient"];
    google.protobuf.UInt64Value gas_limit = 8 [json_name = "gas_limit"];
    google.protobuf.UInt32Value blob_kzg_commitment_count = 9 [json_name = "blob_kzg_commitment_count"];
}

// PayloadAttestationMessage is a summary of a PayloadAttestationMessage
// received on the payload_attestation_message gossipsub topic.
message PayloadAttestationMessage {
    google.protobuf.UInt64Value slot = 1 [json_name = "slot"];
    google.protobuf.UInt64Value validator_index = 2 [json_name = "validator_index"];
    google.protobuf.StringValue beacon_block_root = 3 [json_name = "beacon_block_root"];
    google.protobuf.BoolValue payload_present = 4 [json_name = "payload_present"];
    google.protobuf.BoolValue blob_data_available = 5 [json_name = "blob_data_available"];
}

// ProposerPreferences is a summary of a SignedProposerPreferences
// received on the proposer_preferences gossipsub topic.
message ProposerPreferences {
    google.protobuf.UInt64Value slot = 1 [json_name = "slot"];
    google.protobuf.UInt64Value validator_index = 2 [json_name = "validator_index"];
    google.protobuf.StringValue fee_recipient = 3 [json_name = "fee_recipient"];
    google.protobuf.UInt64Value target_gas_limit = 4 [json_name = "target_gas_limit"];
}

// MessagePayload carries the raw wire bytes of a gossipsub message, regardless
// of topic. The bytes are stored exactly as received off the wire (snappy-framed
// SSZ), so the archive stays byte-faithful and fork-agnostic.
message MessagePayload {
    // Data is the raw gossipsub message payload as received off the wire.
    bytes data = 1 [json_name = "data"];
    // Outcome is the gossip validation outcome for the message: "deliver" or "reject".
    google.protobuf.StringValue outcome = 2 [json_name = "outcome"];
    // RejectReason is the validation rejection reason. Empty for delivered messages.
    google.protobuf.StringValue reject_reason = 3 [json_name = "reject_reason"];
}

// PartialDataColumn is one gossipsub partial messages extension RPC part on a data column topic.
message PartialDataColumn {
    // Direction is RECV, SEND or DROP.
    google.protobuf.StringValue direction = 1 [json_name = "direction"];
    // CapturePoint is WIRE when read from the raw RPC, APP when read after the gossipsub router filtered it.
    google.protobuf.StringValue capture_point = 2 [json_name = "capture_point"];
    google.protobuf.StringValue group_id = 3 [json_name = "group_id"];
    // GroupVersion is the group ID version byte: 0 for fulu, 1 for gloas.
    google.protobuf.UInt32Value group_version = 4 [json_name = "group_version"];
    google.protobuf.StringValue block_root = 5 [json_name = "block_root"];
    google.protobuf.UInt64Value column_index = 6 [json_name = "column_index"];
    google.protobuf.BoolValue has_message = 7 [json_name = "has_message"];
    google.protobuf.UInt32Value cells_count = 8 [json_name = "cells_count"];
    // CellsBitmap is the hex encoded SSZ cells_present_bitmap.
    google.protobuf.StringValue cells_bitmap = 9 [json_name = "cells_bitmap"];
    // BitmapLength is the bitlist length, equal to the block's blob count.
    google.protobuf.UInt32Value bitmap_length = 10 [json_name = "bitmap_length"];
    google.protobuf.BoolValue has_header = 11 [json_name = "has_header"];
    google.protobuf.UInt32Value kzg_commitments_count = 12 [json_name = "kzg_commitments_count"];
    google.protobuf.UInt64Value proposer_index = 13 [json_name = "proposer_index"];
    google.protobuf.BoolValue has_metadata = 14 [json_name = "has_metadata"];
    google.protobuf.UInt32Value metadata_size = 15 [json_name = "metadata_size"];
    google.protobuf.UInt32Value metadata_available_count = 16 [json_name = "metadata_available_count"];
    google.protobuf.UInt32Value metadata_requests_count = 17 [json_name = "metadata_requests_count"];
    // MetadataAvailable is the hex encoded SSZ parts metadata available bitlist.
    google.protobuf.StringValue metadata_available = 18 [json_name = "metadata_available"];
    // MetadataRequests is the hex encoded SSZ parts metadata requests bitlist.
    google.protobuf.StringValue metadata_requests = 19 [json_name = "metadata_requests"];
}

// DataColumnCompleted records a custody data column becoming fully available to the node, by whatever path.
message DataColumnCompleted {
    google.protobuf.StringValue block_root = 1 [json_name = "block_root"];
    google.protobuf.UInt64Value column_index = 2 [json_name = "column_index"];
    // CompletedVia is FULL_GOSSIP, PARTIAL_GOSSIP, EL, RECONSTRUCTION or UNKNOWN.
    google.protobuf.StringValue completed_via = 3 [json_name = "completed_via"];
    google.protobuf.UInt32Value cells_total = 4 [json_name = "cells_total"];
    google.protobuf.UInt32Value cells_from_gossip = 5 [json_name = "cells_from_gossip"];
    google.protobuf.UInt32Value cells_from_el = 6 [json_name = "cells_from_el"];
    google.protobuf.UInt32Value contributing_peers = 7 [json_name = "contributing_peers"];
    google.protobuf.UInt32Value kzg_commitments_count = 8 [json_name = "kzg_commitments_count"];
}

// PartialDataColumnOutcome is the validation verdict for one received partial data column message.
message PartialDataColumnOutcome {
    google.protobuf.StringValue group_id = 1 [json_name = "group_id"];
    google.protobuf.StringValue block_root = 2 [json_name = "block_root"];
    google.protobuf.UInt64Value column_index = 3 [json_name = "column_index"];
    // Stage is DECODE, HEADER or CELLS.
    google.protobuf.StringValue stage = 4 [json_name = "stage"];
    // Outcome is ACCEPT, IGNORE or REJECT.
    google.protobuf.StringValue outcome = 5 [json_name = "outcome"];
    google.protobuf.StringValue reason = 6 [json_name = "reason"];
    google.protobuf.UInt32Value cells_count = 7 [json_name = "cells_count"];
    google.protobuf.UInt32Value new_cells_count = 8 [json_name = "new_cells_count"];
}
